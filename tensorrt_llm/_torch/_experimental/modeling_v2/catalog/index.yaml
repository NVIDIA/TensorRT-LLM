# Catalog Index
#
# Quick-reference for entry discovery. The path (relative to catalog/) is the
# unique identifier; the directory encodes the category. Synced manually after
# catalog changes.
#
# The catalog is the vocabulary of target modeling code that is ours: every
# trtllm op a target calls must be an entry. Native torch calls, tensor
# metadata reads (.shape/.dtype/.device) and Python control flow live outside,
# because nothing here would be stating anything about them that torch does
# not already state better.
#
# AN ENTRY SPANS TWO TREES. The contract (.md) and the wrapper (.py) are here;
# the GPU test is at
# tests/unittest/_torch/modeling_v2/<category>/test_modeling_v2_<entry>.py, because
# that is the tree this repo's CI collects from -- a test inside the package is
# not picked up by any list. The receipt rule is unchanged in substance and
# only gains a second directory to look in: a receipt is valid only if it
# post-dates the last write to *every* file of the entry, contract and wrapper
# and test alike. Check it mechanically against both paths.
#
# The tests are named test_modeling_v2_* rather than test_<entry>: three of them
# would otherwise collide with an upstream test of the same basename, and more
# importantly they are not duplicates of those -- upstream covers the modules
# that wrap these ops, these cover the op itself cell by cell.
#
# Native torch calls are not entries. This catalog used to mirror eleven of
# them -- torch.cat, torch.reshape, Tensor.copy_ and so on -- one file each,
# every file a single forwarding line. They carried no contract doc, no test
# and no certification, because upstream owns their correctness and there was
# nothing left for an entry to say. A target now calls torch directly, which
# is both shorter and the thing a reader already knows how to look up.
#
# An entry is therefore always a trtllm op: something whose behaviour is ours
# to state and ours to prove.
#
# ── RECEIPT STATUS: all 19 entries certified on sm_103 ────────────────────
#
# A receipt says this entry's test passed on a stated GPU architecture. The
# architecture is the whole key: it is a real axis -- see the
# mxe4m3_mxe2m1_block_scale_moe_runner note below, where two architectures
# compute bit-different results -- and CI cannot stand in for it unless CI
# runs on every one. Staying current with the trunk is not a receipt's job:
# there is no external pin left to drift against, and the catalog tests run
# in pre-merge, so the trunk proves itself on every commit.
#
# The migration rewrote every test file and moved the targets from sm_100
# (B200) to sm_103 (GB300), so the whole set was re-run on GB300. **All 19
# pass**; per-entry counts are in each contract's `receipts:` frontmatter.
# The sm_100 receipts were dropped rather than carried -- they predate every
# file of the entries they sat in, and no sm_100 machine is in CI to re-take
# them on. A missing arch key reads as unknown, which is the honest state.
#
# Getting there surfaced four real differences, none of which was fixed by
# widening a tolerance:
#
#   * thop_attention, mla_rope_generation, mla_rope_append_paged_kv_assign_q
#     -- op schema drift (renamed and added parameters). The wrappers now
#     mirror their schemas argument for argument, so the next drift fails
#     loudly instead of shifting a positional list.
#
#   * mxe4m3_mxe2m1_block_scale_moe_runner -- the FC1 epilogue's MXFP8 block
#     scale is `floor(log2(amax))-8` on sm_100 and `ceil(log2(amax/448))` on
#     sm_103, bit-exactly. The reference is now architecture-keyed and each
#     architecture refutes the other's recipe. See that contract.
#
#   * cublas_mm -- torch 2.12 made fp32 matmul default to TF32, so the
#     *reference* was the imprecise side. The op is bit-identical to a
#     TF32-disabled torch product. See that contract.
#
# The "measured on sm_100" statements throughout the contracts are left
# exactly as written. They are true records of what was observed on another
# device, and rewriting them would manufacture GB300 evidence that does not
# exist. Read them as provenance; the frontmatter is the certification.
# ──────────────────────────────────────────────────────────────────────────
#
# 30 of the source catalog's 43 entries are here — the union of what the two
# migrated targets call. The 13 left behind (silu_and_mul, attn_custom_op_inplace,
# create_attn_outputs, create_mla_outputs, load_chunked_kv_cache_for_mla,
# merge_chunked_attention_for_mla, cute_dsl_bf16_gemm_blackwell,
# flashinfer_fused_add_rmsnorm_quant, flashinfer_gemma_rmsnorm,
# flashinfer_gemma_fused_add_rmsnorm, bf16_mxe2m1_block_scale_moe_runner,
# renorm_moe_routing_op, allreduce) must arrive with their contract AND their
# receipt when a later target needs them: a wrapper on its own would let that
# target consume an op with no certification record at all.

entries:
  # ─── torch (native callables, trtllm-free) ────────────────────
  - path: norm/flashinfer_rmsnorm.py
    impl: torch.ops.trtllm.flashinfer_rmsnorm
    summary: "RMS normalization over the last dim with elementwise weight scaling"

  - path: norm/flashinfer_fused_add_rmsnorm.py
    impl: torch.ops.trtllm.flashinfer_fused_add_rmsnorm
    summary: "In-place fused residual add + RMS norm: residual += x; x = rmsnorm(residual) * weight"

  # ─── activation ────────────────────────────────────────────────
  - path: activation/flashinfer_silu_and_mul.py
    impl: torch.ops.trtllm.flashinfer_silu_and_mul
    summary: "SwiGLU activation: silu(x[..., :d]) * x[..., d:] over a packed gate/up last dim"

  # ─── gemm ──────────────────────────────────────────────────────
  - path: gemm/cublas_mm.py
    impl: torch.ops.trtllm.cublas_mm
    summary: "General matmul via one cuBLASLt call with optional fused bias: [M,K] @ [K,N] col-major (+ bias), fp32 accumulation"

  - path: gemm/nvfp4_gemm.py
    impl: torch.ops.trtllm.nvfp4_gemm
    summary: "NVFP4 x NVFP4 dense GEMM in nn.Linear layout with in-kernel block-scale dequantization: alpha * ([M,K/2] e2m1 + 128x4-swizzled e4m3 scales) @ ([N,K/2] e2m1 + swizzled scales)^T (+ per-column bias) -> fresh [M,N] bf16/fp16/fp32 buffer, fp32 accumulation, backend auto-selected (cutlass/cublaslt/cuda_core/cutedsl)"

  # ─── attention ─────────────────────────────────────────────────
  - path: attention/thop_attention.py
    impl: tensorrt_llm.bindings.internal.thop.attention
    summary: "Full attention core with fully explicit state (pybind binding, approved exception): paged KV-cache append + causal/padding-masked GQA FMHA over a caller-owned pool (bf16, or fp8-e4m3 with per-tensor kv scales) and explicit length/offset tensors, written into a caller buffer, on either context execution path (use_paged_context_fmha selects packed-QKV context FMHA, or paged-KV context FMHA so a context call may run over a cached prefix — KV-cache reuse and chunked prefill), with optional per-query-head attention sinks (one extra softmax-denominator logit, dropped from the output) and an optional per-call sliding window (attention_window_size keys ending at the query's absolute position; a pure mask — the append stays at absolute positions, so cyclic pool reuse is the caller's page mapping); MLA mode runs context prefill (in-kernel RoPE + latent append), no-append context over explicit K/V (latent_cache=None: cached-KV prefixes and chunked partial passes with softmax-stats output), and generation latent-MQA decode as separate calls over a paged latent pool (bf16 or fp8-e4m3)"

  # ─── moe ───────────────────────────────────────────────────────
  # ─── quantization ──────────────────────────────────────────────
  # ─── comm ──────────────────────────────────────────────────────
  - path: comm/allgather.py
    impl: torch.ops.trtllm.allgather
    summary: "All-gather over a group of MPI-session ranks into a fresh tensor: every rank's rows concatenated along dim 0 in ascending rank order, uniform (sizes=None) or ragged (per-rank row counts in `sizes`, as attention data parallelism produces); a byte-exact move in every dtype, no workspace and no strategy, capturable in a CUDA graph once the group's communicator exists (a captured ragged split is frozen at capture); inside a trtllm serving engine under attention DP the communicator carries the caller's calls only — the runtime synchronizes its ranks with host-side MPI on a different one — and calls pair by position, so ranks that disagree on call order get silently wrong data rather than a hang whenever the mispaired calls move the same number of bytes"

  - path: comm/reducescatter.py
    impl: torch.ops.trtllm.reducescatter
    summary: "Summing reduce-scatter over a group of MPI-session ranks into a fresh tensor: every rank's tensor summed elementwise, then split along dim 0 in ascending rank order so each rank keeps its own rows, even (sizes=None) or uneven (per-rank row counts in `sizes`, as attention data parallelism produces); the sum is accumulated in the input dtype in a destination-dependent ring order — deterministic and replay-reproducible, but not the correctly rounded fp32 sum — and float8_e4m3fn is summed as raw bytes rather than as floats; calls pair by position on the communicator whichever `sizes` form they take, and because this one computes, ranks that disagree on call order make every rank wrong nearly everywhere rather than a quarter of the way — silently, and bitwise reproducibly, whenever the mispaired calls move the same number of bytes, hanging only when they do not"
