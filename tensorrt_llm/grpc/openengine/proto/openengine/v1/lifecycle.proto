// Health, abort, and engine shutdown operations.

syntax = "proto3";

package openengine.v1;

import "openengine/v1/kv.proto";
import "openengine/v1/server.proto";

message HealthRequest {
  // False means a lightweight readiness/liveness check. True asks the engine to
  // run a role-appropriate minimal inference probe and report it as a check.
  bool include_inference_probe = 1;

  // Optional. Used when include_inference_probe is true. Empty means engine
  // default served model.
  string model = 2;

  // Optional expected role for role-specific inference probes.
  EngineRole role = 3;
}

message HealthResponse {
  HealthState state = 1;
  repeated HealthCheck checks = 2;
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_STARTING = 1;
  HEALTH_STATE_READY = 2;
  HEALTH_STATE_DEGRADED = 3;
  HEALTH_STATE_NOT_READY = 4;
}

message HealthCheck {
  string name = 1; // grpc, scheduler, model, kv_connector, role, inference_probe
  HealthState state = 2;
  string message = 3;
}

message AbortRequest {
  oneof target {
    string request_id = 1;
    KvSessionRef kv_session = 2;
    AllRequests all_requests = 3;
  }
}

message AllRequests {}

message AbortResponse {
  AbortStatus status = 1;
  string message = 2;
}

enum AbortStatus {
  ABORT_STATUS_UNSPECIFIED = 0;
  ABORT_STATUS_ABORTED = 1;
  ABORT_STATUS_ALREADY_FINISHED = 2;
}

message ShutdownRequest {
  // Required. Must equal ServerInfo.instance_id for the intended engine lifetime.
  // Empty returns INVALID_ARGUMENT; a mismatch returns FAILED_PRECONDITION.
  // Neither rejection may change admission, health, or engine lifecycle state.
  string expected_instance_id = 1;
}

message ShutdownResponse {
  ShutdownStatus status = 1;
  // The engine lifetime that accepted shutdown, equal to expected_instance_id.
  string instance_id = 2;
}

enum ShutdownStatus {
  SHUTDOWN_STATUS_UNSPECIFIED = 0;
  // Shutdown is committed to the lifecycle owner, independently of RPC
  // cancellation. New inference and inference probes are no longer admitted.
  // This acknowledges acceptance, not completed cleanup or process exit.
  SHUTDOWN_STATUS_ACCEPTED = 1;
  // This same engine lifetime is already stopping. No additional cleanup starts.
  SHUTDOWN_STATUS_ALREADY_STOPPING = 2;
}
