syntax = "proto3";

package trtllm.openengine.v1;

import "openengine/v1/generation.proto";

// TensorRT-LLM peer transfer; separate from the portable OpenEngine services.
service EncoderTransfer {
  // Success means the native transfer completed. An uncertain outcome cannot
  // safely be retried with the same single-use reference.
  rpc Transfer(TransferEncoderCacheRequest) returns (TransferEncoderCacheResponse);
}

message TransferEncoderCacheRequest {
  .openengine.v1.EncoderCacheRef cache = 1;
  bytes destination = 2;
}

message TransferEncoderCacheResponse {}
