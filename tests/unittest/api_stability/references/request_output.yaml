methods:
  __init__:
    parameters: {}
    return_annotation: None
  abort:
    parameters: {}
    return_annotation: None
  aborted:
    parameters: {}
    return_annotation: bool
  clear_logprob_params:
    parameters: {}
    return_annotation: None
  export_multimodal_handoff:
    parameters: {}
    return_annotation: Optional[tensorrt_llm.disaggregated_params.DisaggregatedParams]
