[pytest]
xdist_start_method = spawn
asyncio_default_fixture_loop_scope = module
log_format = %(asctime)s.%(msecs)03d %(levelname)-8s %(name)s:%(filename)s:%(lineno)d %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
threadleak = True
# ThreadPoolExecutor-\d+_\d+ excludes worker threads leaked by torch._dynamo/torch.compile.
# Thread-\d+ \(_manager_spawn\) is the MPIPoolExecutor manager thread of a pool cached
# for reuse by the NEXT test (or prefetched in the background for it);
# session-reuse-* are the reuse layer's own threads (tests/test_common/session_reuse.py)
# and session-prefetch-* are the prefetcher's (tests/test_common/session_prefetcher.py);
# they legitimately outlive the test they start under.
threadleak_exclude = asyncio_\d+|rpc_client_loop|rpc_client_worker_\d+|rpc_server_worker_\d+|InductorSubproc|subproc_worker_timer|ThreadPoolExecutor-\d+_\d+|Thread-\d+ \(_manager_spawn\)|session-reuse-\w+|session-prefetch-\w+
addopts = --durations=0 -W ignore::DeprecationWarning -p test_common.magic_import_hooks -p test_common.session_reuse_hooks -p test_common.s3_output_hooks
# Only tests/ remains: the -p test_common.* plugins in addopts are imported at
# preparse, before any conftest or declaration can run. Everything else that
# used to live here is now declared per-file or per-directory with
# __extra_import_path__ (see tests/test_common/magic_import.py).
pythonpath =
    ../
env =
    D:AUTO_DEPLOY_LOG_LEVEL=INFO
markers =
    part0
    part1
    part2
    part3
    part4
    part5
    cpu_only: this test does not require a GPU to run
    gpu2: this test uses 2 GPUs
    gpu4: this test uses 4 GPUs
    post_merge: this test should only run in post merge
    high_cuda_memory: this test uses a lot of CUDA memory (typically more than 12GB)
    no_xdist: this test should not run when using pytest-xdist
    ray: mark Ray-based tests
    mpi_ray_parity: parametrize a test to also run with Ray executor variant
