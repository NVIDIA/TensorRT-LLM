;
; This file's existence makes this directory the rootdir, and so the
; confcutdir: conftest discovery stops here and never reaches
; `tests/conftest.py`, which pulls in torch and the TensorRT-LLM wheel.

[pytest]
; Relative to this rootdir. `../..` reaches `tests/`, which makes
; `-p qa_selection.plugin` resolvable without exporting PYTHONPATH;
; `.` makes framework.py importable from conftest.py.
pythonpath = . ../..

; The modules in `cases/` are collected by the run under test, not by this
; suite. `.*` restores what the default would have given.
norecursedirs = .* cases

; No `--strict-markers`: the mock modules carry `skip_less_device` and friends,
; which the plugin declares in pytest_configure -- so a plugin-absent run
; (AC-6) necessarily sees them undeclared.
