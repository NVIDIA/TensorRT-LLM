# GLM-5.3 NVFP4, GB300 AgentX replay: DEP4 ctx + TEP8 gen, MTP5.
# One 4-GPU ctx worker and one 8-GPU gen worker use 12 GPUs in total.
# Concurrency 20 is the deployment total. The trace controls turn lengths.
# Forced accepted draft count 2.48 corresponds to golden MTP5 AL 3.48.
# Remove the forced-acceptance environment variables for natural acceptance.
metadata:
  model_name: glm_5.3_nvfp4
  precision: fp4
  model_dir_name: GLM-5.3-NVFP4
  architecture: GlmMoeDsaForCausalLM
  supported_gpus:
  - GB300
  benchmark_type: agentx
  script_file: disaggr_torch.slurm
slurm:
  script_file: disaggr_torch.slurm
  partition: <partition>
  account: <account>
  job_time: 05:00:00
  job_name: glm53-agentx
  extra_args: --gres=gpu:4
  numa_bind: true
benchmark:
  mode: e2e
  use_nv_sa_benchmark: false
  benchmark_client: agentx
  multi_round: 1
  benchmark_ratio: 0.0
  streaming: true
  concurrency_list: '20'
  # Envelope metadata only; AgentX replays actual turn lengths from the corpus.
  input_length: 1040384
  output_length: 8192
  dataset_file: semianalysis_cc_traces_weka_062126
hardware:
  gpus_per_node: 4
  num_ctx_servers: 1
  num_gen_servers: 1
environment:
  container_mount: <container_mount>
  container_image: <container_image>
  model_path: <model_path>
  trtllm_repo: ''
  build_wheel: false
  work_dir: <full_path_to_work_dir>
  client_env_var: AGENTX_TIMEOUT_GRACE=5400 AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID=true
  worker_env_var: ENROOT_ALLOW_DEV=yes PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True TRTLLM_DSA_INDEXER_BF16=1
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS=2.48
profiling:
  nsys_on: false
ctx_router_config:
  type: conversation
server_config_extra:
  gen_strip_message_history: true
  gen_tokids_ctxbytes: true
  server_keep_alive_timeout: 14400
  conversation_affinity_header_for_subagents: X-Dynamo-Parent-Session-ID
  subagent_affinity_scope: context
worker_config:
  gen:
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      agent_bounce_buffer_enable: true
      agent_bounce_params:
        max_average_descriptor_size: 4MB
        min_descriptor_count: '1'
      kv_cache_bounce_size_mb: 1024
      max_tokens_in_buffer: 1048576
      kv_transfer_timeout_ms: 600000
    cuda_graph_config:
      enable_padding: true
      batch_sizes:
      - 1
      - 2
      - 4
      - 5
    enable_attention_dp: false
    trust_remote_code: true
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: false
      event_buffer_max_size: 0
      free_gpu_memory_fraction: 0.8
      tokens_per_block: 64
    max_num_tokens: 128
    max_seq_len: 1048576
    moe_config:
      backend: TRTLLM
      use_low_precision_moe_combine: true
    num_postprocess_workers: 4
    pipeline_parallel_size: 1
    enable_iter_perf_stats: true
    print_iter_log: true
    return_perf_metrics: false
    sparse_attention_config:
      algorithm: dsa
      enable_heuristic_topk: true
      use_cute_dsl_paged_mqa_logits: true
      use_cute_dsl_topk: true
    speculative_config:
      decoding_type: MTP
      max_draft_len: 5
    stream_interval: 20
    max_batch_size: 5
    moe_expert_parallel_size: 8
    tensor_parallel_size: 8
  ctx:
    attention_dp_config:
      enable_kv_cache_aware_routing: false
      kv_cache_routing_conversation_affinity: true
      kv_cache_routing_max_sessions: 65536
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      agent_bounce_buffer_enable: true
      agent_bounce_params:
        max_average_descriptor_size: 4MB
        min_descriptor_count: '1'
      kv_cache_bounce_size_mb: 1024
      max_tokens_in_buffer: 1048576
      kv_transfer_timeout_ms: 600000
    cuda_graph_config: null
    disable_overlap_scheduler: false
    enable_attention_dp: true
    enable_chunked_prefill: true
    trust_remote_code: true
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: true
      event_buffer_max_size: 0
      free_gpu_memory_fraction: 0.75
      host_cache_size: 137438953472
      tokens_per_block: 64
    max_batch_size: 256
    max_num_tokens: 8192
    max_seq_len: 1048576
    moe_config:
      backend: CUTEDSL
    moe_expert_parallel_size: 4
    num_postprocess_workers: 8
    pipeline_parallel_size: 1
    enable_iter_perf_stats: true
    print_iter_log: true
    return_perf_metrics: false
    scheduler_config:
      capacity_scheduler_policy: MAX_UTILIZATION
    sparse_attention_config:
      algorithm: dsa
      enable_heuristic_topk: true
    speculative_config:
      decoding_type: MTP
      max_draft_len: 5
    tensor_parallel_size: 4
