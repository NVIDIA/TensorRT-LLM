metadata:
  model_name: musespark_open_nvfp4
  precision: fp4
  model_dir_name: Muse-Spark-Open-816B-A42B-NVFP4
  supported_gpus:
  - GB300
  - VR200
slurm:
  timeout: 14400
  numa_bind: false
hardware:
  gpus_per_node: 4
  num_ctx_servers: 1
  num_gen_servers: 1
benchmark:
  mode: e2e
  concurrency_list: '1'
  input_length: 1024
  output_length: 256
  multi_round: 1
  only_run_accuracy: true
environment:
  worker_env_var: TRTLLM_ENABLE_PDL=1 TRTLLM_SKIP_KV_CACHE_ESTIMATION=1 MUSESPARK_OPEN_SM107_FUSED_KERNELS=1
    TRTLLM_DFLASH_WINDOWED_CTX_ARENA=1 UCX_TLS=cuda_copy,cuda_ipc,sm,self,tcp TRTLLM_LOW_M_GEMM_BACKEND=auto
    MUSESPARK_OPEN_ALLREDUCE=MNNVL MUSESPARK_OPEN_FUSED_FINALIZE_AR_MNNVL=1 MUSESPARK_OPEN_SHARDED_PROJECTIONS=1
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS=0 TRTLLM_MODELING_V2_VALIDATE=1
  ctx_worker_env_var: MUSESPARK_OPEN_LEVER__ROLE=ctx
  gen_worker_env_var: MUSESPARK_OPEN_LEVER__ROLE=gen
accuracy:
  enable_accuracy_test: true
  pytest_nodeid: accuracy/test_musespark_open_disaggregated.py
worker_config:
  ctx:
    tensor_parallel_size: 4
    moe_expert_parallel_size: 4
    enable_attention_dp: false
    custom_tokenizer: musespark_open
    trust_remote_code: true
    modeling_v2: require
    max_batch_size: 16
    max_num_tokens: 8192
    max_seq_len: 8192
    enable_chunked_prefill: true
    disable_overlap_scheduler: true
    attn_backend: TRTLLM
    allreduce_strategy: NCCL
    moe_config:
      backend: TRTLLM
    cuda_graph_config: null
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: true
      free_gpu_memory_fraction: 0.8
      tokens_per_block: 32
      use_kv_cache_manager_v2: true
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      max_tokens_in_buffer: 8192
    speculative_config:
      decoding_type: DFlash
      max_draft_len: 7
      speculative_model: Muse-Spark-Open-816B-A42B-DFlash2
      use_rejection_sampling: true
    enable_iter_perf_stats: false
    iter_stats_max_iterations: -1
    max_stats_len: -1
  gen:
    tensor_parallel_size: 4
    moe_expert_parallel_size: 4
    enable_attention_dp: false
    custom_tokenizer: musespark_open
    trust_remote_code: true
    modeling_v2: require
    max_batch_size: 16
    max_num_tokens: 1024
    max_seq_len: 8192
    enable_chunked_prefill: true
    disable_overlap_scheduler: false
    attn_backend: TRTLLM
    allreduce_strategy: NCCL
    moe_config:
      backend: TRTLLM
    cuda_graph_config:
      batch_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      enable_padding: true
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: true
      free_gpu_memory_fraction: 0.8
      tokens_per_block: 32
      use_kv_cache_manager_v2: true
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      max_tokens_in_buffer: 8192
    speculative_config:
      decoding_type: DFlash
      max_draft_len: 7
      speculative_model: Muse-Spark-Open-816B-A42B-DFlash2
      use_rejection_sampling: true
    enable_iter_perf_stats: true
    iter_stats_max_iterations: -1
    max_stats_len: -1
