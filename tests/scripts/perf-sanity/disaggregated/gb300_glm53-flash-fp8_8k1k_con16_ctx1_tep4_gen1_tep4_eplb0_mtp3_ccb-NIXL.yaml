# GLM-5.3-Flash FP8 (Glm5NextForConditionalGeneration), disaggregated E2E, 8K ISL /
# 1K OSL at concurrency 16, on two 4xGB300 trays: 1 ctx worker + 1 gen worker, each
# TP4 / EP4. This is the disaggregated recipe of the GLM-5.3-Flash deployment guide:
# the Python NIXL transceiver on both workers, MTP3 on both, and the ctx worker
# without the overlap scheduler or CUDA graphs. The engine settings otherwise follow
# the aggregated tp4_mtp3 case (gb300_glm53_flash_fp8_grace_blackwell.yaml), which
# runs the same load, so the two can be compared: TRTLLM MoE, BF16 KV (the
# checkpoint sets no KV quantization, so `auto` is BF16), 128-token blocks, and the
# accepted draft length pinned to 2.384 of 3 on the gen worker.
metadata:
  model_name: glm_5.3_flash_fp8
  precision: fp8
  model_dir_name: GLM-5.3-Flash
  architecture: Glm5NextForConditionalGeneration
  supported_gpus:
  - GB300
  script_file: disaggr_torch.slurm
  benchmark_type: 8k1k
slurm:
  script_file: disaggr_torch.slurm
  partition: <partition>
  account: <account>
  job_time: 02:00:00
  job_name: unified-benchmark
  extra_args: --gres=gpu:4
  numa_bind: true
benchmark:
  mode: e2e
  use_nv_sa_benchmark: false
  multi_round: 5
  benchmark_ratio: 0.0
  streaming: true
  concurrency_list: '16'
  input_length: 8192
  output_length: 1024
  dataset_file: <dataset_file>
hardware:
  gpus_per_node: 4
  num_ctx_servers: 1
  num_gen_servers: 1
environment:
  container_mount: <container_mount>
  container_image: <container_image>
  model_path: <model_path>
  trtllm_repo: ''
  build_wheel: false
  work_dir: <full_path_to_work_dir>
  worker_env_var: TLLM_LOG_LEVEL=INFO TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_WORKER_DISABLE_GC=1 TRTLLM_ENABLE_PDL=1 ENROOT_ALLOW_DEV=yes PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  gen_worker_env_var: TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS=2.384
  server_env_var: TRTLLM_SERVER_DISABLE_GC=1
profiling:
  nsys_on: false
worker_config:
  gen:
    print_iter_log: true
    max_batch_size: 32
    max_num_tokens: 512
    max_seq_len: 9344
    tensor_parallel_size: 4
    moe_expert_parallel_size: 4
    pipeline_parallel_size: 1
    context_parallel_size: 1
    enable_attention_dp: false
    trust_remote_code: true
    disable_mm_encoder: true
    cuda_graph_config:
      enable_padding: true
      batch_sizes: [1, 2, 4, 8, 12, 16, 20, 24, 28, 32]
    kv_cache_config:
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.6
      dtype: auto
      tokens_per_block: 128
    moe_config:
      backend: TRTLLM
    cache_transceiver_config:
      kv_transfer_timeout_ms: 600000
      backend: NIXL
      transceiver_runtime: PYTHON
    disable_overlap_scheduler: false
    speculative_config: &id001
      decoding_type: MTP
      max_draft_len: 3
    num_postprocess_workers: 4
    stream_interval: 20
  ctx:
    print_iter_log: true
    max_batch_size: 4
    max_num_tokens: 16384
    max_seq_len: 9344
    tensor_parallel_size: 4
    moe_expert_parallel_size: 4
    pipeline_parallel_size: 1
    context_parallel_size: 1
    enable_attention_dp: false
    trust_remote_code: true
    disable_mm_encoder: true
    cuda_graph_config: null
    kv_cache_config:
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.6
      dtype: auto
      tokens_per_block: 128
    moe_config:
      backend: TRTLLM
    cache_transceiver_config:
      kv_transfer_timeout_ms: 600000
      backend: NIXL
      transceiver_runtime: PYTHON
    disable_overlap_scheduler: true
    speculative_config: *id001
