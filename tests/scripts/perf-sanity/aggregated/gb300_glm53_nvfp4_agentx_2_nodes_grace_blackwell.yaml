# GLM-5.3 NVFP4, GB300 AgentX replay: TEP8, MTP5, concurrency 20.
# One aggregated server spans two 4-GPU nodes (8 GPUs total).
# Forced accepted draft count 2.48 corresponds to golden MTP5 AL 3.48.
# Remove the forced-acceptance environment variable for natural acceptance.
metadata:
  model_name: glm_5.3_nvfp4
  precision: fp4
  model_dir_name: GLM-5.3-NVFP4
  architecture: GlmMoeDsaForCausalLM
  supported_gpus:
  - GB300
  benchmark_type: agentx
hardware:
  gpus_per_node: 4
server_configs:
- cuda_graph_config:
    enable_padding: true
    batch_sizes:
    - 1
    - 2
    - 4
    - 5
    - 8
    - 12
    - 16
    - 20
  enable_attention_dp: false
  trust_remote_code: true
  kv_cache_config:
    dtype: fp8
    enable_block_reuse: true
    event_buffer_max_size: 0
    free_gpu_memory_fraction: 0.75
    tokens_per_block: 64
    host_cache_size: 137438953472
  max_num_tokens: 8192
  max_seq_len: 1048576
  moe_config:
    backend: TRTLLM
    use_low_precision_moe_combine: true
  num_postprocess_workers: 4
  pipeline_parallel_size: 1
  enable_iter_perf_stats: true
  print_iter_log: true
  return_perf_metrics: false
  sparse_attention_config:
    algorithm: dsa
    enable_heuristic_topk: true
    use_cute_dsl_paged_mqa_logits: true
    use_cute_dsl_topk: true
  speculative_config:
    decoding_type: MTP
    max_draft_len: 5
  stream_interval: 20
  max_batch_size: 20
  moe_expert_parallel_size: 8
  tensor_parallel_size: 8
  name: glm53_nvfp4_tep8_mtp5_con20_agentx
  model_name: glm_5.3_nvfp4
  gpus: 8
  enable_chunked_prefill: true
  disable_overlap_scheduler: false
  server_env_var: HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 TQDM_DISABLE=1 HF_HUB_DISABLE_PROGRESS_BARS=1
    TLLM_LOG_LEVEL=INFO TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_WORKER_DISABLE_GC=1 TRTLLM_ENABLE_PDL=1 NCCL_GRAPH_MIXING_SUPPORT=0
    MIMALLOC_PURGE_DELAY=0 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True TRTLLM_FUSED_DSA_METADATA=1
    TRTLLM_DSA_INDEXER_BF16=1 TRTLLM_SERVE_ENABLE_MSGSPEC=1 TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD=0.10
    TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC=600 UCX_CUDA_IPC_ENABLE_MNNVL=y UCX_RNDV_SCHEME=put_zcopy TRTLLM_KVCACHE_SEND_BUFFER_COUNT=1
    TRTLLM_KVCACHE_RECV_BUFFER_COUNT=1 TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS=2.48
  scheduler_config:
    capacity_scheduler_policy: MAX_UTILIZATION
  client_configs:
  - name: con20_agentx
    concurrency: 20
    iterations: 1
    backend: openai
    streaming: true
    benchmark_client: agentx
    dataset_file: semianalysis_cc_traces_weka_062126
    client_env_var: AGENTX_MAX_CTX=1048576 AGENTX_DURATION=3600 AGENTX_WARMUP_PER_LANE=10 AGENTX_TIMEOUT_GRACE=5400
      AGENTX_SEED=42 AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID=true
