metadata:
  model_name: gpt_oss_120b_fp4
  supported_gpus:
  - B200
hardware:
  gpus_per_node: 8
server_configs:
  # Temporary single-GPU startup benchmark for sessionless Eagle3 loading.
  - name: "gpt_oss_fp4_tp1_eagle3_startup"
    server_env_var: "TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS=3"
    model_name: "gpt_oss_120b_fp4"
    tensor_parallel_size: 1
    moe_expert_parallel_size: 1
    pipeline_parallel_size: 1
    checkpoint_io_policy: "native"
    max_batch_size: 1
    max_num_tokens: 256
    attn_backend: "TRTLLM"
    enable_attention_dp: false
    moe_config:
      backend: 'TRTLLM'
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 1
    kv_cache_config:
      dtype: 'fp8'
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.5
    speculative_config:
      decoding_type: 'Eagle'
      eagle3_layers_to_capture: [-1]
      max_draft_len: 3
      speculative_model: "gpt_oss/gpt-oss-120b-Eagle3"
    stream_interval: 20
    num_postprocess_workers: 4
    client_configs:
      - name: "con1_iter1_16_1"
        concurrency: 1
        iterations: 1
        isl: 16
        osl: 1
        backend: "openai"

  # 1k1k configs - TP2 with TRTLLM, MTP0
  - name: "gpt_oss_fp4_tp2_mtp0_1k1k"
    model_name: "gpt_oss_120b_fp4"
    tensor_parallel_size: 2
    moe_expert_parallel_size: 1
    pipeline_parallel_size: 1
    max_batch_size: 512
    max_num_tokens: 20000
    attn_backend: "TRTLLM"
    enable_attention_dp: false
    moe_config:
      backend: 'TRTLLM'
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 512
    kv_cache_config:
      dtype: 'fp8'
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.85
    num_postprocess_workers: 4
    stream_interval: 20
    client_configs:
      - name: "con4_iter10_1k1k"
        concurrency: 4
        iterations: 10
        isl: 1024
        osl: 1024
        backend: "openai"
        dataset_file: datasets/perf-ci/gpt_oss_120b-1k1k-20480-ratio-1_for_serve.json

  # 1k1k configs - TP1 with TRTLLM, MTP0
  - name: "gpt_oss_fp4_tp1_mtp0_1k1k"
    model_name: "gpt_oss_120b_fp4"
    tensor_parallel_size: 1
    moe_expert_parallel_size: 1
    pipeline_parallel_size: 1
    max_batch_size: 512
    max_num_tokens: 20000
    attn_backend: "TRTLLM"
    enable_attention_dp: false
    moe_config:
      backend: 'TRTLLM'
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 512
    kv_cache_config:
      dtype: 'fp8'
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.85
    num_postprocess_workers: 4
    stream_interval: 20
    client_configs:
      - name: "con256_iter10_1k1k"
        concurrency: 256
        iterations: 10
        isl: 1024
        osl: 1024
        backend: "openai"
        dataset_file: datasets/perf-ci/gpt_oss_120b-1k1k-20480-ratio-1_for_serve.json

  # 8k1k configs - TP1 with TRTLLM, MTP0
  - name: "gpt_oss_fp4_tp1_mtp0_8k1k"
    model_name: "gpt_oss_120b_fp4"
    tensor_parallel_size: 1
    moe_expert_parallel_size: 1
    pipeline_parallel_size: 1
    max_batch_size: 512
    max_num_tokens: 20000
    attn_backend: "TRTLLM"
    enable_attention_dp: false
    moe_config:
      backend: 'TRTLLM'
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 512
    kv_cache_config:
      dtype: 'fp8'
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.85
    num_postprocess_workers: 4
    stream_interval: 20
    client_configs:
      - name: "con4_iter10_8k1k"
        concurrency: 4
        iterations: 10
        isl: 8192
        osl: 1024
        backend: "openai"
        dataset_file: datasets/perf-ci/gpt_oss_120b-8k1k-20480-ratio-1_for_serve.json
      - name: "con256_iter10_8k1k"
        concurrency: 256
        iterations: 10
        isl: 8192
        osl: 1024
        backend: "openai"
        dataset_file: datasets/perf-ci/gpt_oss_120b-8k1k-20480-ratio-1_for_serve.json
