# GLM-5.3-Flash FP8 (Glm5NextForConditionalGeneration: KDA + sparse-MLA
# glm_kpool layers) on one 4xGB300 tray, TRTLLM MoE, MTP3. The accepted draft
# length is pinned to 2.384 of 3, the value the tp4_mtp3 serving config serves
# with, so throughput does not depend on acceptance on random prompts.
#
# - tp4_mtp3_8k1k: the GLM-5.3-Flash tp4_mtp3 serving config: TP4 / EP4,
#   batch 32, 8192 tokens, chunked prefill, overlap scheduler, CUDA graphs
#   1..32 with padding, KV fraction 0.6, BF16 KV (the checkpoint sets no KV
#   quantization, so `auto` is BF16).
# - dep4_mtp3_fp8kv_8k1k: the high-concurrency shape of the GLM-5.3-Flash
#   deployment guide: attention DP4 / EP4 with 4096 tokens and batch 64 per
#   rank (64 x 4 ranks = concurrency 256), FP8 KV cache (sparse MLA runs
#   natively on it at attention DP), KV fraction 0.5.
# - tp4_mtp3_isl13312_osl33: long prompt, short answer (ISL 13312 / OSL 33),
#   the workload the GLM-5.3-Flash prefill optimizations are measured on:
#   TP4 / EP4, 16384 tokens, BF16 KV, concurrency 8 and then 1.
metadata:
  model_name: glm_5.3_flash_fp8
  supported_gpus:
  - GB300
hardware:
  gpus_per_node: 4
server_configs:
- name: glm53_flash_fp8_tp4_mtp3_8k1k
  model_name: glm_5.3_flash_fp8
  server_env_var: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS=2.384
  tensor_parallel_size: 4
  moe_expert_parallel_size: 4
  pipeline_parallel_size: 1
  max_batch_size: 32
  max_num_tokens: 8192
  max_seq_len: 9344
  trust_remote_code: true
  enable_attention_dp: false
  enable_chunked_prefill: true
  disable_overlap_scheduler: false
  disable_mm_encoder: true
  print_iter_log: true
  enable_iter_perf_stats: true
  stream_interval: 20
  num_postprocess_workers: 4
  scheduler_config:
    capacity_scheduler_policy: MAX_UTILIZATION
  cuda_graph_config:
    enable_padding: true
    batch_sizes: [1, 2, 4, 8, 12, 16, 20, 24, 28, 32]
  kv_cache_config:
    enable_block_reuse: false
    free_gpu_memory_fraction: 0.6
    dtype: auto
    tokens_per_block: 128
  moe_config:
    backend: TRTLLM
  speculative_config:
    decoding_type: MTP
    max_draft_len: 3
  client_configs:
  - name: con16_iter5_8k1k
    concurrency: 16
    iterations: 5
    isl: 8192
    osl: 1024
    backend: openai

- name: glm53_flash_fp8_dep4_mtp3_fp8kv_8k1k
  model_name: glm_5.3_flash_fp8
  server_env_var: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS=2.384
  tensor_parallel_size: 4
  moe_expert_parallel_size: 4
  pipeline_parallel_size: 1
  max_batch_size: 64
  max_num_tokens: 4096
  max_seq_len: 9344
  trust_remote_code: true
  enable_attention_dp: true
  enable_chunked_prefill: true
  disable_overlap_scheduler: false
  disable_mm_encoder: true
  print_iter_log: true
  enable_iter_perf_stats: true
  stream_interval: 20
  num_postprocess_workers: 4
  scheduler_config:
    capacity_scheduler_policy: MAX_UTILIZATION
  cuda_graph_config:
    enable_padding: true
    batch_sizes: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64]
  kv_cache_config:
    enable_block_reuse: false
    free_gpu_memory_fraction: 0.5
    dtype: fp8
    tokens_per_block: 128
  moe_config:
    backend: TRTLLM
  speculative_config:
    decoding_type: MTP
    max_draft_len: 3
  client_configs:
  - name: con256_iter5_8k1k
    concurrency: 256
    iterations: 5
    isl: 8192
    osl: 1024
    backend: openai

- name: glm53_flash_fp8_tp4_mtp3_isl13312_osl33
  model_name: glm_5.3_flash_fp8
  server_env_var: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS=2.384
  tensor_parallel_size: 4
  moe_expert_parallel_size: 4
  pipeline_parallel_size: 1
  max_batch_size: 16
  max_num_tokens: 16384
  max_seq_len: 16384
  trust_remote_code: true
  enable_attention_dp: false
  enable_chunked_prefill: true
  disable_overlap_scheduler: false
  disable_mm_encoder: true
  print_iter_log: true
  enable_iter_perf_stats: true
  stream_interval: 20
  num_postprocess_workers: 4
  scheduler_config:
    capacity_scheduler_policy: MAX_UTILIZATION
  cuda_graph_config:
    enable_padding: true
    batch_sizes: [1, 2, 4, 8, 16]
  kv_cache_config:
    enable_block_reuse: false
    free_gpu_memory_fraction: 0.6
    dtype: auto
    tokens_per_block: 128
  moe_config:
    backend: TRTLLM
  speculative_config:
    decoding_type: MTP
    max_draft_len: 3
  # con8 runs first: aggregated clients send no warmup request, and the first
  # requests a fresh server sees are slow (TTFT ~2 s instead of ~0.25 s here),
  # which would dominate a short con1 window.
  client_configs:
  - name: con8_iter20_isl13312_osl33
    concurrency: 8
    iterations: 20
    isl: 13312
    osl: 33
    backend: openai
  - name: con1_iter10_isl13312_osl33
    concurrency: 1
    iterations: 10
    isl: 13312
    osl: 33
    backend: openai
