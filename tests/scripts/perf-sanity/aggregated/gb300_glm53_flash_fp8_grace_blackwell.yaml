# GLM-5.3-Flash FP8 (Glm5NextForConditionalGeneration: KDA + sparse-MLA
# glm_kpool layers) on one 4xGB300 tray, TP4 / EP4, TRTLLM MoE, MTP3.
# The engine settings follow the GLM-5.3-Flash tp4_mtp3 serving config:
# batch 32, 8192 tokens, chunked prefill, overlap scheduler, CUDA graphs
# 1..32 with padding, KV fraction 0.6. The accepted draft length is pinned to
# 2.384 of 3, the value that config serves with, so throughput does not depend
# on acceptance on random prompts.
metadata:
  model_name: glm_5.3_flash_fp8
  supported_gpus:
  - GB300
hardware:
  gpus_per_node: 4
server_configs:
- name: glm53_flash_fp8_tp4_mtp3_8k1k
  model_name: glm_5.3_flash_fp8
  server_env_var: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS=2.384
  tensor_parallel_size: 4
  moe_expert_parallel_size: 4
  pipeline_parallel_size: 1
  max_batch_size: 32
  max_num_tokens: 8192
  max_seq_len: 9344
  trust_remote_code: true
  enable_attention_dp: false
  enable_chunked_prefill: true
  disable_overlap_scheduler: false
  disable_mm_encoder: true
  print_iter_log: true
  enable_iter_perf_stats: true
  stream_interval: 20
  num_postprocess_workers: 4
  scheduler_config:
    capacity_scheduler_policy: MAX_UTILIZATION
  cuda_graph_config:
    enable_padding: true
    batch_sizes: [1, 2, 4, 8, 12, 16, 20, 24, 28, 32]
  kv_cache_config:
    enable_block_reuse: false
    free_gpu_memory_fraction: 0.6
    dtype: auto
    tokens_per_block: 128
  moe_config:
    backend: TRTLLM
  speculative_config:
    decoding_type: MTP
    max_draft_len: 3
  client_configs:
  - name: con16_iter5_8k1k
    concurrency: 16
    iterations: 5
    isl: 8192
    osl: 1024
    backend: openai
