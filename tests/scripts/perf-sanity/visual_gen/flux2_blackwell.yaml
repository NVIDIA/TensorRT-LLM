metadata:
  model_name: FLUX.2-dev
  supported_gpus:
    - B200
hardware:
  gpus_per_node: 4
environment:
  server_env_var: TLLM_LOG_LEVEL=info
  client_env_var: ""
server_configs:
  - name: flux2_bf16_cfg1_ulysses4_teacache_cg_on
    server_config:
      attention_config:
        backend: VANILLA
      parallel_config:
        cfg_size: 1
        ulysses_size: 4
        async_ulysses: false
        parallel_vae_size: 1
      cache_config:
        cache_backend: teacache
      compilation_config:
        resolutions:
        - - 1024
          - 1024
        num_frames:
        - 1
      cuda_graph_config:
        enable: true
    client_configs:
      - name: 1024x1024_1f_50s_con1
        prompt: A cat holding a sign that says hello world
        backend: openai-images
        generation_mode: t2i
        size: 1024x1024
        num_inference_steps: 50
        seed: 42
        max_concurrency: 1
        num_prompts: 1
