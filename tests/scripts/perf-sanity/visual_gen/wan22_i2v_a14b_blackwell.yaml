metadata:
  model_name: Wan2.2-I2V-A14B-Diffusers
  supported_gpus:
    - B200
hardware:
  gpus_per_node: 8
environment:
  server_env_var: TLLM_LOG_LEVEL=info
  client_env_var: ""
server_configs:
  - name: wan22_i2v_a14b_nvfp4_sage_cfg2_ulysses4_cg_on
    model_path: Wan-AI/Wan2.2-I2V-A14B-Diffusers
    server_config:
      quant_config:
        quant_algo: NVFP4
        dynamic: true
      attention_config:
        backend: TRTLLM
        quant_attention_config:
          qk_dtype: int8
          v_dtype: fp8
          q_block_size: 1
          k_block_size: 16
          v_block_size: 1
      parallel_config:
        cfg_size: 2
        ulysses_size: 4
        async_ulysses: true
        parallel_vae_size: 8
      compilation_config:
        resolutions:
        - - 720
          - 1280
        num_frames:
        - 81
      cuda_graph_config:
        enable: true
    client_configs:
      - name: 1280x720_81f_40s_con1_i2v
        prompt: A cat walks through a field of flowers
        backend: openai-videos
        generation_mode: i2v
        size: 1280x720
        num_frames: 81
        fps: 16
        num_inference_steps: 40
        seed: 42
        max_concurrency: 1
        num_prompts: 1
        extra_body:
          image_reference: {content: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO7Z4h8AAAAASUVORK5CYII=, format: base64, role: first_frame}
