metadata:
  model_name: ltx2_bf16
  supported_gpus:
    - B200
hardware:
  gpus_per_node: 8
environment:
  server_env_var: TLLM_LOG_LEVEL=info
  client_env_var: ""
server_configs:
  - name: ltx2_2stage_bf16_fa4_i2v_cfg2_ulysses4_cg_compile_on
    model_name: ltx2_bf16
    model_path: LTX-2/ltx-2-19b-dev.safetensors
    server_config:
      attention_config:
        backend: FA4
      parallel_config:
        cfg_size: 2
        ulysses_size: 4
        async_ulysses: true
        parallel_vae_size: 8
      model: LTX-2/ltx-2-19b-dev.safetensors
      pipeline_config:
        text_encoder_path: google/gemma-3-12b-it
        spatial_upsampler_path: LTX-2/ltx-2-spatial-upscaler-x2-1.0.safetensors
        distilled_lora_path: LTX-2/ltx-2-19b-distilled-lora-384.safetensors
      compilation_config:
        resolutions:
        - - 768
          - 1280
        num_frames:
        - 121
      cuda_graph_config:
        enable: true
      torch_compile_config:
        enable: true
        enable_fullgraph: false
        enable_autotune: true
    client_configs:
      - name: 1280x768_121f_40s_con1_i2v
        prompt: A cat walks through a field of flowers
        backend: openai-videos
        generation_mode: i2v
        size: 1280x768
        num_frames: 121
        fps: 24
        num_inference_steps: 40
        seed: 42
        max_concurrency: 1
        num_prompts: 1
        extra_body:
          image_reference: {content: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO7Z4h8AAAAASUVORK5CYII=, format: base64}

  - name: ltx2_2stage_fp8bw_fa4_t2v_cfg2_ulysses4_cg_compile_on
    model_name: ltx2_fp8bw
    model_path: LTX-2/ltx-2-19b-dev.safetensors
    server_config:
      quant_config:
        quant_algo: FP8_BLOCK_SCALES
        dynamic: true
      attention_config:
        backend: FA4
      parallel_config:
        cfg_size: 2
        ulysses_size: 4
        async_ulysses: true
        parallel_vae_size: 8
      model: LTX-2/ltx-2-19b-dev.safetensors
      pipeline_config:
        text_encoder_path: google/gemma-3-12b-it
        spatial_upsampler_path: LTX-2/ltx-2-spatial-upscaler-x2-1.0.safetensors
        distilled_lora_path: LTX-2/ltx-2-19b-distilled-lora-384.safetensors
      compilation_config:
        resolutions:
        - - 768
          - 1280
        num_frames:
        - 121
      cuda_graph_config:
        enable: true
      torch_compile_config:
        enable: true
        enable_fullgraph: false
        enable_autotune: true
    client_configs:
      - name: 1280x768_121f_40s_con1_t2v
        prompt: A cat walks through a field of flowers
        backend: openai-videos
        generation_mode: t2v
        size: 1280x768
        num_frames: 121
        fps: 24
        num_inference_steps: 40
        seed: 42
        max_concurrency: 1
        num_prompts: 1
