# Import sanity: cold imports and related behavior checks, without inference.
# Selectors are relative to tests/. Run the full inventory with pytest -n 0:
# current xdist reporting and CUDA teardown hooks interact with unittest
# subtests and mocked CUDA state in the behavior checks.
# One visible GPU covers the full inventory. With CUDA_VISIBLE_DEVICES="",
# the CUDA-context check and two guided-decoder checks are skipped. Both
# profiles require the real native/CUDA/MPI dependencies.
# CBTS preserves covering registrations as mandatory import checks; runtime
# changes and unresolved side effects still require rule/coverage bounds.

