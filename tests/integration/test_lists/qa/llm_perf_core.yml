version: 0.0.1
llm_perf_core:
# ===============================================================================
# Test Conditions Index
# ===============================================================================
# 1: All GPUs common tests(L40S, H100, GB200, B200, B300, GB300, RTX-6000-Server test cases)
# 2: L40S, H100
# 3: H100, test cases
# 4: H100, GB200, B200, B300, GB300, RTX6000-Server test cases
# 5: GB200, B200, B300, GB300, RTX6000-Server test cases
# 6: B200, GB200, B300, GB300 test cases
# 7: B200, B300 test cases
# 8: B300 test cases
# 9: H100, B200, B300, RTX6000-Server test cases
# 10: B200, B300, RTX6000-Server test cases
# 11: RTX-6000 Server test cases
# ===============================================================================


# 1: All GPUs common tests(L40S, H100, GB200, B200, B300, GB300, RTX-6000-Server test cases)
- condition:
    terms:
      supports_fp8: true
    ranges:
      system_gpu_count:
        gte: 4
  tests:
  - perf/test_perf.py::test_perf[qwen3.5_9b-bench-pytorch-bfloat16-input_output_len:128,128]
  - perf/test_perf.py::test_perf[qwen3.5_9b-bench-pytorch-bfloat16-input_output_len:500,2000]
  - perf/test_perf.py::test_perf[qwen3.5_9b-bench-pytorch-bfloat16-input_output_len:2000,500]
  - perf/test_perf.py::test_perf[qwen3.5_9b-bench-pytorch-bfloat16-input_output_len:1000,2000]
  - perf/test_perf.py::test_perf[qwen3.5_9b-bench-pytorch-bfloat16-input_output_len:8000,1000]
  - perf/test_perf.py::test_perf[qwen3_4b_eagle3-bench-pytorch-streaming-bfloat16-maxbs:4-kv_frac:0.6-input_output_len:500,100-reqs:200-con:4]
   # test overlap scheduler
   # con:1 paired with a small model is an intentional design choice—it amplifies host-side overhead and simplifies execution timelines to the maximum extent.
  - perf/test_perf.py::test_perf[qwen3_0.6b-bench-pytorch-bfloat16-maxnt:2048-input_output_len:8000,1000-reqs:64-con:1-pp:4-gpus:4]
   # 30B MoE uses fewer reqs to fit the 1h timeout; con:1 host-overhead signal is unaffected
  - perf/test_perf.py::test_perf[qwen3_30b_a3b-bench-pytorch-bfloat16-maxnt:2048-input_output_len:8000,1000-reqs:64-con:1-pp:4-gpus:4]


# 2: L40S, H100
- condition:
    ranges:
      system_gpu_count:
        gte: 2
      compute_capability:
        lte: 9.0
  tests:
  #nemotron_nano_12b_v2
  - perf/test_perf.py::test_perf[nemotron_nano_12b_v2-bench-pytorch-bfloat16-maxbs:1-input_output_len:128,128-reqs:10-con:1] #min_latency
  #qwen3.5_27b (dense BF16 52G, 2-GPU)
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-maxbs:1-input_output_len:8000,1000-reqs:10-con:1-tp:2-gpus:2] #min_latency


# 3: H100 test cases
- condition:
    ranges:
      system_gpu_count:
        gte: 8
      compute_capability:
        gte: 9.0
        lte: 9.0
      gpu_memory:
        gt: 80000
  tests:
   # gpt_oss_20b_fp4 (NVBug 5720470: MMHA vs XQA kernel regression)
  - perf/test_perf.py::test_perf[gpt_oss_20b_fp4-bench-pytorch-float4-maxbs:512-maxnt:8192-input_output_len:2000,200-con:64]
  - perf/test_perf.py::test_perf[gpt_oss_20b_fp4-bench-pytorch-float4-maxbs:512-maxnt:8192-input_output_len:128,128]
  - perf/test_perf.py::test_perf[gpt_oss_20b_fp4-bench-pytorch-float4-maxbs:512-maxnt:8192-input_output_len:2000,200-con:256]
  - perf/test_perf.py::test_perf[nemotron_nano_12b_v2-bench-pytorch-bfloat16-input_output_len:500,2000-con:250] #max_throughput
  - perf/test_perf.py::test_perf[nemotron_nano_12b_v2-bench-pytorch-bfloat16-input_output_len:128,128]
  #qwen3.5_27b (dense BF16 52G, 2-GPU)
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:128,128-tp:2-gpus:2]
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:500,2000-tp:2-gpus:2]
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:2000,500-tp:2-gpus:2]
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:8000,1000-tp:2-gpus:2]
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:1000,2000-tp:2-gpus:2]
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:8000,1000-con:250-tp:2-gpus:2] #max_throughput


# 4: H100, GB200, B200, B300, GB300, RTX6000-Server test cases
- condition:
    ranges:
      system_gpu_count:
        gte: 2
      compute_capability:
        gte: 9.0
        lte: 12.0
  tests:
  - perf/test_perf.py::test_perf[gpt_oss_20b_fp4-bench-pytorch-float4-input_output_len:512,512]
  - perf/test_perf.py::test_perf[qwen3_235b_a22b_fp8-bench-pytorch-float8-input_output_len:1000,2000-con:256-ep:8-gpus:8]
  #nemotron_nano_12b_v2
  - perf/test_perf.py::test_perf[nemotron_nano_12b_v2-bench-pytorch-bfloat16-input_output_len:512,512]
  - perf/test_perf.py::test_perf[nemotron_nano_12b_v2-bench-pytorch-bfloat16-maxbs:1-input_output_len:8000,1000-reqs:10-con:1] #min_latency
  - perf/test_perf.py::test_perf[nemotron_nano_12b_v2-bench-pytorch-bfloat16-input_output_len:8000,1000-con:250] #max_throughput
  - perf/test_perf.py::test_perf[nemotron_nano_12b_v2-bench-pytorch-streaming-bfloat16-input_output_len:500,2000-con:250] #max_throughput streaming
  #qwen3.5_27b (dense BF16 52G, 1-GPU)
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-maxbs:1-input_output_len:8000,1000-reqs:10-con:1] #min_latency
  #qwen3.5_35b_a3b_fp8 (MoE FP8 36G, 1-GPU)
  - perf/test_perf.py::test_perf[qwen3.5_35b_a3b_fp8-bench-pytorch-float8-input_output_len:128,128]
  - perf/test_perf.py::test_perf[qwen3.5_35b_a3b_fp8-bench-pytorch-float8-input_output_len:500,2000]
  - perf/test_perf.py::test_perf[qwen3.5_35b_a3b_fp8-bench-pytorch-float8-input_output_len:2000,500]
  - perf/test_perf.py::test_perf[qwen3.5_35b_a3b_fp8-bench-pytorch-float8-input_output_len:8000,1000]
  - perf/test_perf.py::test_perf[qwen3.5_35b_a3b_fp8-bench-pytorch-float8-input_output_len:1000,2000]
  - perf/test_perf.py::test_perf[qwen3.5_35b_a3b_fp8-bench-pytorch-float8-maxbs:1-input_output_len:8000,1000-reqs:10-con:1] #min_latency
  - perf/test_perf.py::test_perf[qwen3.5_35b_a3b_fp8-bench-pytorch-float8-maxbs:512-input_output_len:8000,1000-con:256] #max_throughput
    #qwen3.5_122b_a10b (MoE BF16 234G, 4-GPU)
  - perf/test_perf.py::test_perf[qwen3.5_122b_a10b-bench-pytorch-bfloat16-input_output_len:128,128-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[qwen3.5_122b_a10b-bench-pytorch-bfloat16-input_output_len:500,2000-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[qwen3.5_122b_a10b-bench-pytorch-bfloat16-input_output_len:2000,500-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[qwen3.5_122b_a10b-bench-pytorch-bfloat16-input_output_len:8000,1000-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[qwen3.5_122b_a10b-bench-pytorch-bfloat16-input_output_len:1000,2000-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[qwen3.5_122b_a10b-bench-pytorch-bfloat16-maxbs:1-input_output_len:8000,1000-reqs:10-con:1-ep:4-tp:4-gpus:4] #min_latency
  - perf/test_perf.py::test_perf[qwen3.5_122b_a10b-bench-pytorch-bfloat16-maxbs:512-input_output_len:8000,1000-con:256-ep:4-tp:4-gpus:4] #max_throughput



# 5: GB200, B200, B300, GB300, RTX6000-Server test cases
- condition:
    ranges:
      system_gpu_count:
        gte: 4
      compute_capability:
        gte: 10.0
        lte: 12.0
  tests:
  - perf/test_perf.py::test_perf[qwen3_235b_a22b_fp4-bench-pytorch-float4-input_output_len:1000,2000-con:512-ep:4-gpus:4]


# 6: B200, GB200, B300, GB300 test cases
- condition:
    ranges:
      system_gpu_count:
        gte: 4
      compute_capability:
        gte: 10.0
        lte: 10.3
  tests:
  #qwen3.5_27b (dense BF16 52G, 1-GPU): maxbs 512 mamba states need >95G
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:128,128]
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:500,2000]
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:2000,500]
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:8000,1000]
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:1000,2000]
  - perf/test_perf.py::test_perf[qwen3.5_27b-bench-pytorch-bfloat16-input_output_len:8000,1000-con:250] #max_throughput
  #minimax_m3 (MXFP8 block-sparse MoE, 4-GPU)
  - perf/test_perf.py::test_perf[minimax_m3_mxfp8-bench-pytorch-float8-input_output_len:128,128-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[minimax_m3_mxfp8-bench-pytorch-float8-input_output_len:500,2000-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[minimax_m3_mxfp8-bench-pytorch-float8-input_output_len:2000,500-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[minimax_m3_mxfp8-bench-pytorch-float8-input_output_len:8000,1000-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[minimax_m3_mxfp8-bench-pytorch-float8-maxbs:1-input_output_len:8000,1000-reqs:10-con:1-tp:4-gpus:4] #min_latency
  - perf/test_perf.py::test_perf[minimax_m3_mxfp8-bench-pytorch-float8-maxbs:512-input_output_len:8000,1000-con:256-tp:4-gpus:4] #max_throughput
  #deepseek_v4_flash_base_fp8 (sparse-MLA MoE, FP8 block-scale, 4-GPU)
  - perf/test_perf.py::test_perf[deepseek_v4_flash_base_fp8-bench-pytorch-float8-input_output_len:8192,1024-ep:4-tp:4-gpus:4] TIMEOUT(120)
  - perf/test_perf.py::test_perf[deepseek_v4_flash_base_fp8-bench-pytorch-float8-input_output_len:1000,2000-ep:4-tp:4-gpus:4] TIMEOUT(120)
  #deepseek_v4_flash (post-trained, FP4+FP8 mixed, 4-GPU)
  - perf/test_perf.py::test_perf[deepseek_v4_flash-bench-pytorch-float4-maxbs:128-maxnt:4096-kv_frac:0.5-input_output_len:8192,1024-ep:4-tp:4-gpus:4] TIMEOUT(120)
  - perf/test_perf.py::test_perf[deepseek_v4_flash-bench-pytorch-float4-maxbs:128-maxnt:4096-kv_frac:0.5-input_output_len:1000,2000-ep:4-tp:4-gpus:4] TIMEOUT(120)
  #minimax_m3_fp4 (block-sparse MoE, MXFP8 base + NVFP4 experts 233G, 4-GPU ep=4)
  #mirrors accuracy/test_llm_api_pytorch.py::TestMiniMaxM3::test_nvfp4[use_msa=True] (tp=ep=4).
  #ISL+OSL is kept <= 2048 because the M3 sparse path caps max_seq_len for CUDA-graph capture.
  - perf/test_perf.py::test_perf[minimax_m3_fp4-bench-pytorch-float4-maxbs:128-maxnt:4096-input_output_len:1024,1024-ep:4-tp:4-gpus:4] TIMEOUT(120)
  - perf/test_perf.py::test_perf[minimax_m3_fp4-bench-pytorch-float4-maxbs:1-input_output_len:1024,1024-reqs:10-con:1-ep:4-tp:4-gpus:4] #min_latency
  #gemma_4_26b_a4b_nvfp4 (Gemma4 MoE 26B-A4B NVFP4 18G, 1-GPU; VSWA sliding_window=1024)
  - perf/test_perf.py::test_perf[gemma_4_26b_a4b_nvfp4-bench-pytorch-float4-input_output_len:128,128]
  - perf/test_perf.py::test_perf[gemma_4_26b_a4b_nvfp4-bench-pytorch-float4-input_output_len:500,2000]
  - perf/test_perf.py::test_perf[gemma_4_26b_a4b_nvfp4-bench-pytorch-float4-input_output_len:2000,500]
  - perf/test_perf.py::test_perf[gemma_4_26b_a4b_nvfp4-bench-pytorch-float4-input_output_len:8000,1000]
  - perf/test_perf.py::test_perf[gemma_4_26b_a4b_nvfp4-bench-pytorch-float4-maxbs:1-input_output_len:8000,1000-reqs:10-con:1] #min_latency
  - perf/test_perf.py::test_perf[gemma_4_26b_a4b_nvfp4-bench-pytorch-float4-input_output_len:8000,1000-con:250] #max_throughput
  #gemma_4_31b_it_nvfp4 (Gemma4 dense 31B NVFP4 31G, 1-GPU)
  - perf/test_perf.py::test_perf[gemma_4_31b_it_nvfp4-bench-pytorch-float4-input_output_len:128,128]
  - perf/test_perf.py::test_perf[gemma_4_31b_it_nvfp4-bench-pytorch-float4-input_output_len:500,2000]
  - perf/test_perf.py::test_perf[gemma_4_31b_it_nvfp4-bench-pytorch-float4-input_output_len:2000,500]
  - perf/test_perf.py::test_perf[gemma_4_31b_it_nvfp4-bench-pytorch-float4-maxbs:1-input_output_len:8000,1000-reqs:10-con:1] #min_latency
  - perf/test_perf.py::test_perf[gemma_4_31b_it_nvfp4-bench-pytorch-float4-input_output_len:8000,1000-con:250] #max_throughput
  #qwen3.5_397b_a17b_fp4 (MoE FP4 234G, 4-GPU)
  - perf/test_perf.py::test_perf[qwen3.5_397b_a17b_fp4-bench-pytorch-float4-input_output_len:128,128-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[qwen3.5_397b_a17b_fp4-bench-pytorch-float4-input_output_len:500,2000-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[qwen3.5_397b_a17b_fp4-bench-pytorch-float4-input_output_len:2000,500-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[qwen3.5_397b_a17b_fp4-bench-pytorch-float4-input_output_len:8000,1000-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[qwen3.5_397b_a17b_fp4-bench-pytorch-float4-input_output_len:1000,2000-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[qwen3.5_397b_a17b_fp4-bench-pytorch-float4-maxbs:1-input_output_len:8000,1000-reqs:10-con:1-ep:4-tp:4-gpus:4] #min_latency
  - perf/test_perf.py::test_perf[qwen3.5_397b_a17b_fp4-bench-pytorch-float4-maxbs:512-input_output_len:8000,1000-con:512-ep:4-tp:4-gpus:4] #max_throughput
  #qwen3.6_35b_a3b_fp4 (GDN-attn MoE NVFP4, 1-GPU, SM100/103 only)
  - perf/test_perf.py::test_perf[qwen3.6_35b_a3b_fp4-bench-pytorch-float4-input_output_len:128,128]
  - perf/test_perf.py::test_perf[qwen3.6_35b_a3b_fp4-bench-pytorch-float4-input_output_len:500,2000]
  - perf/test_perf.py::test_perf[qwen3.6_35b_a3b_fp4-bench-pytorch-float4-input_output_len:2000,500]
  - perf/test_perf.py::test_perf[qwen3.6_35b_a3b_fp4-bench-pytorch-float4-input_output_len:8000,1000]
  - perf/test_perf.py::test_perf[qwen3.6_35b_a3b_fp4-bench-pytorch-float4-input_output_len:1000,2000]
  - perf/test_perf.py::test_perf[qwen3.6_35b_a3b_fp4-bench-pytorch-float4-maxbs:1-input_output_len:8000,1000-reqs:10-con:1] #min_latency
  - perf/test_perf.py::test_perf[qwen3.6_35b_a3b_fp4-bench-pytorch-float4-maxbs:512-input_output_len:8000,1000-con:256] #max_throughput
  #nemotron_3_super_120b_nvfp4 (Hybrid MoE+SSM+Attn FP4 76G, 4-GPU ep=4 tp=4, throughput config)
  #these test config come from docs/source/deployment-guide/deployment-guide-for-nemotron-3-on-trtllm.md
  - perf/test_perf.py::test_perf[nemotron_3_super_120b_nvfp4-serve-pytorch-float4-maxbs:512-maxnt:2048-kv_frac:0.8-input_output_len:1024,1024-reqs:5-con:1-ep:4-tp:4-gpus:4] #min_latency
  - perf/test_perf.py::test_perf[nemotron_3_super_120b_nvfp4-serve-pytorch-float4-maxbs:512-maxnt:2048-kv_frac:0.8-input_output_len:1024,1024-reqs:160-con:32-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[nemotron_3_super_120b_nvfp4-serve-pytorch-float4-maxbs:512-maxnt:2048-kv_frac:0.8-input_output_len:1024,1024-reqs:640-con:128-ep:4-tp:4-gpus:4] #max_throughput
  #nemotron_3_ultra_550b_nvfp4 (Hybrid MoE FP4 ~275G, 4-GPU ep=4 tp=4, throughput config, HF download)
  #these test config come from docs/source/deployment-guide/deployment-guide-for-nemotron-3-on-trtllm.md
  - perf/test_perf.py::test_perf[nemotron_3_ultra_550b_nvfp4-serve-pytorch-float4-maxbs:256-maxnt:2048-kv_frac:0.8-input_output_len:1024,1024-reqs:5-con:1-ep:4-tp:4-gpus:4] #min_latency
  - perf/test_perf.py::test_perf[nemotron_3_ultra_550b_nvfp4-serve-pytorch-float4-maxbs:256-maxnt:2048-kv_frac:0.8-input_output_len:1024,1024-reqs:160-con:32-ep:4-tp:4-gpus:4]
  - perf/test_perf.py::test_perf[nemotron_3_ultra_550b_nvfp4-serve-pytorch-float4-maxbs:256-maxnt:2048-kv_frac:0.8-input_output_len:1024,1024-reqs:640-con:128-ep:4-tp:4-gpus:4] #max_throughput


# 7: B200, B300 test cases
- condition:
    ranges:
      system_gpu_count:
        gte: 8
      compute_capability:
        gte: 10.0
        lte: 10.3
  tests:
  # gpt_oss_120b_fp4
  - perf/test_perf.py::test_perf[gpt_oss_120b_fp4-bench-pytorch-float4-maxbs:720-maxnt:16384-input_output_len:1024,1024-reqs:1280-con:256-ep:8-tp:8-gpus:8]
  - perf/test_perf.py::test_perf[gpt_oss_120b_fp4-bench-pytorch-float4-maxbs:720-maxnt:16384-input_output_len:1024,1024-reqs:2560-con:512-ep:8-tp:8-gpus:8]
  - perf/test_perf.py::test_perf[gpt_oss_120b_fp4-bench-pytorch-float4-maxbs:720-maxnt:16384-input_output_len:1024,1024-reqs:20480-con:4096-ep:8-tp:8-gpus:8] TIMEOUT(180)
