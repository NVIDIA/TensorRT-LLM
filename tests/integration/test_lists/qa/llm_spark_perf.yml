  - perf/test_perf.py::test_perf[nemotron_3_nano_4b-bench-pytorch-streaming-bfloat16-maxbs:1-maxnt:8192-input_output_len:32768,512-reqs:4-con:1-cfg:enable_chunked_prefill=true,kv_cache_config.mamba_ssm_cache_dtype=float32]
