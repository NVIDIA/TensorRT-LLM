version: 0.0.1
llm_spark_perf:
# ===============================================================================
# 1: Single GPU Spark perf cases
# ===============================================================================
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
  model_configs:
    gpt_oss_eagle3:
      settings:
        enable_autotuner: false
        speculative_config:
          decoding_type: Eagle
          max_draft_len: 3
          speculative_model_dir: ${LLM_MODELS_ROOT}/gpt_oss/gpt-oss-120b-Eagle3
    gpt_oss_eagle3_throughput:
      settings:
        enable_autotuner: false
        speculative_config:
          decoding_type: Eagle
          max_draft_len: 3
          speculative_model_dir: ${LLM_MODELS_ROOT}/gpt_oss/gpt-oss-120b-Eagle3-throughput
    nano_omni:
      source: tests/integration/defs/examples/serve/test_configs/Nemotron3_Nano_Omni_30B_NVFP4.yml
      fields:
      - cuda_graph_config.max_batch_size
      - enable_chunked_prefill
      - kv_cache_config.free_gpu_memory_fraction
      - kv_cache_config.mamba_ssm_cache_dtype
      settings:
        moe_config:
          backend: CUTLASS
    lightning_mtp:
      source: tests/integration/defs/examples/serve/test_configs/Nemotron35_Lightning_30B.yml
      fields:
      - enable_chunked_prefill
      - num_postprocess_workers
      - stream_interval
      - kv_cache_config.mamba_state_config
      - kv_cache_config.free_gpu_memory_fraction
      - kv_cache_config.mamba_ssm_cache_dtype
      - kv_cache_config.mamba_ssm_philox_rounds
      - kv_cache_config.mamba_ssm_stochastic_rounding
      - speculative_config.decoding_type
      - speculative_config.max_draft_len
    qwen36_fp4_streaming:
      settings:
        enable_chunked_prefill: true
        moe_config:
          backend: CUTEDSL
        num_postprocess_workers: 4
        nvfp4_gemm_config:
          allowed_backends: [marlin, cutlass, cublaslt, cuda_core]
        stream_interval: 10
    super_streaming:
      source: tests/integration/defs/examples/serve/test_configs/Nemotron3_Super_120B_NVFP4.yml
      fields:
      - enable_chunked_prefill
      - cuda_graph_config.max_batch_size
      - kv_cache_config.mamba_ssm_cache_dtype
      - kv_cache_config.mamba_ssm_philox_rounds
      - kv_cache_config.mamba_ssm_stochastic_rounding
      settings:
        max_seq_len: 1048576
        moe_config:
          backend: CUTLASS
  tests:
  - perf/test_perf.py::test_perf[gpt_oss_20b_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-reqs:1-con:1]
  - perf/test_perf.py::test_perf[gpt_oss_120b_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-reqs:1-con:1]
  - perf/test_perf.py::test_perf[gpt_oss_120b_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:128,2048-reqs:1-con:1]
  - perf/test_perf.py::test_perf[gpt_oss_120b_eagle3-bench-pytorch-streaming-float4-maxbs:1-input_output_len:128,2048-reqs:1-con:1-cfg:llm_spark_perf.yml@gpt_oss_eagle3+noreuse+enable_chunked_prefill=true]
  # GPT-OSS 120B spec dec case (Eagle3-throughput) - https://nvbugspro.nvidia.com/bug/5832481
  - perf/test_perf.py::test_perf[gpt_oss_120b_eagle3_throughput-bench-pytorch-streaming-float4-maxbs:1-input_output_len:128,2048-reqs:1-con:1-cfg:llm_spark_perf.yml@gpt_oss_eagle3_throughput,disable_overlap_scheduler=true]
  - perf/test_perf.py::test_perf[nvidia_nemotron_nano_9b_v2_nvfp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-reqs:1-con:1]
  # Nemotron-3-Nano-Omni-30B NVFP4: text benchmarks (ISL 2048 and 32768)
  - perf/test_perf.py::test_perf[nemotron_3_nano_omni_nvfp4-serve-pytorch-streaming-float4-maxbs:1-input_output_len:2048,1024-reqs:1-con:1-cfg:llm_spark_perf.yml@nano_omni]
  - perf/test_perf.py::test_perf[nemotron_3_nano_omni_nvfp4-serve-pytorch-streaming-float4-maxbs:1-input_output_len:32768,1024-reqs:1-con:1-cfg:llm_spark_perf.yml@nano_omni]
  # Nemotron-3-Nano-Omni-30B NVFP4: image benchmark (1526x1024 image + ISL 2048)
  - perf/test_perf.py::test_perf[nemotron_3_nano_omni_nvfp4_image-serve-pytorch-streaming-float4-maxbs:1-input_output_len:2048,1024-reqs:1-con:1-cfg:llm_spark_perf.yml@nano_omni]
  # Nemotron-3-Nano 30B/4B and Qwen3.8-27B NVFP4: BS=1 baseline, one agentic and one stress case each
  - perf/test_perf.py::test_perf[nemotron_3_nano_30b_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-reqs:1-con:1-cfg:kv_cache_config.mamba_ssm_cache_dtype=float32,moe_config.backend=CUTLASS]
  - perf/test_perf.py::test_perf[nemotron_3_nano_30b_fp4-bench-pytorch-streaming-float4-maxbs:4-maxnt:8192-input_output_len:8192,512-reqs:16-con:4-cfg:kv_cache_config.mamba_ssm_cache_dtype=float32,moe_config.backend=CUTLASS]
