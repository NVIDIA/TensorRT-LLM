  - perf/test_perf.py::test_perf[nemotron_3_nano_30b_fp8-bench-pytorch-streaming-float8-maxbs:1-input_output_len:2048,128-reqs:1-con:1-cfg:kv_cache_config.mamba_ssm_cache_dtype=float32,moe_config.backend=CUTLASS]
  - perf/test_perf.py::test_perf[nemotron_3_nano_30b_fp8-serve-pytorch-streaming-float8-maxbs:4-maxnt:8192-input_output_len:4096,512-reqs:16-con:4-moe:CUTLASS-prefix:28672-cfg:reuse+enable_chunked_prefill=true,kv_cache_config.mamba_ssm_cache_dtype=float32]
  - perf/test_perf.py::test_perf[nemotron_3_nano_30b_fp8-bench-pytorch-streaming-float8-maxbs:16-maxnt:8192-input_output_len:1024,2-reqs:512-con:16-cfg:kv_cache_config.mamba_ssm_cache_dtype=float32,moe_config.backend=CUTLASS]
  - perf/test_perf.py::test_perf[nemotron_3_nano_30b-bench-pytorch-streaming-bfloat16-maxbs:1-input_output_len:2048,128-reqs:1-con:1-cfg:kv_cache_config.mamba_ssm_cache_dtype=float32,moe_config.backend=CUTLASS]
