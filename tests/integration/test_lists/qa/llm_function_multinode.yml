defaults:
  launch:
    mode: mpi
    nodes: 2
    world_size: 16

tests:
  # ModelingV2 GLM-5.2 on VR200 (SM107), TP8/TP16.
  - case: accuracy/modeling_v2/glm_moe_dsa/glm_5_2_nvfp4__sm_107__low_latency/test_accuracy.py::TestModelingV2Glm52Nvfp4Sm107LowLatency::test_mtp7_gsm8k_and_acceptance
  - case: accuracy/modeling_v2/glm_moe_dsa/glm_5_2_nvfp4__sm_107__low_latency/test_accuracy.py::TestModelingV2Glm52Nvfp4Sm107LowLatency::test_tp8_mtp3_gsm8k_and_acceptance
    launch:
      mode: mpi
      world_size: 8
  - case: accuracy/modeling_v2/glm_moe_dsa/glm_5_2_nvfp4__sm_107__low_latency/test_accuracy.py::TestModelingV2Glm52Nvfp4Sm107LowLatency::test_tp8_mtp7_gsm8k_and_acceptance
    launch:
      mode: mpi
      world_size: 8
  # ModelingV2 Kimi K3: 16 GB200 GPUs in one NVLink domain (SM100).
  - case: accuracy/modeling_v2/kimi_k3_vl/kimi_k3_mxfp4__sm_100__tp16_moetp16ep1/test_accuracy.py::TestModelingV2KimiK3Mxfp4Sm100Tp16Moetp16ep1::test_gsm8k
  - case: accuracy/modeling_v2/kimi_k3_vl/kimi_k3_mxfp4__sm_100__tp16_moetp4ep4/test_accuracy.py::TestModelingV2KimiK3Mxfp4Sm100Tp16Moetp4ep4::test_gsm8k
  # ModelingV2 MiniMax-M3: 8 Rubin GPUs (SM107) over two trays, TP8.
  - case: accuracy/modeling_v2/minimax_m3/minimax_m3_nvfp4__sm_107__tp8/test_accuracy.py::TestModelingV2MiniMaxM3Nvfp4Sm107Tp8::test_eagle3_gsm8k_and_acceptance TIMEOUT (60)
    launch:
      mode: mpi
      world_size: 8
  - case: accuracy/modeling_v2/minimax_m3/minimax_m3_nvfp4__sm_107__tp8/test_accuracy.py::TestModelingV2MiniMaxM3Nvfp4Sm107Tp8::test_gsm8k TIMEOUT (60)
    launch:
      mode: mpi
      world_size: 8
  # ModelingV2 Nemotron-3 Ultra BF16 tep8 and tp8ep2: 8 GB200 GPUs over two trays (SM100).
  - case: accuracy/modeling_v2/nemotron_h/nemotron3_ultra_bf16__sm_100__tep8/test_accuracy.py::TestModelingV2Nemotron3UltraBf16Sm100Tep8::test_gsm8k
    launch:
      mode: mpi
      world_size: 8
  - case: accuracy/modeling_v2/nemotron_h/nemotron3_ultra_bf16__sm_100__tp8ep2/test_accuracy.py::TestModelingV2Nemotron3UltraBf16Sm100Tp8ep2::test_gsm8k
    launch:
      mode: mpi
      world_size: 8
  - case: accuracy/test_disaggregated_multinode.py::TestDeepSeekV4ProDSparkMultinode::test_gsm8k_1p1d_dep4
    launch:
      mode: per_node
      tasks_per_node: 1
      gpus_per_node: 4
  - case: accuracy/test_kimi3.py::TestKimiK3::test_w4a16_mxfp4[baseline]
  - case: accuracy/test_kimi3.py::TestKimiK3::test_w4a16_mxfp4[dspark]
