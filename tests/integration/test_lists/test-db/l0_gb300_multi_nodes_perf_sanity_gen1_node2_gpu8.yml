version: 0.0.1
l0_gb300_multi_nodes_perf_sanity_gen1_node2_gpu8:
- condition:
    ranges:
      # 0 ctx workers
      # 1 gen worker with 2 nodes and 8 GPUs
      system_gpu_count:
        gte: 8
        lte: 8
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # deepseek-v4-pro-fp4 8k1k con4301
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gen_only_no_context-gb300_deepseek-v4-pro-fp4_8k1k_con4301_ctx12_dep4_gen1_dep8_eplb384_mtp1_ccb-NIXL] TIMEOUT (120)
  # deepseek-r1-fp4 128k8k con256
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gen_only_no_context-gb300_deepseek-r1-fp4_128k8k_con256_ctx1_pp4_gen1_dep8_eplb0_mtp1_ccb-NIXL] TIMEOUT (180)
  # deepseek-v4-pro-fp4 8k1k con8
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gen_only_no_context-gb300_deepseek-v4-pro-fp4_8k1k_con8_ctx1_dep4_gen4_tep8_eplb0_mtp3_ccb-NIXL] TIMEOUT (120)
  # glm-5-fp4 8k1k con1
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gen_only_no_context-gb300_glm-5-fp4_8k1k_con1_ctx1_dep2_gen1_tep8_eplb0_mtp3_ccb-NIXL] TIMEOUT (90)
  # glm-5-fp4 8k1k con1024
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gen_only_no_context-gb300_glm-5-fp4_8k1k_con1024_ctx1_dep2_gen1_dep8_eplb256_mtp1_ccb-NIXL] TIMEOUT (90)
  # kimi-k3-nvfp4 dspark agentx, helix CP8 gen worker
  # Only gen_only_no_context: the DWDP16 ctx side the e2e and ctx_only lanes
  # need cannot start until Kimi K3 MoE supports DWDP.
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gen_only_no_context-gb300_kimi-k3-fp4-dspark_agentx_con138_ctx16_dwdp16_gen3_helix8_bs16_dspark5_ccb-NIXL] TIMEOUT (240)
  # deepseek-v4-pro-dspark agentx con1156, DEP8 gen worker
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gen_only_no_context-gb300_deepseek-v4-pro-dspark_agentx_con1156_ctx2_dep8_gen1_dep8_eplb0_dspark3_ccb-NIXL] TIMEOUT (150)
