version: 0.0.1
l0_gb300_multi_nodes_perf_sanity_gen1_node2_gpu8:
- condition:
    ranges:
      # No ctx workers at all: gen_only_no_context has the gen worker fabricate its
      # own KV blocks, so only the 1 gen worker (2 nodes, 4 GPUs each) is allocated.
      # The same case under gen_only needs 56 GPUs -- see
      # l0_gb300_multi_nodes_perf_sanity_ctx12_node1_gpu4_gen1_node2_gpu8.yml.
      system_gpu_count:
        gte: 8
        lte: 8
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # deepseek-v4-pro-fp4 8k1k con4301 (max throughput), decode loop only.
  # aggr_upload, not disagg_upload: the prefix names the launch path, and this mode
  # runs one pytest that owns the gen worker, the proxy and the client -- the same
  # single-pytest path ctx_only takes out of a disaggregated yaml.
  #
  # Exactly one test, and the stage's splits must stay 1. This stage is 2 nodes, so
  # the Slurm script prefixes pytest with trtllm-llmapi-launch; cases run serially
  # in one stage would share that launcher instance and the previous case's state
  # would survive into the next one, ending in OOM. jenkins/scripts/perf/submit.py
  # enforces it (exactly one test per pytest-split group, firing on zero as well as
  # many). A single-node gen worker needs neither the launcher nor this file: those
  # configs can share a stage with other single-node cases.
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gen_only_no_context-gb300_deepseek-v4-pro-fp4_8k1k_con4301_ctx12_dep4_gen1_dep8_eplb384_mtp1_ccb-NIXL] TIMEOUT (120)
