version: 0.0.1
l0_sanity_check:
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
    wildcards:
      gpu:
        - '*b100*'
        - '*h100*'
        - '*h200*'
        - '*l40s*'
        - '*a10*'
        - '*a100x*'
        - '*gb202*'
        - '*gb203*'
        - '*5080*'
        - '*5090*'
      linux_distribution_name: ubuntu*
  tests:
    # Import sanity uses fresh interpreters and the real package environment.
    # These checks supplement functional tests; they do not waive CBTS fallback.
    - unittest/others/test_import_sanity.py
    - unittest/others/test_import_gpu_free.py
    - unittest/others/test_import_cuda_context.py
    - unittest/others/test_mimalloc_thp.py
    - unittest/llmapi/apps/test_serve_lazy_import.py
    - unittest/dynamo/test_imports.py
    # This API guard lacks cpu_only; a CPU-list entry alone deselects it.
    - unittest/_torch/moe/test_moe_backend.py::test_import_deep_gemm_rejects_mega_moe_without_block_m_heuristic
    - llmapi/test_llm_examples.py::test_llmapi_quickstart
    - llmapi/test_llm_examples.py::test_llmapi_example_inference
    - llmapi/test_llm_examples.py::test_llmapi_example_inference_async
    - llmapi/test_llm_examples.py::test_llmapi_example_inference_async_streaming
    - llmapi/test_llm_examples.py::test_llmapi_example_multilora
    - llmapi/test_llm_examples.py::test_llmapi_example_guided_decoding
    - llmapi/test_llm_examples.py::test_llmapi_example_logits_processor
    - llmapi/test_llm_examples.py::test_llmapi_sampling
    - llmapi/test_llm_examples.py::test_llmapi_runtime
    - examples/test_llm_api_with_mpi.py::test_llm_api_single_gpu_with_mpirun ISOLATION
    - unittest/others/test_kv_cache_transceiver.py::test_kv_cache_transceiver_single_process[NIXL-mha-ctx_fp16_gen_fp16]
    - unittest/others/test_kv_cache_transceiver.py::test_kv_cache_transceiver_single_process[UCX-mha-ctx_fp16_gen_fp16]
    - unittest/others/test_kv_cache_transceiver.py::test_cpp_nixl_sync_transfer_stress
    - unittest/others/test_kv_cache_transceiver.py::test_cancel_request_in_transmission[mha]
    - unittest/others/test_kv_cache_transceiver.py::test_cancel_request_in_transmission[mla]
    - unittest/others/test_kv_cache_transceiver.py::test_async_transfer_keeps_llm_request_alive
    - unittest/others/test_kv_cache_transceiver.py::test_kv_transfer_timeout_warns_once_per_request
    - unittest/others/test_kv_cache_transceiver.py::test_kv_transfer_timeout_silent_when_unset
    - unittest/_torch/pyexecutor/test_model_loader_mx.py
    - unittest/_torch/pyexecutor/test_hang_detector_kill.py
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
    wildcards:
      gpu:
        - '*b100*'
        - '*h100*'
        - '*h200*'
        - '*l40s*'
        - '*a10*'
        - '*a100x*'
        - '*gb202*'
        - '*gb203*'
        - '*5080*'
        - '*5090*'
      linux_distribution_name: ubuntu*
      cpu: x86_64
  tests:
    # Don't run long-running and medium-/large-size model sanity tests on GH200
    - llmapi/test_llm_examples.py::test_llmapi_speculative_decoding_mtp TIMEOUT (90)
    - llmapi/test_llm_examples.py::test_llmapi_speculative_decoding_eagle3
    - llmapi/test_llm_examples.py::test_llmapi_speculative_decoding_ngram
