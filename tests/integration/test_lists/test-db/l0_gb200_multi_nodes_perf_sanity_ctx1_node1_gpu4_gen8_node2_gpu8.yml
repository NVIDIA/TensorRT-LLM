version: 0.0.1
l0_gb200_multi_nodes_perf_sanity_ctx1_node1_gpu4_gen8_node2_gpu8:
- condition:
    ranges:
      # 1 ctx worker with 1 node and 4 GPUs
      # 8 gen workers with each 2 nodes and 8 GPUs
      system_gpu_count:
        gte: 68
        lte: 68
    wildcards:
      gpu:
      - '*gb200*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # Nemotron-3-Ultra-550B-A55B disagg-E2E throughput point (DEP8 bs128 mtp3, conc 9832).
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb200_nemotron-ultra-v3-fp4_8k64k_con9832_ctx1_dep4_gen8_dep8_eplb0_mtp3_ccb-NIXL] TIMEOUT (180)
