version: 0.0.1
# [MuseSpark CI trim] Pre-merge MuseSpark coverage for feat/musespark-open-agentx.
# Same entries as the MuseSpark cases in l0_gb300_multi_gpus.yml (post_merge only),
# promoted to pre_merge so a bare `/bot run` exercises them. Run by the
# GB300-4_GPUs-PyTorch-MuseSpark-1 stage in jenkins/L0_Test.groovy.
l0_gb300_musespark:
- condition:
    ranges:
      system_gpu_count:
        gte: 4
        lte: 4
    wildcards:
      gpu:
      - '*gb110*'
      - '*gb300*'
      linux_distribution_name: ubuntu*
      cpu: aarch64
    terms:
      stage: pre_merge
      backend: pytorch
  tests:
  # Disabled: needs the DFlash2 draft model, which the CI model cache does not have.
  # - accuracy/modeling_v2/test_musespark_open.py::TestModelingV2MuseSparkOpenNvfp4Tep4::test_dflash2_gsm8k_and_acceptance
  # - accuracy/modeling_v2/test_musespark_open.py::TestModelingV2MuseSparkOpenNvfp4Tep4::test_dflash2_acceptance_under_prefix_reuse
  # Also needs the SPEED-Bench coding prompts staged under llm-models/datasets/nvidia/SPEED-Bench.
  # - accuracy/modeling_v2/test_musespark_open.py::TestModelingV2MuseSparkOpenNvfp4Tep4::test_dflash2_speed_bench_coding_golden_acceptance
  # MuseSparkOpen GSM8K on the llm-models NVFP4 checkpoint; listed nowhere else.
  - accuracy/test_musespark_open.py::TestMuseSparkOpen::test_nvfp4_4gpus[eager]
  - accuracy/test_musespark_open.py::TestMuseSparkOpen::test_nvfp4_4gpus[cuda_graph]
  - accuracy/test_musespark_open.py::TestMuseSparkOpen::test_nvfp4_4gpus_sa_spec[sa2]
  - accuracy/test_musespark_open.py::TestMuseSparkOpen::test_nvfp4_4gpus_sa_spec[sa4]
  # MuseSparkOpen decode-path fusions (random weights, no checkpoint). The finalize+all-reduce
  # parity, stress and lifecycle files stay unlisted, as in l0_gb300_multi_gpus.yml: they need
  # an external 4- or 8-rank MPI launch and every case skips under single-process pytest.
  - unittest/_torch/modeling/test_musespark_open_router_projection.py
  - unittest/_torch/modeling/test_musespark_open_full_routing.py
  - unittest/_torch/modeling/test_musespark_open_norm_gate.py
  - unittest/_torch/modeling/test_musespark_open_boundary_fusion.py
  - unittest/_torch/modeling/test_musespark_open_cluster_boundary.py
  - unittest/_torch/modeling/test_musespark_open_pre_expert_quant.py
  - unittest/_torch/modeling/test_musespark_open_moe_prepare_overlap.py
  - unittest/_torch/modeling/test_musespark_open_fusion_switches.py
  - unittest/_torch/modeling/test_musespark_open_finalize_local.py
  - unittest/_torch/modeling/test_musespark_open_soft_cap.py
  - unittest/_torch/modules/test_logit_soft_cap.py
  # DFlash on the TRTLLM attention backend, the shared target/draft KV cache, and the
  # disaggregated KV transfer that carries it. Pre-merge CI on this branch runs only the
  # MuseSpark stages, and these files are listed on no other MuseSpark stage. This stage
  # deselects cpu_only tests; those files are on l0_cpu_musespark.yml.
  - unittest/_torch/speculative/hw_agnostic/test_dflash_trtllm_window.py
  - unittest/_torch/speculative/hw_agnostic/test_dflash_dummy_slot.py
  - unittest/_torch/speculative/hw_agnostic/test_dflash_worker.py
  - unittest/_torch/speculative/hw_agnostic/test_dflash2_semantics.py
  - unittest/_torch/executor/kv_cache/test_kv_cache_v2_attention_op_tables.py
  - unittest/disaggregated/test_kv_transfer.py
  - unittest/disaggregated/test_bounce.py
  - accuracy/test_disaggregated_serving.py::TestQwen3_8BDFlash::test_gsm8k_1p1d_unified_draft_kv
  # The Muse modeling_v2 composition over a TRTLLM drafter's paged context.
  - unittest/_torch/modeling_v2/models/musespark_open/muse_spark_open_816b_a42b_nvfp4__sm_103__tep/test_modeling_v2_drafter_context.py
  - unittest/_torch/modeling_v2/models/musespark_open/muse_spark_open_816b_a42b_nvfp4__sm_103__tep/test_modeling_v2_staged_block_offsets.py
  - unittest/_torch/modeling_v2/models/musespark_open/muse_spark_open_816b_a42b_nvfp4__sm_103__tep/ops/attention/test_modeling_v2_multi_request_split_kv_page64_gpu.py
  # Rejection-sampled steps on the Muse modeling_v2 fast paths.
  - unittest/_torch/modeling_v2/models/musespark_open/muse_spark_open_816b_a42b_nvfp4__sm_103__tep/ops/spec/test_modeling_v2_draft_path_sample.py
  - unittest/_torch/modeling_v2/models/musespark_open/muse_spark_open_816b_a42b_nvfp4__sm_103__tep/kernels/draft_head/test_modeling_v2_draft_head_sampled.py
  - unittest/_torch/modeling_v2/models/musespark_open/muse_spark_open_816b_a42b_nvfp4__sm_103__tep/ops/spec/test_modeling_v2_dflash_verify_fold_given.py
  - unittest/_torch/modeling_v2/models/musespark_open/muse_spark_open_816b_a42b_nvfp4__sm_103__tep/ops/spec/test_modeling_v2_context_kv_commit_paged.py
  # trtllm::fp4_block_scale_moe_prerouted against the stock FP4 block-scale MoE op (the target's
  # prerouted expert calls at TEP4 and TEP8).
  - unittest/_torch/modeling_v2/moe/test_modeling_v2_fp4_block_scale_moe_prerouted.py
