version: 0.0.1
l0_b200_ds_v4_1:
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
    wildcards:
      gpu:
      - '*b100*'
      - '*b200*'
      linux_distribution_name: ubuntu*
    terms:
      stage: pre_merge
      backend: pytorch
  tests:
  # Native staging allocation and FP8 prefill/decode.
  - unittest/_torch/attention/sparse/csa2/test_backend.py::test_staging_keeps_minimum_tma_backing
  - unittest/_torch/attention/sparse/csa2/test_backend.py::test_native_fp8_quantized_attention[generation-512-64]
  - unittest/_torch/attention/sparse/csa2/test_backend.py::test_native_fp8_quantized_attention[context-512-64]
  - unittest/_torch/attention/sparse/csa2/test_indexer.py::test_sparse_candidate_paged_decode_and_graph
  - unittest/_torch/kernels/serial/test_csa2_sparse_context.py
  - unittest/_torch/attention/sparse/csa2/test_backend.py::test_fused_context_matches_trtllm_gen
  - unittest/_torch/attention/sparse/csa2/test_module.py::test_context_prefill_runs_fused_kernel
  - unittest/_torch/attention/sparse/csa2/test_fused_decode.py
  - unittest/_torch/attention/sparse/csa2/test_cache_manager.py::test_context_reuse_from_the_host_tier
  # Engram coverage is maintained separately.
  - unittest/_torch/modules/test_engram.py::test_v41_engram_gate_parity
  - unittest/disaggregated/test_csa2_kv_transfer.py::test_csa2_ced_transfer_with_generation_prefix_reuse
  # CED and optional Encoder replay regressions.
  - unittest/_torch/modeling/test_deepseek_v41_decoder_global.py
  - unittest/_torch/modeling/test_deepseek_v41_ced.py
  - unittest/_torch/modeling/test_deepseek_v41_encoder_replay.py
  - unittest/_torch/modeling/test_deepseek_v41_snapshots.py
  - unittest/_torch/modules/test_engram_replay.py
  # Breakable graphs and mixed remote-tail scheduling.
  - unittest/_torch/pyexecutor/test_breakable_cuda_graph.py
  - unittest/_torch/pyexecutor/engine/runners/decoder/test_inputs.py::DecoderInputPreparerTestCase::test_breakable_mixed_eligibility_preserves_compaction_fallback
  - unittest/_torch/modeling/test_modeling_deepseekv41.py::test_remote_tail_destination_mixed_context_uses_per_row_swa_floors
