version: 0.0.1
l0_gb300_multi_nodes_node2_gpu8:
- condition:
    ranges:
      # 2 nodes with each node has 4 GPUs
      system_gpu_count:
        gte: 8
        lte: 8
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  - accuracy/test_llm_api_pytorch.py::TestQwen3_8_2_4T_A95B::test_nvfp4_tp8_mtp3_trtllm TIMEOUT (60)
  # Kimi K3 GSM8K accuracy plus an acceptance-length gate on the TEP8 DSpark
  # recipe. Measured 25m45s on 2x4 GB300.
  - accuracy/test_kimi3.py::TestKimiK3DSpark::test_gsm8k_tep8 TIMEOUT (60)
  # The MiniMax-M3 modeling_v2 tp8 target (two trays): GSM8K, and with Eagle3 GSM8K plus a chat acceptance gate.
  - accuracy/modeling_v2/test_minimax_m3.py::TestModelingV2MiniMaxM3Nvfp4Sm103Tp8::test_gsm8k TIMEOUT (60)
  - accuracy/modeling_v2/test_minimax_m3.py::TestModelingV2MiniMaxM3Nvfp4Sm103Tp8::test_eagle3_gsm8k_and_acceptance TIMEOUT (60)
  # Kimi K3 GSM8K on aggregated Helix TP4 x CP2, BF16 and FP8 KV. Measured
  # 23m45s and 17m31s on 2x4 GB300.
  - accuracy/test_kimi3.py::TestKimiK3::test_gsm8k_nvfp4_tp4_helix2[auto] TIMEOUT (60)
  - accuracy/test_kimi3.py::TestKimiK3::test_gsm8k_nvfp4_tp4_helix2[fp8] TIMEOUT (60)
  # Kimi K3 GSM8K on aggregated Helix TP4 x CP2 with block reuse on, including
  # preemption. Measured about 30 min per case on 2x4 GB300.
  - accuracy/test_kimi3.py::TestKimiK3::test_gsm8k_nvfp4_tp4_helix2_block_reuse[auto-reuse] TIMEOUT (90)
  - accuracy/test_kimi3.py::TestKimiK3::test_gsm8k_nvfp4_tp4_helix2_block_reuse[fp8-reuse] TIMEOUT (90)
  - accuracy/test_kimi3.py::TestKimiK3::test_gsm8k_nvfp4_tp4_helix2_block_reuse[fp8-reuse_preempt] TIMEOUT (90)
  # Kimi K3 GSM8K plus an acceptance-length gate with the Inferact DSpark
  # drafter on aggregated Helix, FP8 KV. Measured about 36 min per case on 2x4 GB300.
  - accuracy/test_kimi3.py::TestKimiK3DSpark::test_gsm8k_nvfp4_helix_fp8kv[tp4cp2] TIMEOUT (60)
  - accuracy/test_kimi3.py::TestKimiK3DSpark::test_gsm8k_nvfp4_helix_fp8kv[tp1cp8] TIMEOUT (60)
  # Same recipe with block reuse on: asserts reuse depth and that the drafter
  # keeps its acceptance length on a reused recall prompt.
  - accuracy/test_kimi3.py::TestKimiK3DSpark::test_gsm8k_nvfp4_helix_fp8kv_block_reuse[tp4cp2] TIMEOUT (60)
  - accuracy/test_kimi3.py::TestKimiK3DSpark::test_gsm8k_nvfp4_helix_fp8kv_block_reuse[tp1cp8] TIMEOUT (60)
  # Same recipe with a KV pool too small for the batch: requests suspend to the
  # host tier and resume, and GSM8K plus the acceptance-length gate must hold.
  - accuracy/test_kimi3.py::TestKimiK3DSpark::test_gsm8k_nvfp4_helix_fp8kv_kv_pressure TIMEOUT (60)
  - accuracy/modeling_v2/test_gpt_oss.py::TestModelingV2GptOss120bSm10xDefault::test_gsm8k[tp8]
  - accuracy/modeling_v2/test_gpt_oss.py::TestModelingV2GptOss120bSm10xDefault::test_gsm8k[dep8]
  - accuracy/modeling_v2/test_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::test_gsm8k[tp8_moetp2_ep4]
  - accuracy/modeling_v2/test_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::test_gsm8k[dep8]
  # GLM-5.2 NVFP4 modeling_v2 sm_103 tp8 target, GSM8K under modeling_v2="require".
  # Measured 34 min on 2x4 GB300 (batch 1).
  - accuracy/modeling_v2/test_glm_moe_dsa.py::TestModelingV2Glm52Nvfp4Sm103Tp8::test_gsm8k_tp8 TIMEOUT (90)
