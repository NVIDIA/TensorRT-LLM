version: 0.0.1
l0_gb200_multi_nodes_perf_sanity_ctx5_node1_gpu4_gen1_node1_gpu4:
- condition:
    ranges:
      # 5 ctx workers with 1 node and 4 GPUs each
      # 1 gen worker with 1 node and 4 GPUs
      system_gpu_count:
        gte: 24
        lte: 24
    wildcards:
      gpu:
      - '*gb200*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # Nemotron-Ultra-V3 50k2k disagg-E2E balanced point (5 ctx DEP4 : 1 gen DEP4, conc 178).
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb200_nemotron-ultra-v3-fp4_50k2k_con178_ctx5_dep4_gen1_dep4_eplb0_mtp6_ccb-NIXL] TIMEOUT (90)
  # Nemotron-Ultra-V3 50k2k disagg gen-only balanced point (5 ctx DEP4 : 1 gen DEP4, conc 178).
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-gen_only-gb200_nemotron-ultra-v3-fp4_50k2k_con178_ctx5_dep4_gen1_dep4_eplb0_mtp6_ccb-NIXL] TIMEOUT (90)
