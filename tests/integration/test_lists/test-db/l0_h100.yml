version: 0.0.1
l0_h100:
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
    wildcards:
      gpu:
      - '*h100*'
      linux_distribution_name: ubuntu*
    terms:
      stage: pre_merge
      backend: pytorch
      orchestrator: mpi
  tests:
  # ------------- PyTorch tests ---------------
  - unittest/_torch/attention
  - unittest/_torch/auto_deploy
  - unittest/_torch/compilation
  - unittest/_torch/debugger
  - unittest/_torch/executor
  - unittest/_torch/peft
  - unittest/_torch/misc
  # ------------- modules (non-MoE) ---------------
  - unittest/_torch/modules/test_mla_helix.py
  - unittest/_torch/modules/test_fused_add_rms_norm_quant.py
  - unittest/_torch/modules/test_fused_activation_quant.py
  - unittest/_torch/modules/test_awq_quantization.py
  - unittest/_torch/modules/test_triton_linear.py
  - unittest/_torch/modules/test_group_rmn_norm.py
  - unittest/_torch/modules/test_rotary_embedding.py
  - unittest/_torch/modules/mamba
  - unittest/_torch/modules/tests_lora_modules
  - unittest/_torch/modules/test_w4a16_nvfp4_linear.py
  # ------------- MoE components tests ---------------
  - unittest/_torch/modules/test_moe_load_balancer.py
  - unittest/_torch/modules/test_moe_routing.py
  - unittest/_torch/modules/fused_moe/test_deepgemm_fused_gather_finalize.py
  - unittest/_torch/modules/fused_moe/test_deepgemm_fused_expand_quant.py
  # ------------- MoE: test_moe_backend (by backend) ---------------
  # ------------- MoE: test_single_gpu (by backend) ---------------
  - unittest/_torch/modules/moe/test_moe_module.py::test_configurable_moe_single_gpu -k "CUTLASS and not None"
  # ------------- Kimi K3 MoE unit tests ---------------
  # Any-CUDA (Triton trtllm::situ_and_mul op + torch reference, requires_cuda
  # only; not SM100/SM103-gated), so they run on Hopper rather than consuming
  # scarce Blackwell pre-merge capacity. The Blackwell-gated K3 suites live in
  # l0_b200.yml / l0_gb300_multi_gpus.yml. (TRTLLM-15177)
  - unittest/_torch/modules/moe/test_kimi_k3_mlp.py
  - unittest/_torch/modules/moe/test_kimi_k3_moe_gate.py
  - unittest/_torch/modules/moe/test_kimi_k3_situ_and_mul.py
  - unittest/_torch/multimodal -k "not nemotron_nano_v2_vl_fp8"
  # test_speculative_d2h_parity_real_predictor (both no_stop_token and
  # stop_token_15) is a HW-agnostic sampler D2H-parity invariant (plain CUDA
  # stream/event, no SM gating), covered on A30 pre-merge; drop that whole
  # function's leaves on Hopper, keep the rest of the sampler dir.
  - unittest/_torch/sampler -k "not test_speculative_d2h_parity_real_predictor"
  - unittest/_torch/speculative/test_eagle3.py
  - unittest/_torch/speculative/test_rejection_buffers_guard.py
  - unittest/_torch/speculative/test_capture_override_leak.py
  - unittest/_torch/speculative/test_sa_hybrid_state_promotion.py
  - unittest/_torch/speculative/hw_agnostic
  - unittest/_torch/thop/parallel
  - unittest/_torch/thop/parallel_hw_agnostic
  - unittest/_torch/thop/serial
  # Only key models in H100: llama/mixtral/gemma/gpt-oss
  - unittest/_torch/modeling -k "modeling_llama"
  - unittest/_torch/modeling -k "modeling_mixtral"
  - unittest/_torch/modeling -k "modeling_gemma3"
  - unittest/_torch/modeling -k "modeling_gpt_oss"
  - unittest/_torch/modeling -k "modeling_whisper"  # CPU-only log-mel parity
  - unittest/_torch/modeling/test_modeling_nemotron_h.py::test_nemotron_h_sanity
  # Real-weight Nano CG/overlap and chunked-prefill path smoke (MoE L0 cannot
  # reuse dense-8B greedy/logprob equality; accuracy stays on GSM8K/MMLU).
  - unittest/_torch/modeling/test_modeling_nemotron_h.py::test_nemotron_h_cuda_graph_overlap_scheduler
  - unittest/_torch/modeling/test_modeling_nemotron_h.py::test_nemotron_h_chunked_prefill
  - unittest/_torch/modeling/test_multimodal_encoder_graph.py
  # Qwen3.5-MoE-VL is hybrid (Mamba SSM + attention); FlashInfer's
  # chunk_gated_delta_rule GDN prefill kernel is sm90+ only, so this
  # test must run on Hopper-or-newer GPUs. Peer Qwen3-VL / Qwen3-VL-MoE
  # tests stay on L40s because they're pure attention and don't trigger the GDN kernel.
  - unittest/_torch/modeling/test_modeling_qwen3_5_vl_moe.py::TestQwen3_5MoeVL::test_all
  # Dense Qwen3.5-VL is the same hybrid family (sm90+ GDN kernel), so it lands here too.
  - unittest/_torch/modeling/test_modeling_qwen3_5_vl.py::TestQwen3_5VL::test_all
