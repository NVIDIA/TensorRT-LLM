  # Main transfer matrix.
  - unittest/disaggregated/test_cache_transceiver_single_process.py::test_cache_transceiver -k "v1 and no_window"
  - unittest/disaggregated/test_cache_transceiver_single_process.py::test_cache_transceiver -k "v1 and uniform_window"
  - unittest/disaggregated/test_cache_transceiver_single_process.py::test_cache_transceiver -k "v2 and no_window"
