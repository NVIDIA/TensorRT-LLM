  # KV connector. The suite is parametrized over the KV cache manager and both
  # halves are gated: the connector is supported on KVCacheManagerV2, so a V2
  # regression has to be a merge-gate failure rather than something found later
  # by hand. test_connector_runs_on_kv_cache_manager_v2 is what makes the V2
  # entries meaningful -- the creator silently falls back to the V1 manager for
  # combinations it cannot serve, so without it every V2 id below could pass
  # while running V1. test_connector_priorities[kv_cache_manager_v2] is
  # xfail(strict=True) in the suite, not omitted here, so the retention gap
  # stays counted. The two e2e cases below are the only multi-layer-group ones
  # that move bytes -- the rest drive a MagicMock and assert routing.
  # test_connector_vswa_e2e_gemma3 is the interleaved-attention run (Gemma-3
  # asks for KVCacheManagerV2 itself, and its layer groups come out different
  # sizes); test_connector_multi_pool_e2e_persistent_cache is the same data
  # path on a uniform model with the windows imposed, which is faster and
  # isolates the cache plumbing from the model. Those two keep the run inside
  # the window on purpose; test_connector_vswa_out_of_window_blocks_reach_the_connector
  # is the complement, with the window set below the prompt length so blocks
  # genuinely go stale.
  - llmapi/test_llm_api_connector.py::test_v2_connector_contract_does_not_reuse_the_v1_methods
  - llmapi/test_llm_api_connector.py::test_connector_runs_on_kv_cache_manager_v2
  - llmapi/test_llm_api_connector.py::test_connector_simple[kv_cache_manager_v1-True]
  - llmapi/test_llm_api_connector.py::test_connector_simple[kv_cache_manager_v1-False]
  - llmapi/test_llm_api_connector.py::test_connector_async_onboard[kv_cache_manager_v1-True]
  - llmapi/test_llm_api_connector.py::test_connector_async_onboard[kv_cache_manager_v1-False]
  - llmapi/test_llm_api_connector.py::test_connector_async_save[kv_cache_manager_v1-True]
  - llmapi/test_llm_api_connector.py::test_connector_async_save[kv_cache_manager_v1-False]
  - llmapi/test_llm_api_connector.py::test_connector_scheduler_output[kv_cache_manager_v1-True]
  - llmapi/test_llm_api_connector.py::test_connector_scheduler_output[kv_cache_manager_v1-False]
  - llmapi/test_llm_api_connector.py::test_connector_scheduler_output_chunked_context[kv_cache_manager_v1-True]
