version: 0.0.1
l0_gb300_multi_gpus_perf_sanity_agentx:
- condition:
    ranges:
      system_gpu_count:
        gte: 4
        lte: 4
    wildcards:
      gpu:
      - '*gb300*'
      linux_distribution_name: ubuntu*
      cpu: aarch64
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # minimax-m3-fp4 AgentX (aggregated, 1h trace replay per case, 3 cases)
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gb300_minimax_m3_fp4_agentx_grace_blackwell-minimax_m3_fp4_tp2_mtp3_c45_agentx] TIMEOUT (150)
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gb300_minimax_m3_fp4_agentx_grace_blackwell-minimax_m3_fp4_tp4_mtp5_c15_agentx] TIMEOUT (150)
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gb300_minimax_m3_fp4_agentx_grace_blackwell-minimax_m3_fp4_tp4_mtp7_c1_agentx] TIMEOUT (150)
