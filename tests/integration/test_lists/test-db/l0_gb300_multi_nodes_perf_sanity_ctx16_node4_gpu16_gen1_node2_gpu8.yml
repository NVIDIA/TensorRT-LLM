version: 0.0.1
l0_gb300_multi_nodes_perf_sanity_ctx16_node4_gpu16_gen1_node2_gpu8:
- condition:
    ranges:
      # 16 single-GPU DWDP ctx workers packed on 4 nodes (16 GPUs)
      # 1 gen worker with 2 nodes and 8 GPUs
      system_gpu_count:
        gte: 24
        lte: 24
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # kimi-k3-fp4 dspark 160k1k con16: DWDP16 ctx fleet, helix CP8 gen worker
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_kimi-k3-fp4-dspark_160k1k_con16_ctx16_dwdp16_gen1_helix8_bs16_dspark5_ccb-NIXL] TIMEOUT (50)
