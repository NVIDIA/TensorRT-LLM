version: 0.0.1
l0_gb300_multi_nodes_perf_sanity_ctx16_node1_gpu1_gen3_node2_gpu8:
- condition:
    ranges:
      # 16 ctx workers each with 1 GPU, packed 4 per node as one DWDP16 MPI step (4 nodes)
      # 3 gen workers each with 2 nodes and 8 GPUs (helix CP8)
      system_gpu_count:
        gte: 40
        lte: 40
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # kimi-k3-nvfp4 dspark agentx. e2e only, as for the other agentx lanes: the
  # trace's ~1M-token conversations cannot fill a gen_only batch.
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_kimi-k3-fp4-dspark_agentx_con138_ctx16_dwdp16_gen3_helix8_bs16_dspark5_ccb-NIXL] TIMEOUT (240)
