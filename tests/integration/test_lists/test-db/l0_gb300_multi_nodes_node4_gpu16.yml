version: 0.0.1
l0_gb300_multi_nodes_node4_gpu16:
- condition:
    ranges:
      # 4 nodes with each node has 4 GPUs
      system_gpu_count:
        gte: 16
        lte: 16
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  - accuracy/test_kimi3.py::TestKimiK3::test_gpqa_diamond_w4a16_mxfp4 TIMEOUT (180)
  - accuracy/test_llm_api_pytorch.py::TestQwen3_8_2_4T_A95B::test_nvfp4_adp16_cutedsl TIMEOUT (90)
  # Kimi K3 GSM8K accuracy guard (DEP16). The reuse/dspark legs and MMMU
  # stay QA-weekly-only via qa/functional/llm_function_multinode.yml, which also
  # keeps running the two legs below.
  - accuracy/test_kimi3.py::TestKimiK3::test_w4a16_mxfp4[baseline] TIMEOUT (90)
  - accuracy/test_kimi3.py::TestKimiK3::test_w4a16_mxfp4[sa] TIMEOUT (90)
  - test_e2e.py::test_multi_nodes_eval[MiniMax-M3-tp16-mmlu]
  # Kimi K3.1 modeling_v2 sm_103 DEP target (DEP16): GSM8K, GPQA Diamond, and DFlash2 w5 GSM8K plus its
  # acceptance-length gate.
  - accuracy/modeling_v2/kimi_k31/kimi_k31_pro_mxfp4__sm_103__dep/test_accuracy.py::TestModelingV2KimiK31ProMxfp4Sm103Dep::test_gsm8k[dep16] TIMEOUT (90)
  - accuracy/modeling_v2/kimi_k31/kimi_k31_pro_mxfp4__sm_103__dep/test_accuracy.py::TestModelingV2KimiK31ProMxfp4Sm103Dep::test_gpqa_diamond[dep16] TIMEOUT (180)
  - accuracy/modeling_v2/kimi_k31/kimi_k31_pro_mxfp4__sm_103__dep/test_accuracy.py::TestModelingV2KimiK31ProMxfp4Sm103Dep::test_gsm8k_dflash2[dep16] TIMEOUT (90)
  # Kimi K3.1 modeling_v2 NVFP4 default target (DEP16, its validated recipe with DFlash2), GSM8K.
  - accuracy/modeling_v2/kimi_k31/kimi_k31_pro_nvfp4__sm_10x__default/test_accuracy.py::TestModelingV2KimiK31ProNvfp4Sm10xDefault::test_gsm8k[dep16] TIMEOUT (90)
