version: 0.0.1
l0_gb300_multi_nodes_node4_gpu16:
- condition:
    ranges:
      # 4 nodes with each node has 4 GPUs
      system_gpu_count:
        gte: 16
        lte: 16
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  - accuracy/test_kimi3.py::TestKimiK3::test_gpqa_diamond_w4a16_mxfp4 TIMEOUT (180)
  - accuracy/test_llm_api_pytorch.py::TestQwen3_8_2_4T_A95B::test_nvfp4_adp16_cutedsl TIMEOUT (90)
  # Kimi K3 GSM8K accuracy guard (DEP16). The reuse/dspark legs and MMMU
  # stay QA-weekly-only via qa/llm_function_multinode.txt, which also
  # keeps running the two legs below.
  - accuracy/test_kimi3.py::TestKimiK3::test_w4a16_mxfp4[baseline] TIMEOUT (90)
  - accuracy/test_kimi3.py::TestKimiK3::test_w4a16_mxfp4[sa] TIMEOUT (90)
  # Kimi K3.1 Pro DEP16 (nvfp4_ds_mla KV, FP4 index keys, DSpark): GSM8K with an acceptance-length
  # gate, and GPQA Diamond.
  - accuracy/test_kimi31.py::TestKimiK31::test_gsm8k_dep16 TIMEOUT (60)
  - accuracy/test_kimi31.py::TestKimiK31::test_gpqa_diamond_dep16 TIMEOUT (120)
  - test_e2e.py::test_multi_nodes_eval[MiniMax-M3-tp16-mmlu]
