  - unittest/_torch/modules/test_fused_add_rms_norm_quant.py
  - unittest/_torch/modules/test_fused_activation_quant.py
  - unittest/_torch/modules/test_awq_quantization.py
  - unittest/_torch/modules/test_triton_linear.py
  - unittest/_torch/modules/test_group_rmn_norm.py
  - unittest/_torch/modules/mamba
  - unittest/_torch/modules/tests_lora_modules
  # DWDP expert prefetch on real streams and copies, incl. the gather from
  # peer GPUs.
  - unittest/_torch/modules/dwdp/test_dwdp_prefetch_gpu.py
  # Attached dense DWDP beside the expert prefetch on real streams and copies.
  - unittest/_torch/modules/dwdp/test_dense_attached_gpu.py
  # ------------- MoE components tests ---------------
  - unittest/_torch/moe/test_moe_load_balancer.py
  - unittest/_torch/moe/test_moe_routing.py
  # MegaMoE on four ranks: padding rows are dropped, the live-row word is written in stream order.
  - unittest/_torch/moe/test_megamoe_live_rows_gpu.py
