version: 0.0.1
l0_gb300_multi_gpus:
- condition:
    ranges:
      system_gpu_count:
        gte: 4
        lte: 4
    wildcards:
      gpu:
      - '*gb110*'
      - '*gb300*'
      linux_distribution_name: ubuntu*
      cpu: aarch64
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # MiniMax-M3 target unit tests.
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/comm
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/comm
  # One ordered sequence in one job: the cases share module-global rank state.
  - unittest/_torch/modeling_v2/comm
  - accuracy/modeling_v2/test_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::test_gsm8k_identity_vs_mtp3[dep4]
  - accuracy/modeling_v2/test_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::test_mtp3_acceptance[modeling_v2-dep4]
  - accuracy/modeling_v2/test_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::test_mtp3_acceptance[stock-dep4]
  - accuracy/modeling_v2/test_gpt_oss.py::TestModelingV2GptOss120bSm10xDefault::test_gsm8k[tp2]
  - accuracy/modeling_v2/test_gpt_oss.py::TestModelingV2GptOss120bSm10xDefault::test_gsm8k[tp4_ep4]
  - accuracy/modeling_v2/test_gpt_oss.py::TestModelingV2GptOss120bSm10xDefault::test_gsm8k[dep4_moetp2_ep2]
  - accuracy/modeling_v2/test_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::test_gsm8k[tp4]
  - accuracy/modeling_v2/test_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::test_gsm8k[tp4_ep4]
  - accuracy/modeling_v2/test_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::test_gsm8k[dep4_moetp4]
  - accuracy/modeling_v2/test_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::test_gsm8k_chunked_prefill[tp4_ep4]
  - accuracy/modeling_v2/test_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::test_gsm8k_chunked_prefill[dep4]
  - accuracy/modeling_v2/test_minimax_m3.py::TestModelingV2MiniMaxM3Nvfp4Sm103Tp4::test_gsm8k
  - accuracy/modeling_v2/test_minimax_m3.py::TestModelingV2MiniMaxM3Nvfp4Sm103Tp4::test_eagle3_gsm8k_and_acceptance
  # Covers the GPU cases of tests/unittest/_torch/attention/ on GB300, kernels/ and
  # multi_gpu/ included; its cpu_only cases run on CPU (l0_cpu). The GPU cases of
  # kernels/parallel_hw_agnostic/ run here too, although l0_b200 and l0_b300 ignore that
  # directory: an --ignore would change this entry's text, which agg_unit_mem_df.csv
  # matches to set its parallelism. This post_merge stage is the only Blackwell stage that
  # runs them.
  - unittest/_torch/attention TIMEOUT (120)
  - unittest/_torch/moe/kernels/parallel
  - unittest/_torch/kernels/parallel
  - unittest/_torch/visual_gen/kernels/parallel
  - unittest/_torch/moe/kernels/serial
  - unittest/_torch/kernels/serial
  - unittest/_torch/pyexecutor
  - unittest/_torch/disaggregation
  # GLM-5.3-Flash: ADP/MTP/FP8-KV and non-speculative prefix reuse.
  - accuracy/test_glm53_flash.py::TestGLM53FlashFP8::test_attention_dp_mtp_and_fp8_kv[adp-mtp3-fp8-kv] TIMEOUT (60)
  - accuracy/test_glm53_flash.py::TestGLM53FlashFP8::test_block_reuse[tp_size=4-ep_size=4] TIMEOUT (60)
  # ------------- modules (non-MoE) ---------------
  - unittest/_torch/modules/test_fused_add_rms_norm_quant.py
  - unittest/_torch/modules/test_fused_activation_quant.py
  - unittest/_torch/modules/test_awq_quantization.py
  - unittest/_torch/modules/test_triton_linear.py
  - unittest/_torch/modules/test_group_rmn_norm.py
  - unittest/_torch/modules/mamba
  - unittest/_torch/modules/tests_lora_modules
  # DWDP expert prefetch on real streams and copies, incl. the gather from
  # peer GPUs.
  - unittest/_torch/modules/dwdp/test_dwdp_prefetch_gpu.py
  # ------------- MoE components tests ---------------
  - unittest/_torch/moe/test_moe_load_balancer.py
  - unittest/_torch/moe/test_moe_routing.py
  # MNNVL all-reduce + residual RMSNorm kernels (slot / two-shot / MoE fold / GEMM) and the LL TP exchanges.
  - unittest/_torch/multi_gpu/test_mnnvl_fused_allreduce_norm.py
  - unittest/_torch/multi_gpu/test_ll_exchange.py
  - unittest/_torch/modeling -k "modeling_llama"
  - unittest/_torch/modeling -k "modeling_gpt_oss"
  - unittest/_torch/modules/kimi_k3_attn_res/test_attn_res_op.py
  - unittest/_torch/modules/kimi_k3_attn_res/test_attn_res_rmsnorm_op.py
  # KDA runtime state-pool and mixed-batch core coverage.
  - unittest/_torch/modules/kimi_kda/test_kimi_kda_bf16_state_pool.py
  - unittest/_torch/modules/kimi_kda/test_kda_mixed_batch_core_layout.py
  # Kimi K3 MoE routing shape on the TRTLLM backend (random weights, no
  # checkpoint; the case moved out of the skipped TestMoeFp4 class).
  - unittest/_torch/moe/test_moe_backend.py -k "kimi_k3_shape"
  # Vocab-parallel token selection over TP2/TP4 vocab shards, MNNVL and
  # default all-reduce.
  - unittest/_torch/multi_gpu/test_vocab_parallel_selection.py
  # Kimi K3 truncated-model (first 4 layers) e2e SA spec-dec logits parity;
  # resolves <LLM_MODELS_ROOT>/Kimi-K3 and FAILS if the checkpoint is not
  # staged (deliberate: a skipped post-merge entry is indistinguishable
  # from a pass, so a vanished checkpoint must be a visible regression).
  - test_kimi_k3_specdec.py::test_kimi_k3_sa_specdec_logits_parity TIMEOUT (40)
  # TP2 DSpark MLA drafter (split context projection, fused all-reduce + norm)
  # vs the single-GPU drafter.
  - unittest/_torch/multi_gpu/test_dspark_drafter_tp_fusion.py
  - unittest/_torch/multi_gpu_modeling -k "deepseek"
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4_4gpus[moe_backend=CUTLASS-mtp_nextn=0-ep4-fp8kv=True-attention_dp=True-cuda_graph=True-overlap_scheduler=True-low_precision_combine=False-torch_compile=True]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4_4gpus[moe_backend=CUTLASS-mtp_nextn=0-tp2pp2-fp8kv=False-attention_dp=False-cuda_graph=False-overlap_scheduler=False-low_precision_combine=False-torch_compile=True]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4_4gpus[moe_backend=CUTLASS-mtp_nextn=2-tp4-fp8kv=False-attention_dp=False-cuda_graph=False-overlap_scheduler=False-low_precision_combine=False-torch_compile=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4_4gpus[moe_backend=CUTLASS-mtp_nextn=2-tp4-fp8kv=True-attention_dp=True-cuda_graph=True-overlap_scheduler=True-low_precision_combine=False-torch_compile=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4_4gpus[moe_backend=CUTLASS-mtp_nextn=2-ep4-fp8kv=False-attention_dp=False-cuda_graph=False-overlap_scheduler=False-low_precision_combine=False-torch_compile=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4_4gpus[moe_backend=CUTLASS-mtp_nextn=2-ep4-fp8kv=True-attention_dp=True-cuda_graph=True-overlap_scheduler=True-low_precision_combine=False-torch_compile=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4_4gpus[moe_backend=CUTLASS-mtp_nextn=2-tp2pp2-fp8kv=False-attention_dp=False-cuda_graph=False-overlap_scheduler=False-low_precision_combine=False-torch_compile=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4_4gpus[moe_backend=CUTLASS-mtp_nextn=2-tp2pp2-fp8kv=True-attention_dp=True-cuda_graph=True-overlap_scheduler=True-low_precision_combine=False-torch_compile=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4_4gpus[moe_backend=CUTLASS-mtp_nextn=2-pp4-fp8kv=True-attention_dp=True-cuda_graph=True-overlap_scheduler=True-low_precision_combine=False-torch_compile=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4_4gpus[moe_backend=TRTLLM-mtp_nextn=2-tp4-fp8kv=True-attention_dp=True-cuda_graph=True-overlap_scheduler=True-low_precision_combine=False-torch_compile=False]
