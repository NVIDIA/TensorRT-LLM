version: 0.0.1
l0_gb300_multi_nodes_perf_sanity_ctx16_node1_gpu1_gen1_node4_gpu16:
- condition:
    ranges:
      # 16 ctx workers each with 1 GPU, packed 4 per node as one DWDP16 MPI step (4 nodes)
      # 1 gen worker with 4 nodes and 16 GPUs (helix CP16)
      system_gpu_count:
        gte: 32
        lte: 32
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # kimi-k3-nvfp4 dspark agentx. No gen_only lane, as for the other agentx
  # lanes: the trace's ~1M-token conversations cannot fill a gen_only batch.
  # The ctx_only and gen_only_no_context lanes are in
  # l0_gb300_multi_nodes_perf_sanity_node4_gpu16 and
  # l0_gb300_multi_nodes_perf_sanity_gen1_node{2_gpu8,4_gpu16}.
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_kimi-k3-fp4-dspark_agentx_con220_ctx16_dwdp16_gen1_helix16_bs128_dspark6_ccb-NIXL] TIMEOUT (240)
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_kimi-k3-fp4-dspark_agentx_con88_ctx16_dwdp16_gen1_helix16_bs32_dspark6_ccb-NIXL] TIMEOUT (240)
