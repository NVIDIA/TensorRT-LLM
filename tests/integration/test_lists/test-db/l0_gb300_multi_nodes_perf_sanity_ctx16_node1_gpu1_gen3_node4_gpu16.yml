version: 0.0.1
l0_gb300_multi_nodes_perf_sanity_ctx16_node1_gpu1_gen3_node4_gpu16:
- condition:
    ranges:
      # 16 ctx workers each with 1 GPU, packed 4 per node as one DWDP16 MPI step (4 nodes)
      # 3 gen workers each with 4 nodes and 16 GPUs (helix CP16)
      system_gpu_count:
        gte: 64
        lte: 64
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # kimi-k3-nvfp4 dspark agentx. No gen_only lane, as for the other agentx
  # lanes: the trace's ~1M-token conversations cannot fill a gen_only batch.
  # The ctx_only and gen_only_no_context lanes are in
  # l0_gb300_multi_nodes_perf_sanity_node4_gpu16 and
  # l0_gb300_multi_nodes_perf_sanity_gen1_node{2_gpu8,4_gpu16}.
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_kimi-k3-fp4-dspark_agentx_con63_ctx16_dwdp16_gen3_helix16_bs4_dspark7_ccb-NIXL] TIMEOUT (240)
