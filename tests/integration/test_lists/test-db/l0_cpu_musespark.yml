version: 0.0.1
# [MuseSpark CI trim] CPU-only MuseSpark coverage for feat/musespark-open-agentx: the
# cpu_only-marked MuseSpark tests that l0_cpu.yml already runs. Run by the
# CPU-Generic-x86-MuseSpark-1 stage in jenkins/L0_Test.groovy.
l0_cpu_musespark:
- condition:
    ranges:
      system_gpu_count:
        gte: 0
        lte: 0
    wildcards:
      linux_distribution_name: ubuntu*
    terms:
      stage: pre_merge
      backend: generic
      orchestrator: mpi
  tests:
  - unittest/llmapi/apps/test_musespark_serve_extensions.py
  - unittest/_torch/modeling_v2/models/musespark_open/muse_spark_open_816b_a42b_nvfp4__sm_103__tep/test_modeling_v2_tep4_extra_paths.py
  - unittest/_torch/modeling_v2/models/musespark_open/test_deployment_defaults.py
  # Picked up on l0_cpu through the unittest/_torch/modeling directory entry.
  - unittest/_torch/modeling/test_modeling_musespark_open_preprocess.py
  - unittest/_torch/modeling_v2/models/musespark_open/muse_spark_open_816b_a42b_nvfp4__sm_103__tep/ops/attention/test_modeling_v2_multi_request_split_kv_page64.py
  # The cpu_only tests of DFlash on the TRTLLM attention backend, the shared target/draft KV
  # cache and the disaggregated KV transfer; l0_gb300_musespark.yml runs the rest.
  - unittest/_torch/speculative/hw_agnostic/test_dflash_draft_kv.py
  - unittest/_torch/speculative/hw_agnostic/test_dflash_ctx_block_tables.py
  - unittest/_torch/speculative/hw_agnostic/test_musespark_rejects_vanilla.py
  - unittest/_torch/executor/kv_cache/test_dflash_unified_kv_gate.py
  - unittest/_torch/executor/kv_cache/test_kv_cache_v2_scheduler_prepare_ahead.py
  - unittest/llmapi/test_disagg_dflash_guard.py
  - unittest/disaggregated/test_disagg_draft_window.py
  - unittest/disaggregated/test_kv_transfer.py
  - unittest/disaggregated/test_peer.py
  - unittest/disaggregated/test_rank_info.py
  - unittest/disaggregated/test_transfer_ownership_regressions.py
  - unittest/_torch/modules/dwdp/test_dwdp_mixed_layers.py
  # The cpu_only tests of the pipeline-parallel and disaggregated context-server paths
  # (stand-in PP ranks over the real scheduler, buffered PP P2P, the prompt_lens guard), listed
  # by file so that this stage runs them (l0_cpu.yml reaches them only through directory entries).
  - unittest/_torch/attention/test_prompt_lens_guard.py
  - unittest/_torch/distributed/test_pp_buffered_p2p.py
  - unittest/_torch/executor/test_pp_admission_backpressure.py
  - unittest/_torch/executor/test_pp_admission_backpressure_loop.py
  - unittest/_torch/executor/test_pp_compact_spec_relay.py
  - unittest/_torch/executor/test_pp_adopt_admission_order.py
  - unittest/_torch/executor/test_pp_ctx_diag.py
  - unittest/_torch/executor/test_pp_ctx_diag_executor.py
  - unittest/_torch/executor/test_pp_disagg_lagged_consensus.py
  - unittest/_torch/executor/test_pp_follower_early_release.py
  - unittest/_torch/executor/test_pp_follower_page_pressure.py
  - unittest/_torch/executor/test_pp_follower_schedule.py
  - unittest/_torch/executor/test_pp_longchain_protect.py
  - unittest/_torch/executor/test_pp_relay_eager.py
  - unittest/_torch/executor/test_pp_req_send_depth.py
  - unittest/_torch/executor/test_pp_ring_depth.py
  - unittest/_torch/executor/test_pp_stage_agree_lagged_loop.py
  - unittest/_torch/executor/test_pp_stage_agreement.py
  - unittest/_torch/executor/test_pp_subagent_idle_drop.py
