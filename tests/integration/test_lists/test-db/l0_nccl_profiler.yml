version: 0.0.1
l0_nccl_profiler:
- condition:
    ranges:
      system_gpu_count:
        gte: 2
        lte: 2
    wildcards:
      gpu:
      - '*h100*'
      linux_distribution_name: ubuntu*
    terms:
      stage: pre_merge
      backend: pytorch
      orchestrator: mpi
  tests:
  - test_unittests.py::test_nccl_profiler_build_contract[on]
