version: 0.0.1
l0_b300:
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
    wildcards:
      gpu:
      - '*gb110*'
      - '*b300*'
      linux_distribution_name: ubuntu*
      cpu: x86_64
    terms:
      stage: pre_merge
      backend: pytorch
  tests:
  # ------------- PyTorch tests ---------------
  - unittest/_torch/attention --ignore=unittest/_torch/attention/sparse/test_cute_dsl_fp8_paged_mqa_logits.py --ignore=unittest/_torch/attention/sparse/test_cute_dsl_fp4_paged_mqa_logits.py --ignore=unittest/_torch/attention/sparse/test_cute_dsl_gvr_topk_decode.py --ignore=unittest/_torch/attention/sparse/test_cute_dsl_gvr_topk_tiers.py
  - unittest/_torch/attention/sparse/test_cute_dsl_fp8_paged_mqa_logits.py
  - unittest/_torch/attention/sparse/test_cute_dsl_fp4_paged_mqa_logits.py
  - unittest/_torch/attention/sparse/test_cute_dsl_gvr_topk_decode.py
  - unittest/_torch/attention/sparse/test_cute_dsl_gvr_topk_tiers.py
  - unittest/_torch/thop/parallel TIMEOUT (90)
  - unittest/_torch/visual_gen/kernels/parallel
  - unittest/_torch/thop/serial
  - unittest/_torch/executor # 250s
  # ------------- modules (non-MoE) ---------------
  - unittest/_torch/modules/test_fused_add_rms_norm_quant.py
  - unittest/_torch/modules/test_fused_activation_quant.py
  - unittest/_torch/modules/test_awq_quantization.py
  - unittest/_torch/modules/test_triton_linear.py
  - unittest/_torch/modules/test_mxfp8_linear.py
  - unittest/_torch/modules/test_group_rmn_norm.py
  - unittest/_torch/modules/test_rotary_embedding.py
  - unittest/_torch/modules/test_low_m_gemm.py
  - unittest/_torch/modules/mamba
  - unittest/_torch/modules/tests_lora_modules
  # ------------- MoE components tests ---------------
  - unittest/_torch/moe/test_moe_load_balancer.py
  - unittest/_torch/moe/test_moe_routing.py
  - unittest/_torch/moe/fused_moe/test_deepgemm_fused_gather_finalize.py
  - unittest/_torch/moe/fused_moe/test_deepgemm_fused_expand_quant.py
  # ------------- Kimi K3 NVFP4: expert loading + SiTU ---------------
  # Listed test-by-test on purpose. The rest of this file has 19 failures that
  # predate this work (verified by running the base revision's copy against the
  # same source), so registering the whole module would import them into CI as
  # if they were ours. Those are reported separately; these are green.
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_kimi_k3_expert_ckpt_spec_selection
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_fp8_block_scaled_dequantization
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_materialize_handles_scalar_lazy_safetensors
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_nvfp4_streaming_expert_load_matches_whole_checkpoint[threads1]
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_nvfp4_streaming_expert_load_matches_whole_checkpoint[threads4]
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_nvfp4_streaming_expert_load_w1_w3_order_is_load_bearing
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_nvfp4_streaming_expert_load_rejects_duplicate_slot
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_nvfp4_streaming_drains_staging_per_expert
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_nvfp4_streamed_experts_forward_runs
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_cutlass_situ_bf16_matches_reference
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_nvfp4_kernel_actually_applies_situ[CUTLASS]
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_nvfp4_kernel_actually_applies_situ[TRTLLM]
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_nvfp4_experts_match_situ_reference[CUTLASS-static_1.0]
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_nvfp4_experts_match_situ_reference[TRTLLM-static_1.0]
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_megamoe_streamed_coverage_survives_per_expert_drain
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_megamoe_overrides_finalize_streamed_expert
  - unittest/_torch/moe/test_kimi_k3_situ_moe.py::test_mega_format_transform_is_slot_blockwise
  # ------------- MoE: test_moe_backend (by backend) ---------------
  - unittest/_torch/moe/test_moe_backend.py::test_trtllm_bf16_unquantized_moe
  - unittest/_torch/moe/test_moe_backend.py::test_trtllm_fp8_block_scales_fused_shared_experts
  - unittest/_torch/moe/test_moe_backend.py::test_trtllm_fp8_block_scales_fuse_shared_expert_layout
  - unittest/_torch/moe/test_moe_backend.py::test_trtllm_gen_nvfp4_situ_selects_padded_quant_method
  - unittest/_torch/moe/test_moe_backend.py::test_trtllm_gen_nvfp4_situ_fc31_scale_c_drops_dequant_scale
  - unittest/_torch/moe/test_moe_backend.py::test_trtllm_gen_situ_rejects_quant_algos_without_fused_cubins
  # ------------- MoE: test_single_gpu (specific quant per backend) ---------------
  # CUTLASS backend: FP8, NVFP4, W4A8_MXFP4_MXFP8, W8A16
  - unittest/_torch/moe/test_moe_module.py::test_configurable_moe_single_gpu[e60_k4_h2048_i1408-seq=1-dtype=torch.bfloat16-backend=CUTLASS-quant=FP8-routing=Renormalize]
  - unittest/_torch/moe/test_moe_module.py::test_configurable_moe_single_gpu[e60_k4_h2048_i1408-seq=1-dtype=torch.bfloat16-backend=CUTLASS-quant=NVFP4-routing=Renormalize]
  - unittest/_torch/moe/test_moe_module.py::test_configurable_moe_single_gpu[e60_k4_h2048_i1408-seq=1-dtype=torch.bfloat16-backend=CUTLASS-quant=W4A8_MXFP4_MXFP8-routing=Renormalize]
  - unittest/_torch/moe/test_moe_module.py::test_configurable_moe_single_gpu[e60_k4_h2048_i1408-seq=1-dtype=torch.bfloat16-backend=CUTLASS-quant=W8A16-routing=Renormalize]
  # TRTLLM backend: NVFP4, FP8_BLOCK_SCALES, W4A8_NVFP4_FP8, W4A16_MXFP4
  - unittest/_torch/moe/test_moe_module.py::test_configurable_moe_single_gpu[e60_k4_h2048_i1408-seq=1-dtype=torch.bfloat16-backend=TRTLLM-quant=NVFP4-routing=Renormalize]
  - unittest/_torch/moe/test_moe_module.py::test_configurable_moe_single_gpu[e60_k4_h2048_i1408-seq=1-dtype=torch.bfloat16-backend=TRTLLM-quant=FP8_BLOCK_SCALES-routing=Renormalize]
  - unittest/_torch/moe/test_moe_module.py::test_configurable_moe_single_gpu[e60_k4_h2048_i1408-seq=1-dtype=torch.bfloat16-backend=TRTLLM-quant=W4A8_NVFP4_FP8-routing=Renormalize]
  - unittest/_torch/moe/test_moe_module.py::test_configurable_moe_single_gpu[e60_k4_h2048_i1408-seq=1-dtype=torch.bfloat16-backend=TRTLLM-quant=W4A16_MXFP4-routing=Renormalize]
  # CUTEDSL backend: NVFP4
  - unittest/_torch/moe/test_moe_module.py::test_configurable_moe_single_gpu[e60_k4_h2048_i1408-seq=1-dtype=torch.bfloat16-backend=CUTEDSL-quant=NVFP4-routing=Renormalize]
  # DEEPGEMM backend: FP8_BLOCK_SCALES
  - unittest/_torch/moe/test_moe_module.py::test_configurable_moe_single_gpu[e60_k4_h2048_i1408-seq=1-dtype=torch.bfloat16-backend=DEEPGEMM-quant=FP8_BLOCK_SCALES-routing=Renormalize]
  # ---- end MoE tests ----
  - accuracy/test_llm_api_pytorch.py::TestLlama3_1_8B::test_nvfp4
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4[moe_backend=TRTLLM-mtp_nextn=0-fp8kv=True-attention_dp=False-cuda_graph=True-overlap_scheduler=True-torch_compile=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4[moe_backend=CUTLASS-mtp_nextn=2-fp8kv=True-attention_dp=False-cuda_graph=True-overlap_scheduler=True-torch_compile=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_chunked_prefill[quant_dtype=fp8-kv_cache_reuse=True-fp8kv=True-overlap_scheduler=True] # Cover nvbugs 6084445
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_bfloat16_flashinfer[enable_chunked_prefill=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_bfloat16_flashinfer[enable_chunked_prefill=True]
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
    wildcards:
      gpu:
      - '*gb110*'
      - '*b300*'
      linux_distribution_name: ubuntu*
      cpu: x86_64
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # ---- moved to post-merge (MoE CI optimization) ----
  - unittest/_torch/moe/test_moe_backend.py::test_moe_backend -k "CUTLASS"
  - unittest/_torch/moe/test_moe_backend.py::test_moe_backend -k "TRTLLM"
  - unittest/_torch/moe/test_moe_backend.py::test_moe_backend -k "CUTEDSL"
  - unittest/_torch/moe/test_moe_backend.py::test_moe_backend -k "DEEPGEMM"
