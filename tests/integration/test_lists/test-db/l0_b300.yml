version: 0.0.1
l0_b300:
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
    wildcards:
      gpu:
      - '*gb110*'
      - '*b300*'
      linux_distribution_name: ubuntu*
      cpu: x86_64
    terms:
      stage: pre_merge
      backend: pytorch
  tests:
  # ------------- DeepSeek-V4.1 model, Engram and DSpark ---------------
  - unittest/_torch/modeling/test_modeling_deepseekv41.py
  - unittest/_torch/modules/test_engram_decode_hash.py
  - unittest/_torch/modules/test_engram_history_uploads.py
  - unittest/_torch/modules/test_engram_replay.py
  - unittest/_torch/speculative/hw_agnostic/test_dspark_v41.py
  - unittest/_torch/modules/test_mhc.py::test_fused_hc_lagged_matches_eager_composition
  # Covers the GPU cases of tests/unittest/_torch/attention/ on B300, except the paths
  # ignored below; its cpu_only cases run on CPU (l0_cpu). kernels/ has no entry of its own
  # on any list, so apart from kernels/parallel_hw_agnostic/ this entry is what runs it
  # here. multi_gpu/ cases need >= 2 GPUs, so they skip here and run on multi-GPU stages:
  # l0_gb300_multi_gpus (post_merge) and l0_dgx_b300, which runs test_helix_zero_kv.py in
  # its pre_merge block and the rest in post_merge. Collecting them still runs their helix
  # files' import-time rebinding of mpi4py's serializer, which applies to the whole pytest
  # process.
  # - kernels/parallel_hw_agnostic/ is ignored: its cases do not depend on the GPU
  #   architecture, so its GPU cases run on H100 (l0_h100) and its cpu_only ones on CPU
  #   (l0_cpu). GB300 (l0_gb300_multi_gpus, post_merge) also runs the GPU cases; it is
  #   the only Blackwell stage that does.
  # - The other files ignored here have their own entries below.
  - unittest/_torch/attention --ignore=unittest/_torch/attention/sparse/dsa/test_cute_dsl_fp8_paged_mqa_logits.py --ignore=unittest/_torch/attention/sparse/dsa/test_cute_dsl_fp4_paged_mqa_logits.py --ignore=unittest/_torch/attention/sparse/test_cute_dsl_gvr_topk_decode.py --ignore=unittest/_torch/attention/sparse/test_cute_dsl_gvr_topk_tiers.py --ignore=unittest/_torch/attention/sparse/msa/test_minimax_m3_sparse_attn_decode.py --ignore=unittest/_torch/attention/sparse/msa/test_msa_proxy_split.py --ignore=unittest/_torch/attention/kernels/parallel_hw_agnostic TIMEOUT (90)
