  # Single-GPU Helix checks live directly under attention/; distributed suites
  # remain on the multi-GPU lists.
  - unittest/_torch/attention --ignore=unittest/_torch/attention/multi_gpu --ignore=unittest/_torch/attention/sparse --ignore=unittest/_torch/attention/kernels/parallel_hw_agnostic --ignore=unittest/_torch/attention/test_prims_ts_attention_backend.py
