version: 0.0.1
l0_b300:
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
    wildcards:
      gpu:
      - '*gb110*'
      - '*b300*'
      linux_distribution_name: ubuntu*
      cpu: x86_64
    terms:
      stage: pre_merge
      backend: pytorch
  tests:
  # ------------- DeepSeek-V4.1 model, Engram and DSpark ---------------
  - unittest/_torch/modeling/test_modeling_deepseekv41.py
  - unittest/_torch/modules/test_engram_decode_hash.py
  - unittest/_torch/modules/test_engram_history_uploads.py
  - unittest/_torch/modules/test_engram_replay.py
  - unittest/_torch/speculative/hw_agnostic/test_dspark_v41.py
  - unittest/_torch/modules/test_mhc.py::test_fused_hc_lagged_matches_eager_composition
  # Covers tests/unittest/_torch/attention/. Two sub-trees moved in here from elsewhere
  # under tests/unittest/_torch/ and have no entry of their own on any list, so this entry
  # is what picks them up:
  #   kernels/    fused attention kernels (ex thop/ and custom_ops/)
  #   multi_gpu/  helix tests -- each case spawns a 2-rank MPIPoolExecutor pinned to GPU 0/1
  #               by absolute index, and they gate on >= 2 GPUs plus Blackwell. They also
  #               rebind mpi4py's serializer at import time, which applies process-wide on
  #               every stage that collects them, including where the tests themselves skip.
  # The sparse/dsa/test_cute_dsl_* files ignored below keep their own entries (pre-existing).
  - unittest/_torch/attention --ignore=unittest/_torch/attention/sparse/dsa/test_cute_dsl_fp8_paged_mqa_logits.py --ignore=unittest/_torch/attention/sparse/dsa/test_cute_dsl_fp4_paged_mqa_logits.py --ignore=unittest/_torch/attention/sparse/test_cute_dsl_gvr_topk_decode.py --ignore=unittest/_torch/attention/sparse/test_cute_dsl_gvr_topk_tiers.py --ignore=unittest/_torch/attention/sparse/msa/test_minimax_m3_sparse_attn_decode.py --ignore=unittest/_torch/attention/sparse/msa/test_msa_proxy_split.py TIMEOUT (90)
  # Run cold-JIT MSA coverage separately from the attention aggregate.
  # Cold-JIT runs take about 25 minutes; allow a 45-minute budget.
  - unittest/_torch/attention/sparse/msa/test_minimax_m3_sparse_attn_decode.py TIMEOUT (45)
  - unittest/_torch/attention/sparse/msa/test_msa_proxy_split.py
  - unittest/_torch/attention/sparse/dsa/test_cute_dsl_fp8_paged_mqa_logits.py
  - unittest/_torch/attention/sparse/dsa/test_cute_dsl_fp4_paged_mqa_logits.py
  - unittest/_torch/attention/sparse/test_cute_dsl_gvr_topk_decode.py TIMEOUT (120)
  - unittest/_torch/attention/sparse/test_cute_dsl_gvr_topk_tiers.py
  - unittest/_torch/modeling/test_qsa_runtime_wiring.py
  - unittest/_torch/modeling/test_qwen4_exp_support.py
  - unittest/_torch/moe/kernels/parallel
  - unittest/_torch/kernels/parallel TIMEOUT (90)
  - unittest/_torch/visual_gen/kernels/parallel
  - unittest/_torch/visual_gen/test_attention_flashinfer.py
