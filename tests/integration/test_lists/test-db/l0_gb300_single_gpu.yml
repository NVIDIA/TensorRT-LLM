version: 0.0.1
l0_gb300_single_gpu:
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
    wildcards:
      gpu:
      - '*gb110*'
      - '*gb300*'
      linux_distribution_name: ubuntu*
      cpu: aarch64
    terms:
      stage: pre_merge
      backend: pytorch
  tests:
  # The sm_103 entries that need one GPU and nothing else. They sat on
  # l0_gb300.yml until it became clear what that costs: every GB300 stage is
  # declared with four GPUs, the multi-GPU dispatch is gated on the
  # 'ci: full pre-merge approved' label, and so a single-GPU test list was
  # waiting on an approval it has no reason to need. Nothing here is a
  # multi-rank test; the two that are live on l0_gb300_multi_gpus.yml.
  #
  # ModelingV2 catalog: the certification matrix for each op a modeling_v2 target
  # calls, plus the two consistency tests that guard the routing tables against
  # the targets they name. Deliberately NOT a duplicate of the upstream tests
  # for the same ops -- those cover the modules that wrap them, these cover the
  # op itself cell by cell -- which is why every file is named test_modeling_v2_*.
  # These entries are the receipts: the catalog's certification is per GPU
  # architecture, and this list is the sm_103 one. comm/ is excluded here and
  # carried by l0_gb300_multi_gpus.yml, since those two need 4 ranks.
  # TIMEOUT measured, not guessed: the whole entry is 348 cases in 5m34s on one
  # GB300. 30 gives five times that -- enough for a loaded node, short enough
  # that a hung case does not hold this stage for its full budget.
  - unittest/_torch/modeling_v2 --ignore=unittest/_torch/modeling_v2/comm TIMEOUT (30)
  # ModelingV2 whole-model gate. The op-level entry above certifies the
  # vocabulary; this certifies the assembly that calls it. tp1, so it belongs
  # here rather than beside the dep4 gates.
  - accuracy/test_modeling_v2_gpt_oss.py::TestModelingV2GptOss120bSm103Tp1::test_gsm8k
