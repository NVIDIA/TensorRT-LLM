version: 0.0.1
l0_gb300_multi_nodes_perf_sanity_ctx1_node1_gpu4_gen4_node2_gpu8:
- condition:
    ranges:
      # 1 ctx worker with 1 node and 4 GPUs
      # 4 gen workers each with 2 nodes and 8 GPUs
      system_gpu_count:
        gte: 36
        lte: 36
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # deepseek-v4-pro-fp4 8k1k con8 (single-user latency)
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-gen_only-gb300_deepseek-v4-pro-fp4_8k1k_con8_ctx1_dep4_gen4_tep8_eplb0_mtp3_ccb-NIXL] TIMEOUT (120)
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_deepseek-v4-pro-fp4_8k1k_con8_ctx1_dep4_gen4_tep8_eplb0_mtp3_ccb-NIXL] TIMEOUT (120)
  # Same workload as the e2e case above, run once, with per-request lifecycle
  # spans additionally uploaded as d_tb_<span>_<stat>. It sets
  # num_postprocess_workers: 0 to keep the breakdown intact, so its aggregate
  # throughput is deliberately NOT comparable to the e2e case -- it lands on its
  # own s_test_case_name series and its own baselines.
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-time_breakdown-gb300_deepseek-v4-pro-fp4_8k1k_con8_ctx1_dep4_gen4_tep8_eplb0_mtp3_ccb-NIXL] TIMEOUT (120)
