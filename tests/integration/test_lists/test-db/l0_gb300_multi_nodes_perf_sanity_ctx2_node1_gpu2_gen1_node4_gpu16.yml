version: 0.0.1
l0_gb300_multi_nodes_perf_sanity_ctx2_node1_gpu2_gen1_node4_gpu16:
- condition:
    ranges:
      # 2 ctx workers each with 1 node and 2 GPUs (each holds a whole node)
      # 1 gen worker with 4 nodes and 16 GPUs
      system_gpu_count:
        gte: 24
        lte: 24
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # deepseek-v4.1-flash-fp4 dspark agentx con1579 (the AgentX "middle" row), 1800 s
  # trace window. Measured 4109 s on GB300 (startup ~12 min, 1685 scenario
  # primers ~23 min, then the window).
  # e2e only, as for the DeepSeek-V4-Pro AgentX lanes: the gen_only fill gate
  # would need far more gen KV than 16x GB300 holds at this trace's ISL. The
  # ctx_only and gen_only_no_context lanes are in
  # l0_gb300_multi_gpus_perf_sanity and l0_gb300_multi_nodes_perf_sanity_gen1_node4_gpu16.
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_deepseek-v41-flash-fp4-dspark_agentx_con1579_ctx2_dep2_gen1_dep16_eplb0_dspark5_ccb-NIXL] TIMEOUT (90)
