version: 0.0.1
l0_dgx_b300_mpi_serve_multi_nodes:
- condition:
    ranges:
      system_gpu_count:
        gte: 16
        lte: 16
    wildcards:
      gpu:
      - '*gb110*'
      - '*b300*'
      linux_distribution_name: ubuntu*
      cpu: x86_64
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  - examples/serve/test_mpi_multinode.py::test_mpi_moe_serve_startup TIMEOUT (75)
