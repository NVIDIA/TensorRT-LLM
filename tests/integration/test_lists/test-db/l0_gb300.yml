version: 0.0.1
l0_gb300:
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 4
    wildcards:
      gpu:
      - '*gb110*'
      - '*gb300*'
      linux_distribution_name: ubuntu*
      cpu: aarch64
    terms:
      stage: pre_merge
      backend: pytorch
  tests:
  # MiniMax-M3 target unit tests.
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/activation
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/attention
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/embedding
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/gemm
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/moe
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/norm
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/spec
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/test_modeling_v2_m3_capture_boundary.py
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/test_modeling_v2_m3_dispatch.py
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/test_modeling_v2_m3_prebuild.py
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp4/test_modeling_v2_m3_rank_agreement.py
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/activation
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/attention
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/embedding
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/gemm
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/moe
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/norm
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/spec
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/test_modeling_v2_m3_capture_boundary.py
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/test_modeling_v2_m3_dispatch.py
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/test_modeling_v2_m3_prebuild.py
  - unittest/_torch/modeling_v2/models/minimax_m3/minimax_m3_nvfp4__sm_103__tp8/test_modeling_v2_m3_rank_agreement.py
  # ------------- PyTorch tests ---------------
  # MLA context head slices, including FP8 scale-block boundaries.
  - unittest/_torch/modules/test_linear_output_slice.py
  # ------------- DeepSeek-V4.1 model, Engram and DSpark ---------------
  - unittest/_torch/modeling/test_modeling_deepseekv41.py
  - unittest/_torch/modules/test_engram_decode_hash.py
  - unittest/_torch/modules/test_engram_history_uploads.py
  - unittest/_torch/modules/test_engram_replay.py
  - unittest/_torch/speculative/hw_agnostic/test_dspark_v41.py
  - unittest/_torch/modules/test_mhc.py::test_fused_hc_lagged_matches_eager_composition
  # CSA2 kernel, indexer, chunked prefill and prefix-cache parity on Grace Blackwell.
  - unittest/_torch/attention/sparse/csa2/test_kernel.py::test_packed_attention_parity
  - unittest/_torch/attention/sparse/csa2/test_kernel.py::test_native_fp8_staging_exact_bytes
  - unittest/_torch/attention/sparse/csa2/test_indexer.py::test_native_paged_owner_indexer_and_graph
  - unittest/_torch/attention/sparse/csa2/test_module.py::test_native_chunked_compression
  - unittest/_torch/attention/sparse/csa2/test_cache_manager.py::test_prefix_reuse_preserves_combined_records
  - unittest/_torch/attention/sparse/csa2/test_cache_manager.py::test_partial_page_copy_on_write_and_state
  - accuracy/test_llm_api_pytorch.py::TestQwen3_8B::test_w4a8_mxfp4[fp8-latency]
  - accuracy/test_llm_api_pytorch.py::TestGPTOSS::test_w4_1gpu[v1_kv_cache-True-True-cutlass-auto]
  - accuracy/test_llm_api_pytorch.py::TestGPTOSS::test_w4_1gpu[v2_kv_cache-True-True-cutlass-auto]
  - accuracy/test_llm_api_pytorch.py::TestQwen3_8B::test_fp8_block_scales[latency] # Cover nvbugs 5461712 and 5505402
  - accuracy/test_llm_api_pytorch.py::TestQwen3_8_Flash_Next::test_fp8_adp4_mtp3_trtllm_ple_offload
  - accuracy/test_llm_api_pytorch.py::TestQwen3_8_Flash_Next::test_nvfp4_adp4_mtp3_trtllm_ple_offload
  - accuracy/test_llm_api_pytorch.py::TestQwen3_8_Flash_Next::test_nvfp4_adp4_megamoe_cutedsl_ple_offload
  - accuracy/test_disaggregated_serving.py::TestQwen3_8_Flash_Next::test_fp8_nixl_python[prefix_cache]
  - unittest/_torch/moe/kernels/parallel
  - unittest/_torch/kernels/parallel TIMEOUT (90)
  # Kimi K3 KDA unit tests (single GPU, random weights, no checkpoint).
  - unittest/_torch/modules/kimi_kda/test_kda_flashinfer_prefill.py
  - unittest/_torch/modules/kimi_kda/test_kda_fused_prefill_conv.py
  - unittest/_torch/modules/kimi_kda/test_kda_cache_soundness.py
  - unittest/_torch/modules/kimi_kda/test_kda_prefill_state_parity.py
  - unittest/_torch/modules/kimi_kda/test_kimi_k3_mamba_metadata.py
  - unittest/_torch/modules/kimi_kda/test_kda_prefill_op.py
  - unittest/_torch/modules/kimi_kda/test_kda_decode_op.py
  - unittest/_torch/modules/kimi_kda/test_kimi_kda_decode_state_parity.py
  - unittest/_torch/modules/kimi_kda/test_kimi_kda_verify_parity.py
  - unittest/_torch/modules/kimi_kda/test_kda_mtp_decode_cute_parity.py
  - unittest/_torch/modules/kimi_kda/test_kimi_kda_fused_verify_parity.py
  - unittest/_torch/visual_gen/kernels/parallel
  # Qwen3.5 decode kernels: low-M warp-MMA GEMM, TRTLLM-gen NVFP4 MoE decode / route fronts, draft experts,
  # GDN fused target verify.
  - unittest/_torch/modules/test_low_m_mma_gemm.py
  - unittest/_torch/modules/mamba/test_gdn_kernel_optimizations.py
  - unittest/_torch/moe/test_moe_decode_front.py
  - unittest/_torch/moe/test_draft_experts_nvfp4.py
  - unittest/_torch/modules/test_embedding_lookup.py
  # GQA decode FMHA libraries (SM100 runs them with unittest/_torch/attention in l0_b200).
  - unittest/_torch/attention/test_gqa_decode_fmha.py
  # One-model speculative decoding: step copies, MXFP8 draft head, MTP fc input, steady prepare.
  - unittest/_torch/kernels/test_spec_step_copies.py
  - unittest/_torch/pyexecutor/engine/runners/decoder/test_inputs.py -k "test_spec_decode_graph_step_gather_kernel"
  - unittest/_torch/modules/test_mxfp8_draft_head.py
  - unittest/_torch/modules/test_q35_mtp_glue.py
  - unittest/_torch/pyexecutor/test_steady_spec_prepare.py
- condition:
    ranges:
      system_gpu_count:
        gte: 4
        lte: 4
    wildcards:
      gpu:
      - '*gb110*'
      - '*gb300*'
      linux_distribution_name: ubuntu*
      cpu: aarch64
    terms:
      stage: pre_merge
      backend: pytorch
  tests:
  # Synthetic weights cover Engram head/row shards and TP/EP shared-expert collectives.
  - unittest/_torch/multi_gpu/test_engram_sharding.py::test_engram_shard_roundtrip -k "world:4"
  - unittest/_torch/moe/test_deepseek_v41_shared_moe.py
  # Two-rank cases include uneven/empty attention-DP batches and bounded CSA2 replay.
  - unittest/_torch/multi_gpu/test_deepseek_v41_attention_dp.py::test_attention_dp_engram[world2-row-sharded]
  - unittest/_torch/multi_gpu/test_deepseek_v41_attention_dp.py::test_attention_dp_decoder_bounded_replay[world2]
  # NVFP4 DSpark accuracy and acceptance gates cover TP4 and attention-DP4.
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV41::test_gsm8k_dspark[nvfp4-tp4] TIMEOUT (120)
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV41::test_gsm8k_dspark[nvfp4-dp4] TIMEOUT (120)
  - accuracy/test_glm53_flash.py::TestGLM53FlashFP8::test_mtp[tp_size=4-ep_size=4] TIMEOUT (60)

