version: 0.0.1
l0_b200_visual_gen_multi_nodes:
- condition:
    ranges:
      # 2 nodes with each node has 8 GPUs.
      system_gpu_count:
        gte: 16
        lte: 16
    wildcards:
      gpu:
      - '*b200*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  - examples/visual_gen/test_visual_gen_multi_gpu.py::test_wan22_t2v_multinode_slurm_lpips_against_golden TIMEOUT (90)
