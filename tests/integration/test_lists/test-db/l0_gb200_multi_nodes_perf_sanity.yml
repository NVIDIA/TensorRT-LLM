# One top-level key per test list: a stage names its list (the key) in jenkins/L0_Test.groovy.
version: 0.0.1
l0_gb200_multi_nodes_perf_sanity_node4_gpu16:
- condition:
    ranges:
      # 4 nodes with each node has 4 GPUs
      system_gpu_count:
        gte: 16
        lte: 16
    wildcards:
      gpu:
      - '*gb200*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # aggr config
  # kimi-k3-mxfp4 modeling_v2 low-latency decode: TP16 attention, MoE TP4xEP4 + DSpark 7 drafts,
  # and MoE TP16xEP1 without speculation
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-kimi_k3_mxfp4_mv2_4_nodes_grace_blackwell-kimi_k3_tp16_moetp4ep4_dspark7_1k1k] TIMEOUT (35)
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-kimi_k3_mxfp4_mv2_4_nodes_grace_blackwell-kimi_k3_tp16_moetp16ep1_nospec_1k1k] TIMEOUT (40)
