  - perf/test_perf_sanity.py::test_e2e[aggr_upload-ctx_only-gb300_kimi-k3-fp4-dspark_agentx_con88_ctx16_dwdp16_gen1_helix16_bs32_dspark6_ccb-NIXL] TIMEOUT (90)
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-ctx_only-gb300_kimi-k3-fp4-dspark_agentx_con138_ctx16_dwdp16_gen3_helix8_bs16_dspark5_ccb-NIXL] TIMEOUT (95)
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-ctx_only-gb300_kimi-k3-fp4-dspark_agentx_con63_ctx16_dwdp16_gen3_helix16_bs4_dspark7_ccb-NIXL] TIMEOUT (90)
