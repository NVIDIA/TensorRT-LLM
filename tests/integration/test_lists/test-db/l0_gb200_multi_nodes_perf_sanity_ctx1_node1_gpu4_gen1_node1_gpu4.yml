version: 0.0.1
l0_gb200_multi_nodes_perf_sanity_ctx1_node1_gpu4_gen1_node1_gpu4:
- condition:
    ranges:
      # 1 ctx worker with 1 node and 4 GPUs
      # 1 gen worker with 1 node and 4 GPUs
      system_gpu_count:
        gte: 8
        lte: 8
    wildcards:
      gpu:
      - '*gb200*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # Nemotron-3-Ultra-550B-A55B disagg-E2E latency point (TEP4 bs1 mtp5, conc 1).
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb200_nemotron-ultra-v3-fp4_8k64k_con1_ctx1_dep4_gen1_tep4_eplb0_mtp5_ccb-NIXL] TIMEOUT (90)
  # Nemotron-3-Ultra-550B-A55B disagg gen-only latency point (TEP4 bs1 mtp5, conc 1).
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-gen_only-gb200_nemotron-ultra-v3-fp4_8k64k_con1_ctx1_dep4_gen1_tep4_eplb0_mtp5_ccb-NIXL] TIMEOUT (90)
