version: 0.0.1
l0_gb300_multi_nodes_perf_sanity_gen1_node2_gpu8_glm5:
- condition:
    ranges:
      # 0 ctx workers
      # 1 gen worker with 2 nodes and 8 GPUs
      system_gpu_count:
        gte: 8
        lte: 8
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # glm-5-fp4 8k1k con1
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gen_only_no_context-gb300_glm-5-fp4_8k1k_con1_ctx1_dep2_gen1_tep8_eplb0_mtp3_ccb-NIXL] TIMEOUT (45)
  # glm-5-fp4 8k1k con1024
  - perf/test_perf_sanity.py::test_e2e[aggr_upload-gen_only_no_context-gb300_glm-5-fp4_8k1k_con1024_ctx1_dep2_gen1_dep8_eplb256_mtp1_ccb-NIXL] TIMEOUT (30)
