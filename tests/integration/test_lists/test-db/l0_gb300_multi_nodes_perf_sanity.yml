# One top-level key per test list: a stage names its list (the key) in jenkins/L0_Test.groovy.
version: 0.0.1
l0_gb300_multi_nodes_perf_sanity_ctx12_node1_gpu4_gen1_node2_gpu8:
- condition:
    ranges:
      # 12 ctx workers each with 1 node and 4 GPUs
      # 1 gen worker with 2 nodes and 8 GPUs
      system_gpu_count:
        gte: 56
        lte: 56
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # deepseek-v4-pro-fp4 8k1k con4301 (max throughput)
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_deepseek-v4-pro-fp4_8k1k_con4301_ctx12_dep4_gen1_dep8_eplb384_mtp1_ccb-NIXL] TIMEOUT (50)
l0_gb300_multi_nodes_perf_sanity_ctx16_node4_gpu16_gen1_node2_gpu8:
- condition:
    ranges:
      # 16 single-GPU DWDP ctx workers packed on 4 nodes (16 GPUs)
      # 1 gen worker with 2 nodes and 8 GPUs
      system_gpu_count:
        gte: 24
        lte: 24
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # kimi-k3-fp4 dspark 160k1k con16: DWDP16 ctx fleet, helix CP8 gen worker
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_kimi-k3-fp4-dspark_160k1k_con16_ctx16_dwdp16_gen1_helix8_bs16_dspark5_ccb-NIXL] TIMEOUT (50)
l0_gb300_multi_nodes_perf_sanity_ctx16_node4_gpu16_gen1_node4_gpu16:
- condition:
    ranges:
      # 16 single-GPU DWDP ctx workers packed on 4 nodes (16 GPUs)
      # 1 gen worker with 4 nodes and 16 GPUs
      system_gpu_count:
        gte: 32
        lte: 32
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # kimi-k3-fp4 dspark 160k1k con32: DWDP16 ctx fleet, helix CP16 gen worker
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_kimi-k3-fp4-dspark_160k1k_con32_ctx16_dwdp16_gen1_helix16_bs32_dspark6_ccb-NIXL] TIMEOUT (50)
l0_gb300_multi_nodes_perf_sanity_ctx1_node1_gpu2_gen1_node1_gpu4:
- condition:
    ranges:
      # 1 ctx worker with 1 node and 2 GPUs
      # 1 gen worker with 1 node and 4 GPUs
      system_gpu_count:
        gte: 8
        lte: 8
    wildcards:
      gpu:
      - '*gb300*'
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # minimax-m3-fp4 eagle3 150k1k con1 and con64: TP2 ctx worker, TP4 gen worker
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_minimax-m3-fp4_150k1k_con1_ctx1_tp2_gen1_tp4_eplb0_eagle3_ccb-NIXL] TIMEOUT (45)
  - perf/test_perf_sanity.py::test_e2e[disagg_upload-e2e-gb300_minimax-m3-fp4_150k1k_con64_ctx1_tp2_gen1_tp4_eplb0_eagle3_ccb-NIXL] TIMEOUT (65)
