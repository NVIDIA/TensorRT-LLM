  ref_al: 1.942036
  min_al: 1.844935
# Read by the acceptance-length cases of TestModelingV2Qwen38FlashNextNvfp4Sm103Tp1
# (test_qwen4_exp.py). Keyed by target and variant for the same reason as the
# ModelingV2DeepseekR10528Nvfp4Sm10xDefault::mtp3 entry above, and one key per variant:
# TRTLLM_POPULATE_ACCEPTANCE_LENGTH=1 on one case must not overwrite another's floor.
#
# The checkpoint ships one MTP module (`mtp_num_hidden_layers: 1`), replayed max_draft_len
# times per step, so acceptance length lives in [1.0, 1 + max_draft_len]: 1.0 is a draft
# path that is rejected every time -- the exact failure a miscomputed MTP layer produces,
# with the text still correct and every accuracy gate green -- and 1 + max_draft_len is
# every draft accepted. Each min_al below is a hand-set collapse tripwire unless its
# comment says it is 95% of ref_al.

# test_mtp1_gsm8k_mmmu_and_video, over gsm8k
ModelingV2Qwen38FlashNextNvfp4Sm103Tp1::mtp1:
  # Smoke-scale, and labelled as such: measured on GB300 over the boot prompt
  # pair, STOCK 1.7403 against modeling_v2's 1.8063 on the same prompts. The
  # number below is the STOCK reading, so the gate is not self-referential.
  # There is no full-gsm8k STOCK reading yet; modeling_v2's own over full gsm8k
  # (1319 samples) is 1.971.
  ref_al: 1.7403
  # Hand-set as a collapse tripwire, NOT the automatic 95% of ref_al -- 1.65
  # would be a floor derived from a two-prompt smoke applied to a 1319-sample
  # benchmark, which is a flaky test rather than a gate. 1.5 is the midpoint of
  # the variant's whole range: a collapsed or miscomputed draft path scores 1.0,
  # and anything at or above 1.5 is accepting at least half its drafts.
  #
  # Replace both numbers with a full-gsm8k STOCK reading
  # (TRTLLM_POPULATE_ACCEPTANCE_LENGTH=1 on the stock leg) when one is
  # measured, and tighten min_al then.
  min_al: 1.5

