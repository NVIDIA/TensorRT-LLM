# Shared by both legs of TestModelingV2DeepseekR10528Nvfp4Sm10xDefault::
# test_mtp3_acceptance, at every layout it runs. Keyed by target and variant
# rather than by test function or layout, because that is what the number is a
# property of, and because the modeling_v2 and stock legs are read against the
# same minimum on purpose: modeling_v2 failing while stock passes means the
# draft path regressed; both failing means this anchor is stale. Populated
# from the STOCK leg -- taking it from the target's own number would make the
# gate self-referential.
ModelingV2DeepseekR10528Nvfp4Sm10xDefault::mtp3:
  ref_al: 3.020
  # Hand-set, not the automatic 95%. Measured at dep4 on GB300 over three runs each:
  # stock 3.020 / 2.998 / 3.009 / 3.014, modeling_v2 2.921 / 2.938 / 2.933. Each
  # side is stable to ~0.7%, and the two ranges do not overlap -- modeling_v2
  # runs about 2.6% under stock on this workload, consistently rather than as
  # noise. The automatic 95% floor (2.869) would therefore have left the
  # modeling_v2 leg 1.8% of headroom against a 0.7% spread: a flaky test, not a
  # gate. 2.5 is a collapse tripwire instead, the same role the
  # TestKimiK3DSpark entry above states -- a collapsed draft path scores ~1.0
  # and a subtly wrong one ~2.1, both far below this, while every accuracy
  # gate stays green. It leaves modeling_v2 17% of headroom and stock 20%.
  min_al: 2.5
