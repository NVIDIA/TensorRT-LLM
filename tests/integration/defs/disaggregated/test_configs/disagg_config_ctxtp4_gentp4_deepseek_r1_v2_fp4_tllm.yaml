model: DeepSeek-R1/DeepSeek-R1-0528-FP4-v2
hostname: localhost
backend: pytorch
context_servers:
  num_instances: 1
  tensor_parallel_size: 4
  pipeline_parallel_size: 1
  moe_expert_parallel_size: 4
  enable_attention_dp: true
  max_num_tokens: 16640
  max_seq_len: 8232
  max_batch_size: 128
  trust_remote_code: true
  enable_chunked_prefill: true
  kv_cache_config:
    enable_block_reuse: false
    free_gpu_memory_fraction: 0.8
    dtype: fp8
  moe_config:
    backend: TRTLLM
    # Chunk the MoE forward at half of max_num_tokens: the TRTLLM-Gen FP4
    # MoE workspace for a full 16640-token chunk is a 7-8 GiB transient,
    # which exceeds the headroom left after weights (~107.5 GiB/GPU) and the
    # KV pool on 192GB B200 and intermittently OOMs the ctx worker under
    # 512-concurrency 8k prefill load (memory estimation only observes
    # ~10.8 GiB dynamic peak, so the KV pool leaves no slack for it).
    max_num_tokens: 8320
  cuda_graph_config: null
  print_iter_log: true
  cache_transceiver_config:
    backend: NIXL
    transceiver_runtime: PYTHON
    max_tokens_in_buffer: 16384
generation_servers:
  num_instances: 1
  tensor_parallel_size: 4
  pipeline_parallel_size: 1
  moe_expert_parallel_size: 4
  enable_attention_dp: true
  max_num_tokens: 10240
  max_seq_len: 10240
  max_batch_size: 128
  trust_remote_code: true
  enable_chunked_prefill: true
  kv_cache_config:
    enable_block_reuse: false
    free_gpu_memory_fraction: 0.8
    dtype: fp8
  moe_config:
    backend: TRTLLM
  cuda_graph_config:
    enable_padding: true
    batch_sizes:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
    - 768
    - 1024
  print_iter_log: true
  cache_transceiver_config:
    backend: NIXL
    transceiver_runtime: PYTHON
    max_tokens_in_buffer: 16384
