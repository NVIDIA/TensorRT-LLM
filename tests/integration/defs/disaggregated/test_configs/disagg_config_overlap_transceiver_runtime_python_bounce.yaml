# Python transceiver with the C++ NIXL agent's shared bounce buffer on both workers.
# Relax the descriptor gates so short, head-matched TinyLlama transfers use bounce.
model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
hostname: localhost
port: 8000
backend: "pytorch"
cuda_graph_config: null
free_gpu_memory_fraction: 0.2
context_servers:
  num_instances: 1
  max_batch_size: 1
  max_num_tokens: 3000
  max_seq_len: 4096
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  kv_cache_config:
    free_gpu_memory_fraction: 0.2
    enable_partial_reuse: False
  disable_overlap_scheduler: True
  cache_transceiver_config:
    backend: NIXL
    transceiver_runtime: PYTHON
    kv_cache_bounce_size_mb: 128
    agent_bounce_buffer_enable: true
    agent_bounce_params:
      min_descriptor_count: "1"
      max_average_descriptor_size: "1MB"
  urls:
      - "localhost:8001"
generation_servers:
  num_instances: 1
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  max_batch_size: 256
  max_num_tokens: 4096
  max_seq_len: 4096
  kv_cache_config:
    free_gpu_memory_fraction: 0.2
    enable_partial_reuse: False
  disable_overlap_scheduler: False
  cache_transceiver_config:
    backend: NIXL
    transceiver_runtime: PYTHON
    kv_cache_bounce_size_mb: 128
    agent_bounce_buffer_enable: true
    agent_bounce_params:
      min_descriptor_count: "1"
      max_average_descriptor_size: "1MB"
  urls:
      - "localhost:8002"
