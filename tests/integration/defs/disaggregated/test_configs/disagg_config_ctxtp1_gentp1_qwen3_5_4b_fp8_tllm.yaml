model: Qwen3.5-4B-FP8
hostname: localhost
backend: pytorch
context_servers:
  num_instances: 1
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  enable_attention_dp: false
  max_num_tokens: 16640
  max_seq_len: 8232
  max_batch_size: 128
  enable_chunked_prefill: true
  disable_overlap_scheduler: true
  kv_cache_config:
    enable_block_reuse: false
    free_gpu_memory_fraction: 0.8
  cuda_graph_config: null
  print_iter_log: true
  cache_transceiver_config:
    backend: DEFAULT
    # DisaggTransferAdmissionController spends max_tokens_in_buffer /
    # tokens_per_block as an aggregate budget for concurrent generation KV
    # transfers, so an arena-sized value (~one sequence) admits ~2 of the 512
    # requests this test offers at 8K ISL and the rest die on the router's 180s
    # timeout. Sized to the batch declared above (max_batch_size * 8K ISL);
    # this model runs the Python transceiver, which allocates no such arena.
    max_tokens_in_buffer: 1048576
generation_servers:
  num_instances: 1
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  enable_attention_dp: false
  max_num_tokens: 10240
  max_seq_len: 10240
  max_batch_size: 128
  enable_chunked_prefill: true
  kv_cache_config:
    enable_block_reuse: false
    free_gpu_memory_fraction: 0.8
  cuda_graph_config:
    enable_padding: true
    batch_sizes:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
  print_iter_log: true
  cache_transceiver_config:
    backend: DEFAULT
    # Kept in step with the context server above: the generation side is the one
    # whose admission gate defers the transfers.
    max_tokens_in_buffer: 1048576
