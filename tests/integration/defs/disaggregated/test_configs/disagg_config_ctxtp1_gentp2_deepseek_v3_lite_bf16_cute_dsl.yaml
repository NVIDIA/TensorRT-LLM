hostname: localhost
model: DeepSeek-V3-Lite/bf16
free_gpu_memory_fraction: 0.1
backend: pytorch
cuda_graph_config: null
disable_overlap_scheduler: true
context_servers:
  num_instances: 1
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  cache_transceiver_config:
    backend: DEFAULT
# gen TP2 gives 16 attention heads per rank: the CuTe DSL MLA decode FMHA
# lib admits the bf16 path only for exactly 16 heads, so this is the
# smallest disagg layout on which the lib takes the decode forwards.
generation_servers:
  num_instances: 1
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  cache_transceiver_config:
    backend: DEFAULT
