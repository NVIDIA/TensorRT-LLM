hostname: localhost
model: Qwen3/Qwen3-8B
free_gpu_memory_fraction: 0.25
backend: pytorch
disable_overlap_scheduler: true
gather_generation_logits: true
context_servers:
  num_instances: 1
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  cache_transceiver_config:
    backend: DEFAULT
generation_servers:
  num_instances: 1
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  cache_transceiver_config:
    backend: DEFAULT
