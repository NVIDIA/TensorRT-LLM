hostname: localhost
model: NVIDIA-Nemotron-Nano-9B-v2
backend: pytorch
context_servers:
  num_instances: 1
  max_batch_size: 1
  max_num_tokens: 1024
  max_seq_len: 1024
  trust_remote_code: true
  kv_cache_config:
    enable_block_reuse: false
    use_kv_cache_manager_v2: false
    mamba_ssm_cache_dtype: float16
    free_gpu_memory_fraction: 0.2
  cache_transceiver_config:
    backend: NIXL
    transceiver_runtime: PYTHON
    max_tokens_in_buffer: 1024
generation_servers:
  num_instances: 1
  max_batch_size: 1
  max_num_tokens: 1024
  max_seq_len: 1024
  trust_remote_code: true
  kv_cache_config:
    enable_block_reuse: false
    use_kv_cache_manager_v2: false
    mamba_ssm_cache_dtype: float16
    free_gpu_memory_fraction: 0.2
  cache_transceiver_config:
    backend: NIXL
    transceiver_runtime: PYTHON
    max_tokens_in_buffer: 1024
