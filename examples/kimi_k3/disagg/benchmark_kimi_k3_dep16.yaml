# Kimi K3 disaggregated benchmark-harness config for
# examples/disaggregated/slurm/benchmark/submit.py, modeled on
# examples/wide_ep/slurm_scripts/kimi-k2-thinking.yaml with K3's
# constraints baked in (EP-only DEP16 on both sides, no chunked prefill,
# no KV block reuse, NIXL + Python V2 transceiver) plus the historically
# validated tokens_per_block 64.
# Fill in the <...> placeholders for your cluster before submitting.
#
# Usage (from the repository root):
#   python3 examples/disaggregated/slurm/benchmark/submit.py \
#       -c examples/kimi_k3/disagg/benchmark_kimi_k3_dep16.yaml [--dry-run]
#
# Gen-only baseline: set benchmark.mode to "gen_only_no_context"
# (submit.py then exports TRTLLM_DISAGG_BENCHMARK_GEN_ONLY=1).

slurm:
  script_file: "disaggr_torch.slurm"
  partition: "<partition>"
  account: "<account>"
  job_time: "02:00:00"
  job_name: "k3-disagg-dep16"
  extra_args: "--gpus-per-node=4"
  numa_bind: true  # GB200/GB300 NVL72

benchmark:
  mode: "e2e"  # e2e | gen_only | gen_only_no_context (gen-only baseline)
  use_nv_sa_benchmark: false
  multi_round: 4
  benchmark_ratio: 0.8
  streaming: true
  concurrency_list: "16"
  input_length: 8192
  output_length: 1024
  # Point at a benchmark dataset (e.g. one generated by
  # benchmarks/cpp/prepare_dataset.py) before submitting an e2e run.
  dataset_file: "<dataset_file>"
  # Benchmark client env: same in-container venv injection as the workers
  # (see the environment section notes).
  env_var:
    TRTLLM_PATH_PREPEND: "<trtllm_venv_bin_dir>"
    TRTLLM_PYTHONPATH_PREPEND: "<trtllm_repo>"

hardware:
  gpus_per_node: 4
  num_ctx_servers: 1
  num_gen_servers: 1

environment:
  # Mount the TRT-LLM checkout and the K3 checkpoint into the container.
  container_mount: "<container_mount>"  # Format: path1:path1,path2:path2
  container_image: "<container_image>"
  model_path: "<model_path>"
  # TRT-LLM comes from the checkout's in-place install (venv on PATH,
  # repo root on PYTHONPATH via worker/server env below); skip the
  # harness's pip install.
  trtllm_repo: ""
  build_wheel: false
  trtllm_wheel_path: ""
  work_dir: ""
  # Cluster notes:
  # - UCX transports: the default is no pin. start_worker.sh clears any
  #   container-provided UCX_TLS (UCX_TLS=tcp breaks V2 NIXL VRAM
  #   registration) and UCX then selects transports itself, RDMA/verbs
  #   included. Only on clusters where verbs transports cannot
  #   initialize on the compute nodes (symptom: UCX_TLS=all wedges
  #   native NIXL init asymmetrically, surviving ranks hang in the V2
  #   setup MPI collectives), add
  #   TRTLLM_WORKER_UCX_TLS=tcp,self,sm,cuda_copy,cuda_ipc to
  #   worker_env_var below; start_worker.sh re-exports it as UCX_TLS
  #   after the clear. Note that list excludes RDMA/verbs.
  # - pairs with the workers'
  #   kv_cache_bounce_size_mb (fabric-VMM bounce; measured
  #   ~455 GB/s/GPU). The default gate of 96 blocks would silently skip
  #   bounce for requests under 6144 tokens at tokens_per_block=64,
  #   falling back to ~0.4 GB/s host-staged tcp.
  # - pyxis/enroot reset image-defined PATH at container start, so the
  #   in-place venv is injected via TRTLLM_PATH_PREPEND /
  #   TRTLLM_PYTHONPATH_PREPEND, which the harness scripts apply inside
  #   the container (setting PATH= here would be silently dropped).
  worker_env_var: "TLLM_LOG_LEVEL=INFO TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_WORKER_DISABLE_GC=1 ENROOT_ALLOW_DEV=yes TRTLLM_PATH_PREPEND=<trtllm_venv_bin_dir> TRTLLM_PYTHONPATH_PREPEND=<trtllm_repo>"
  server_env_var: "TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_PATH_PREPEND=<trtllm_venv_bin_dir> TRTLLM_PYTHONPATH_PREPEND=<trtllm_repo>"

worker_config:
  # GEN: DEP16, no speculative decoding, CUDA graphs on (matches
  # examples/kimi_k3/disagg/gen_config_no_sa.yaml).
  gen:
    tensor_parallel_size: 16
    moe_expert_parallel_size: 16
    enable_attention_dp: true
    pipeline_parallel_size: 1
    disable_overlap_scheduler: true
    enable_chunked_prefill: false
    cuda_graph_config:
      max_batch_size: 32
    max_batch_size: 32
    max_num_tokens: 256
    max_seq_len: 9236
    print_iter_log: true
    kv_cache_config:
      enable_block_reuse: false   # mandatory for K3 (KDA state)
      tokens_per_block: 64        # historical: older TRTLLM-Gen MLA kernels required 64
      free_gpu_memory_fraction: 0.25
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON  # mandatory: C++ path throws for K3
      max_tokens_in_buffer: 8448
      # Fabric-VMM bounce: needed for cross-node V2 transfers on clusters
      # where inter-node cuda_ipc requires fabric allocations (else
      # ~0.4 GB/s host-staged tcp); measured ~455 GB/s/GPU with
      # (worker_env_var above).
      # 1024 fits one full request payload (433 MiB KDA state + ~27 KB/token
      # MLA latent = 649 MiB at 8k ISL); at 512 every 8k transfer falls back
      # to the per-fragment tcp path.
      kv_cache_bounce_size_mb: 1024
    trust_remote_code: true
  # CTX: matched DEP16 (see ../disagg/ctx_config.yaml for the sizing
  # rationale; hetero ctx/gen parallelism is not supported yet).
  ctx:
    tensor_parallel_size: 16
    moe_expert_parallel_size: 16
    enable_attention_dp: true
    pipeline_parallel_size: 1
    disable_overlap_scheduler: true   # mandatory for disagg ctx servers
    enable_chunked_prefill: false
    cuda_graph_config: null
    max_batch_size: 1
    max_num_tokens: 8448
    max_seq_len: 8212
    print_iter_log: true
    kv_cache_config:
      enable_block_reuse: false
      tokens_per_block: 64
      free_gpu_memory_fraction: 0.25
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      max_tokens_in_buffer: 8448
      # Must match the gen side; see the gen block's comment.
      kv_cache_bounce_size_mb: 1024
    trust_remote_code: true
