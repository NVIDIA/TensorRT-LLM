# Extra LLM-API options for Kimi K3, used by trtllm-eval via --config.
# DEP16 deployment: attention runs data-parallel and the experts shard
# across the expert-parallel group (assumes tp_size=16). CUDA graphs and
# the overlap scheduler are enabled: the generation-phase MLA latent-cache
# append derives its write positions from device tensors
# (attention_backend/utils.py), so it is CUDA-graph-safe. Remaining Kimi K3
# runtime constraints: no chunked prefill, no KV block reuse,
# tokens_per_block=64 (MLA (576,512) trtllm-gen generation kernel).
enable_attention_dp: true
moe_expert_parallel_size: 16
disable_overlap_scheduler: false
cuda_graph_config:
  enable_padding: true
  max_batch_size: 32
enable_chunked_prefill: false
kv_cache_config:
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.25
  tokens_per_block: 64
