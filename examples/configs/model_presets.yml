#
# Shared settings for the Core and Spark performance tests.
# Select a preset with -cfg:model_presets.yml@<name>. A source imports only the
# listed fields from a repository YAML. Local settings override imported fields.

# Short field names used by existing benchmark IDs.
field_aliases:
  block_size: speculative_config.block_size
  decoding_type: speculative_config.decoding_type
  max_draft_len: speculative_config.max_draft_len
  num_nextn_predict_layers: speculative_config.num_nextn_predict_layers
  periodic_snapshot_interval: kv_cache_config.mamba_state_config.periodic_snapshot_interval

presets:
  mtp3:
    settings:
      speculative_config:
        decoding_type: MTP
        max_draft_len: 3

  noreuse:
    settings:
      kv_cache_config:
        enable_block_reuse: false

  # Hybrid models reuse prefixes up to a recurrent-state snapshot.
  reuse:
    settings:
      kv_cache_config:
        enable_block_reuse: true
        mamba_state_config:
          periodic_snapshot_interval: 8192

  flash_next_tep4:
    settings:
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: true
        mamba_state_config:
          periodic_snapshot_interval: 256
      max_seq_len: 9216
      modeling_v2: require
      prefill_capture_num_tokens: [512, 1024, 2048, 4096, 8192]
      prefill_cuda_graph_backend: breakable
      cuda_graph_config:
        max_batch_size: 128

  gemma4_nvfp4:
    settings:
      enable_chunked_prefill: true
      kv_cache_config:
        dtype: fp8
        enable_partial_reuse: false
    on_sm:
      versions: [107, 121]
      settings:
        attn_backend: FLASHINFER

  glm52_fp4:
    settings:
      cuda_graph_config:
        enable_padding: true
        max_batch_size: 128
      enable_attention_dp: true
      enable_chunked_prefill: true
      max_seq_len: 10240
      moe_config:
        backend: CUTEDSL

  glm53_flash_bf16_kv:
    settings:
      cuda_graph_config:
        max_batch_size: 32
      disable_mm_encoder: true
      enable_chunked_prefill: true
      kv_cache_config:
        dtype: auto
        enable_block_reuse: true
        mamba_state_config:
          additional_snapshot_offsets_from_end: [0]
        tokens_per_block: 128
      max_seq_len: 16384
      modeling_v2: require
      speculative_config:
        decoding_type: MTP
        max_draft_len: 3

  glm53_flash_fp8:
    source: tests/scripts/perf-sanity/aggregated/gb300_glm53_flash_fp8_grace_blackwell.yaml
    section:
    - server_configs
    - glm53_flash_fp8_dep4_mtp3_fp8kv_maxseq16k_8k1k
    fields:
    - disable_mm_encoder
    - enable_chunked_prefill
    - cuda_graph_config.max_batch_size
    - kv_cache_config.enable_block_reuse
    - kv_cache_config.free_gpu_memory_fraction
    - max_seq_len
    - moe_config.backend

  glm53_flash_nvfp4:
    settings:
      cuda_graph_config:
        max_batch_size: 64
      disable_mm_encoder: true
      enable_chunked_prefill: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
      max_seq_len: 8192
      modeling_v2: require

  glm53_fp8:
    settings:
      enable_chunked_prefill: true
      kv_cache_config:
        enable_block_reuse: false
        dtype: fp8
      max_seq_len: 16384
      stream_interval: 10
      moe_config:
        backend: DEEPGEMM

  gpt_oss_eagle3:
    settings:
      enable_autotuner: false
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        speculative_model_dir: ${LLM_MODELS_ROOT}/gpt_oss/gpt-oss-120b-Eagle3

  gpt_oss_eagle3_throughput:
    settings:
      enable_autotuner: false
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        speculative_model_dir: ${LLM_MODELS_ROOT}/gpt_oss/gpt-oss-120b-Eagle3-throughput

  kimi_k3_dep8:
    settings:
      cuda_graph_config:
        max_batch_size: 8
      enable_attention_dp: true
      enable_chunked_prefill: true
      kv_cache_config:
        dtype: nvfp4
        enable_block_reuse: false
        tokens_per_block: 64
      max_seq_len: 8192
      moe_config:
        backend: CUTLASS
        max_num_tokens: 131072
        use_low_precision_moe_combine: true

  kimi_k3_streaming:
    settings:
      cuda_graph_config:
        enable_padding: false
        max_batch_size: 16
      enable_chunked_prefill: true
      kv_cache_config:
        enable_block_reuse: false
        tokens_per_block: 64
      max_seq_len: 9344
      stream_interval: 10

  lightning_mtp:
    source: tests/integration/defs/examples/serve/test_configs/Nemotron35_Lightning_30B.yml
    fields:
    - enable_chunked_prefill
    - num_postprocess_workers
    - stream_interval
    - kv_cache_config.mamba_state_config
    - kv_cache_config.free_gpu_memory_fraction
    - kv_cache_config.mamba_ssm_cache_dtype
    - kv_cache_config.mamba_ssm_philox_rounds
    - kv_cache_config.mamba_ssm_stochastic_rounding
    - speculative_config.decoding_type
    - speculative_config.max_draft_len

  m31_dspark7:
    source: examples/configs/curated/minimax-m3.1-flash-throughput.yaml
    fields: [speculative_config]
    settings:
      speculative_config:
        speculative_model: ${LLM_MODELS_ROOT}/MiniMax-M3.1-Flash/dspark

  m3_fp4_bench:
    settings:
      kv_cache_config:
        dtype: fp8
      moe_config:
        backend: CUTLASS
      sparse_attention_config:
        implementation: msa
      max_seq_len: 2560

  minimax_m3:
    source: examples/configs/curated/minimax-m3-throughput.yaml
    fields: [sparse_attention_config, kv_cache_config.enable_block_reuse]

  minimax_m31_flash:
    source: examples/configs/curated/minimax-m3.1-flash-throughput.yaml
    fields: [sparse_attention_config, modeling_v2, kv_cache_config.dtype]
    settings:
      cuda_graph_config:
        max_batch_size: 64
      kv_cache_config:
        enable_block_reuse: false
      max_seq_len: 16384

  minimax_m3_fp4:
    source: examples/configs/curated/minimax-m3-throughput.yaml
    fields:
    - enable_attention_dp
    - kv_cache_config.enable_block_reuse
    - sparse_attention_config
    settings:
      kv_cache_config:
        dtype: fp8
        free_gpu_memory_fraction: 0.6
      max_seq_len: 4096
      moe_config:
        backend: CUTLASS
      sparse_attention_config:
        implementation: msa

  musespark_text:
    settings:
      disable_mm_encoder: true
      trust_remote_code: false
      guided_decoding_backend: null

  nano_omni:
    source: tests/integration/defs/examples/serve/test_configs/Nemotron3_Nano_Omni_30B_NVFP4.yml
    fields:
    - cuda_graph_config.max_batch_size
    - enable_chunked_prefill
    - kv_cache_config.free_gpu_memory_fraction
    - kv_cache_config.mamba_ssm_cache_dtype
    settings:
      moe_config:
        backend: CUTLASS

  qwen36_fp4_streaming:
    settings:
      enable_chunked_prefill: true
      moe_config:
        backend: CUTEDSL
      num_postprocess_workers: 4
      nvfp4_gemm_config:
        allowed_backends: [marlin, cutlass, cublaslt, cuda_core]
      stream_interval: 10

  qwen38_max_mtp:
    source: examples/configs/curated/qwen3.8-low-latency-mtp3.yaml
    fields:
    - kv_cache_config.mamba_ssm_cache_dtype
    - moe_config.backend
    - speculative_config
    settings:
      cuda_graph_config:
        max_batch_size: 32
      max_seq_len: 8192

  qwen3_235b_eagle3:
    settings:
      enable_autotuner: false
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        speculative_model_dir: ${LLM_MODELS_ROOT}/Qwen3/qwen3-235B-eagle3

  # Core 4-GPU throughput overrides for nemotron-3-super-throughput.yaml.
  super:
    settings:
      enable_chunked_prefill: true
      kv_cache_config:
        mamba_ssm_cache_dtype: float16
        mamba_ssm_philox_rounds: 5
        mamba_ssm_stochastic_rounding: true
      max_seq_len: 1048576
      moe_config:
        backend: CUTLASS
      num_postprocess_workers: 0

  super_mamba:
    source: tests/integration/defs/examples/serve/test_configs/Nemotron3_Super_120B_NVFP4.yml
    fields:
    - enable_chunked_prefill
    - kv_cache_config.mamba_ssm_cache_dtype
    - kv_cache_config.mamba_ssm_philox_rounds
    - kv_cache_config.mamba_ssm_stochastic_rounding
    settings:
      moe_config:
        backend: CUTLASS

  super_streaming:
    source: tests/integration/defs/examples/serve/test_configs/Nemotron3_Super_120B_NVFP4.yml
    fields:
    - enable_chunked_prefill
    - cuda_graph_config.max_batch_size
    - kv_cache_config.mamba_ssm_cache_dtype
    - kv_cache_config.mamba_ssm_philox_rounds
    - kv_cache_config.mamba_ssm_stochastic_rounding
    settings:
      max_seq_len: 1048576
      moe_config:
        backend: CUTLASS

  v41_dspark5:
    source: tests/scripts/perf-sanity/aggregated/gb300_deepseek_v41_flash_nvfp4_grace_blackwell.yaml
    section: [server_configs, v41_flash_nvfp4_dep4_dspark5_8k1k]
    fields:
    - speculative_config.decoding_type
    - speculative_config.max_draft_len
    - speculative_config.block_size

  v41_flash_dep4:
    source: tests/scripts/perf-sanity/aggregated/gb300_deepseek_v41_flash_nvfp4_grace_blackwell.yaml
    section: [server_configs, v41_flash_nvfp4_dep4_dspark5_8k1k]
    fields:
    - allreduce_strategy
    - custom_tokenizer
    - enable_attention_dp
    - enable_chunked_prefill
    - max_seq_len
    - kv_cache_config.dtype
    - kv_cache_config.enable_block_reuse
    - moe_config
    - sparse_attention_config
    settings:
      cuda_graph_config:
        batch_sizes: [1, 2, 4, 8, 16, 32]
      enable_iter_perf_stats: true
      gpus_per_node: 4
      kv_cache_config:
        enable_swa_scratch_reuse: false
        max_tokens: 262144

  v4_pro_dspark:
    settings:
      custom_tokenizer: deepseek_v4
      disable_overlap_scheduler: true
      enable_attention_dp: true
      enable_chunked_prefill: false
      kv_cache_config:
        enable_block_reuse: false
      max_seq_len: 10240
      speculative_config:
        speculative_model: ${LLM_MODELS_ROOT}/DeepSeek-V4-Pro-DSpark
        decoding_type: DSpark
        max_draft_len: 5

  v4_pro_dspark3:
    source: tests/scripts/perf-sanity/disaggregated/gb300_deepseek-v4-pro-dspark_agentx_con1156_ctx2_dep8_gen1_dep8_eplb0_dspark3_ccb-NIXL.yaml
    section: [worker_config, gen]
    fields:
    - custom_tokenizer
    - enable_attention_dp
    - enable_lm_head_tp_in_adp
    - kv_cache_config.dtype
    - kv_cache_config.enable_block_reuse
    - moe_config.use_low_precision_moe_combine
    - speculative_config
    settings:
      disable_overlap_scheduler: true
      enable_chunked_prefill: false
      max_seq_len: 10240
      speculative_config:
        speculative_model: ${LLM_MODELS_ROOT}/DeepSeek-V4-Pro-nvfp4-DSpark
