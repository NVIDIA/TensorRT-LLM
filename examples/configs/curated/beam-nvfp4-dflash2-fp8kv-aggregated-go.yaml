# Beam NVFP4 target with the DFlash2 drafter and explicitly scaled FP8 target/draft KV caches,
# aggregated serving on one node of four GB300 GPUs, with native decode CUDA graphs and the
# overlap scheduler enabled. Every other setting equals beam-nvfp4-dflash2-fp8kv-aggregated.yaml,
# the eager recipe (graphs and overlap off), which stays the fallback. Steps, inputs, limits and
# requests: docs/source/deployment-guide/deployment-guide-for-beam-on-trtllm.md
#
#   export TRTLLM_SKIP_KV_CACHE_ESTIMATION=1
#   export TRTLLM_MODELING_V2_KV_CACHE_SCALES=<KV_SCALES>
#   trtllm-serve <TARGET_CHECKPOINT> --config beam-nvfp4-dflash2-fp8kv-aggregated-go.yaml \
#     --chat_template <TARGET_CHECKPOINT>/chat_template.jinja
#
# Captured: generation-only steps (target verification of the eight rows per request, DFlash2
# drafting and the TP all-reduces) at every batch size up to max_batch_size, padded to the next
# listed size. Steps that contain a context (prefill) request run eagerly. Replace
# <DRAFTER_CHECKPOINT> below with the DFlash2 drafter directory. Settings equal to today's
# defaults are pinned so that a changed default cannot change the recipe.
modeling_v2: require
checkpoint_format: beam_nvfp4
custom_tokenizer: tensorrt_llm._torch.models.checkpoints.beam.tokenizer.BeamFastTokenizer
reasoning_parser: beam_harmony_text
tensor_parallel_size: 4
pipeline_parallel_size: 1
moe_tensor_parallel_size: 4
moe_expert_parallel_size: 1
enable_attention_dp: false
attn_backend: TRTLLM
disable_overlap_scheduler: false
enable_chunked_prefill: false
cuda_graph_config:
  batch_sizes: [1, 2, 4, 8, 16, 32, 64]
  enable_padding: true
max_batch_size: 64
max_seq_len: 69632
max_num_tokens: 8192
kv_cache_config:
  enable_block_reuse: true
  enable_partial_reuse: false
  use_kv_cache_manager_v2: true
  max_tokens: 4456448
  dtype: fp8
speculative_config:
  decoding_type: DFlash
  max_draft_len: 7
  speculative_model: <DRAFTER_CHECKPOINT>
  attention_backend: TRTLLM
