# DEP8 decode worker (attention DP, EP8) with MTP6 that donates host memory to the
# remote KV cache level of the prefill workers over NIXL and admits requests first
# come, first served. Pair with qwen3.5-gb300-agentx-dep8-prefill.yaml.
cache_transceiver_config:
  agent_bounce_params:
    max_average_descriptor_size: 64KB
  backend: NIXL
  kv_cache_bounce_size_mb: 2048
  kv_transfer_sender_future_timeout_ms: 20
  kv_transfer_timeout_ms: 600000
  transceiver_runtime: PYTHON
cuda_graph_config:
  enable_padding: true
  batch_sizes:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 24
  - 32
  - 36
  - 40
  - 44
  - 48
disable_mm_encoder: true
enable_attention_dp: true
enable_iter_perf_stats: true
enable_iter_req_stats: false
enable_lm_head_tp_in_adp: true
iter_perf_stats_interval: 40
kv_cache_config:
  avg_seq_len: 102150
  dtype: fp8
  enable_block_reuse: false
  event_buffer_max_size: 0
  free_gpu_memory_fraction: 0.85
  host_cache_size: 0
  iteration_stats_interval: 40
  remote_cache_config:
    directory: ${KV_RENDEZVOUS_DIR}
    transport:
      kind: nixl
    donor:
      size: 188978561024
  tokens_per_block: 64
  use_kv_cache_manager_v2: true
max_seq_len: 262148
moe_config:
  backend: CUTEDSL
  use_low_precision_moe_combine: true
nvfp4_gemm_config:
  allowed_backends:
  - cutlass
  - cublaslt
  - cutedsl
  - cuda_core
pipeline_parallel_size: 1
print_iter_log: true
replicate_embedding: true
return_perf_metrics: false
scheduler_config:
  capacity_scheduler_policy: GUARANTEED_NO_EVICT
speculative_config:
  decoding_type: MTP
  max_draft_len: 6
stream_interval: 20
trust_remote_code: true
max_batch_size: 48
max_num_tokens: 336
moe_expert_parallel_size: 8
tensor_parallel_size: 8
