# TEP2 prefill worker with MTP1 that claims a remote KV cache level over the NIXL
# transport. Pair with qwen3.5-gb300-agentx-dep8-decode.yaml.
allreduce_strategy: TWOSHOT
attention_dp_config:
  kv_cache_routing_conversation_affinity: true
cache_transceiver_config:
  agent_bounce_params:
    max_average_descriptor_size: 64KB
  backend: NIXL
  kv_cache_bounce_size_mb: 2048
  kv_transfer_sender_future_timeout_ms: 20
  kv_transfer_timeout_ms: 600000
  transceiver_runtime: PYTHON
cuda_graph_config: null
disable_mm_encoder: true
disable_overlap_scheduler: false
enable_attention_dp: false
enable_chunked_prefill: true
enable_iter_perf_stats: true
enable_iter_req_stats: false
iter_perf_stats_interval: 40
kv_cache_config:
  block_reuse_config:
    enable_branch_snapshot: true
    max_num_turns: 3
    policy: per_conversation
  dtype: fp8
  enable_block_reuse: true
  event_buffer_max_size: 0
  free_gpu_memory_fraction: 0.8
  host_cache_size: 180388626432
  iteration_stats_interval: 40
  mamba_state_config:
    additional_snapshot_offsets_from_end:
    - 2
    periodic_snapshot_interval: 0
  pool_ratio:
  - 0.2
  - 0.8
  remote_cache_config:
    directory: ${KV_RENDEZVOUS_DIR}
    transport:
      kind: nixl
    level:
      size: 171798691840
      expected:
        num_donors: 8
        claim_size: 1391569403904
  tokens_per_block: 64
  use_kv_cache_manager_v2: true
max_batch_size: 64
max_num_tokens: 16384
max_seq_len: 262144
moe_config:
  backend: CUTEDSL
nvfp4_gemm_config:
  allowed_backends:
  - cutlass
  - cublaslt
  - cutedsl
  - cuda_core
pipeline_parallel_size: 1
prefill_capture_num_tokens:
- 1
- 2
- 4
- 8
- 16
- 32
- 64
- 128
- 256
- 384
- 512
- 768
- 1024
- 1536
- 2048
- 2560
- 3072
- 3584
- 4096
- 4608
- 5120
- 5632
- 6144
- 6656
- 7168
- 7680
- 8192
- 10240
- 12288
- 14336
- 16384
prefill_cuda_graph_backend: breakable
print_iter_log: true
return_perf_metrics: false
scheduler_config:
  capacity_scheduler_policy: MAX_UTILIZATION
  context_scheduling_policy: shortest_uncached_first
speculative_config:
  decoding_type: MTP
  max_draft_len: 1
trust_remote_code: true
moe_expert_parallel_size: 2
tensor_parallel_size: 2
