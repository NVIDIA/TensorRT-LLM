# Mappings used to refresh recipes from the latest validated benchmark data.
#
# Adding a model or GPU:
# 1. Add one mapping for each source model, accelerator, and precision combination.
# 2. Set source to the names recorded by the benchmark service.
# 3. Set target to the public model, architecture, GPU, config directory, and filename template.
# 4. If log-based config recovery is supported, set artifact_log to the exact tokens
#    present in that workload's benchmark log filenames. framework_token identifies
#    the serving framework token (for example, trt); it is not a version or commit.
#
# Removing a model or GPU:
# - Delete every mapping for that public model/GPU combination. To stop updating a
#   model entirely, delete all mappings whose target.model names that model.
# - Removing a mapping stops future refreshes. It does not delete existing recipe
#   files or lookup.yaml entries from the repository.
#
# A mapping enables discovery of all available GPU-count and ISL/OSL groups for that
# source. Concurrency and latency/balanced/throughput recipes are selected from each
# group's Pareto frontier; they are not listed individually in this file.
version: 1
mappings:
  - source:
      model: deepseek-r1
      accelerator: NVIDIA B200
      precision: FP4
    artifact_log:
      model_token: dsr1
      precision_token: fp4
      accelerator_token: b200
      framework_token: trt
      disaggregated: false
    target:
      model: nvidia/DeepSeek-R1-0528-FP4-v2
      arch: DeepseekV3ForCausalLM
      gpu: B200_NVL
      config_dir: examples/configs/database/nvidia/DeepSeek-R1-0528-FP4-v2/B200
      filename_template: "{isl_short}{osl_short}_tp{num_gpus}_conc{concurrency}{profile_suffix}.yaml"
  - source:
      model: deepseek-r1
      accelerator: NVIDIA B200
      precision: FP8
    artifact_log:
      model_token: dsr1
      precision_token: fp8
      accelerator_token: b200
      framework_token: trt
      disaggregated: false
    target:
      model: deepseek-ai/DeepSeek-R1-0528
      arch: DeepseekV3ForCausalLM
      gpu: B200_NVL
      config_dir: examples/configs/database/deepseek-ai/DeepSeek-R1-0528/B200
      filename_template: "{isl_short}{osl_short}_tp{num_gpus}_conc{concurrency}{profile_suffix}.yaml"
  - source:
      model: deepseek-r1
      accelerator: NVIDIA H200
      precision: FP8
    artifact_log:
      model_token: dsr1
      precision_token: fp8
      accelerator_token: h200
      framework_token: trt
      disaggregated: false
    target:
      model: deepseek-ai/DeepSeek-R1-0528
      arch: DeepseekV3ForCausalLM
      gpu: H200_SXM
      config_dir: examples/configs/database/deepseek-ai/DeepSeek-R1-0528/H200
      filename_template: "{isl_short}{osl_short}_tp{num_gpus}_conc{concurrency}{profile_suffix}.yaml"
  - source:
      model: gpt-oss-120b
      accelerator: NVIDIA B200
      precision: FP4
    artifact_log:
      model_token: gptoss
      precision_token: fp4
      accelerator_token: b200
      framework_token: trt
      disaggregated: false
    target:
      model: openai/gpt-oss-120b
      arch: GptOssForCausalLM
      gpu: B200_NVL
      config_dir: examples/configs/database/openai/gpt-oss-120b/B200
      filename_template: "{isl_short}{osl_short}_tp{num_gpus}_conc{concurrency}{profile_suffix}.yaml"
  - source:
      model: gpt-oss-120b
      accelerator: NVIDIA H200
      precision: FP4
    artifact_log:
      model_token: gptoss
      precision_token: fp4
      accelerator_token: h200
      framework_token: trt
      disaggregated: false
    target:
      model: openai/gpt-oss-120b
      arch: GptOssForCausalLM
      gpu: H200_SXM
      config_dir: examples/configs/database/openai/gpt-oss-120b/H200
      filename_template: "{isl_short}{osl_short}_tp{num_gpus}_conc{concurrency}{profile_suffix}.yaml"
