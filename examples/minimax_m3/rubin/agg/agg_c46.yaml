#
# MiniMax-M3 aggregated TP2 serving on Rubin (SM107), 46 concurrent agentic
# conversations: at most 14 requests per engine, a
# 32-iteration batch wait and a 355 GiB per-rank host KV tier. Use with
# agg_env.sh (README.md).
tensor_parallel_size: 2
pipeline_parallel_size: 1
moe_expert_parallel_size: 1
enable_attention_dp: false
max_batch_size: 14
max_num_tokens: 16384
max_seq_len: 1048576
enable_chunked_prefill: true
disable_overlap_scheduler: false
cuda_graph_config:
  batch_sizes: [1, 2, 3, 4, 6, 8, 12, 14]
  enable_padding: true
kv_cache_config:
  dtype: nvfp4
  tokens_per_block: 128
  use_kv_cache_manager_v2: true
  enable_block_reuse: true
  block_reuse_config: {policy: per_conversation}
  host_cache_size: 381178347520
  disk_cache_size: 0
  free_gpu_memory_fraction: 0.97
  avg_seq_len: 220000
moe_config: {backend: TRTLLM, use_low_precision_moe_combine: true}
allreduce_strategy: AUTO
scheduler_config: {capacity_scheduler_policy: MAX_UTILIZATION}
sparse_attention_config: {algorithm: minimax_m3, implementation: msa, indexer_kv_dtype: fp8, sparse_disable_index_value: true,
  fuse_qkv_index_projection: true}
speculative_config: {speculative_model: /path/to/minimax-m3-eagle3, decoding_type: Eagle3, max_draft_len: 3,
  advanced_sampling_mode: no_topk}
stream_interval: 20
reasoning_parser: minimax_m3
trust_remote_code: true
num_postprocess_workers: 4
enable_autotuner: true
enable_tokenization_cache: true
print_iter_log: true
enable_iter_perf_stats: true
return_perf_metrics: false
prefill_cuda_graph_backend: breakable
prefill_capture_num_tokens: [32, 64, 128, 256, 512, 768, 1024, 1536, 2048, 3072, 4096]
modeling_v2: require
batch_wait_timeout_iters: 32
batch_wait_max_tokens_ratio: 1.0
