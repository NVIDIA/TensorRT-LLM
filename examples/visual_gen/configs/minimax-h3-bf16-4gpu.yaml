# 4-GPU BF16 MiniMax-H3 VisualGen configuration using pure Ulysses sequence
# parallelism. The checkpoint path is supplied by examples/visual_gen/models/
# minimax_h3.py through --model.
cuda_graph_config:
  enable: false

attention_config:
  backend: VANILLA

parallel_config:
  ulysses_size: 4

compilation_config:
  skip_warmup: false
  resolutions:
    - [544, 960]
  num_frames:
    - 124
