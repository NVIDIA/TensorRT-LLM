# 1-GPU FLUX.3 Klein / Klein Base with BFL's pre-quantized FP8 rowwise transformer weights
# (variants/fp8r); the text encoder and VAE stay in their BF16 / FP32 precision.
# Shared by offline examples (--visual_gen_args) and trtllm-serve.
# Warmup covers text-to-image and a single-reference edit, each at the 80- and 160-token prompt
# windows, at each resolution.
pipeline_config:
  variant: fp8r
attention_config:
  backend: VANILLA
parallel_config:
  cfg_size: 1
  ulysses_size: 1
cuda_graph_config:
  enable: false
compilation_config:
  resolutions: [[1024, 1024]]
