# 1-GPU BF16 FastH3 VisualGen configuration. FastH3 is a distilled
# MiniMax-H3 checkpoint; this config uses the dense MiniMax-H3 attention path.
cuda_graph_config:
  enable: false

attention_config:
  backend: VANILLA

compilation_config:
  skip_warmup: false
  resolutions:
    - [768, 1344]
  num_frames:
    - 124
