# 1-GPU FLUX.3 BF16/FP8/NVFP4 image benchmark with startup warmup for both image modes.
parallel_config:
  tp_size: 1
attention_config:
  backend: VANILLA
cuda_graph_config:
  enable: false
compilation_config:
  resolutions: [[1024, 1024], [2048, 2048]]
  num_frames: [1]
  modes: [t2i, i2i]
