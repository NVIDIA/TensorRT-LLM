cuda_graph_config:
  enable: false
torch_compile_config:
  enable: false
attention_config:
  backend: TRTLLM
  sparse_attention_config:
    algorithm: vsa
    vsa_sparsity: 0.9
compilation_config:
  skip_warmup: true
  resolutions:
    - [768, 1344]
  num_frames:
    - 124
