# 2-GPU MiniMax-H3 video+audio with online FP8 quantization of the transformer.
#
# On one 96 GB card the transformer and the ~62 GB Qwen3-VL conditioner cannot
# be resident together, so the conditioner is swapped host<->device around the
# single encode call of every request, which costs ~40 s per request. Given a
# second card the conditioner simply lives there (conditioner_device: cuda:1)
# and the swap disappears; the only cross-card traffic is one copy of the
# prompt embeddings per request.
#
# FP8 rather than NVFP4 because per-tensor FP8 measures ~28.5 dB GEMM SNR
# against bf16 versus ~17.5 dB for NVFP4, and the freed memory is no longer
# needed to make the conditioner fit.
#
# Card 0: transformer (FP8, ~19 GB quantized + ~24 GB unquantized AdaLN
#         projections) + video VAE (~10 GB) + audio VAE (~0.6 GB)
# Card 1: Qwen3-VL conditioner (~62 GB, bf16)
quant_config:
  quant_algo: FP8
  dynamic: true
pipeline_config:
  conditioner_offload: never
  conditioner_device: cuda:1
torch_compile_config:
  # The FP8 Triton scalar-promotion fix is tracked separately; keep this
  # shipped config runnable until that fix is present in the base branch.
  enable: false
cuda_graph_config:
  enable: false
