# 2-GPU MiniMax-H3 video+audio with online 128x128 block-scaled FP8 weights.
#
# Card 0: transformer and VAEs. Card 1: Qwen3-VL conditioner.
# SM120 uses UE8M0 activation/weight scale layout for the block-scaled GEMM.
quant_config:
  quant_algo: FP8_BLOCK_SCALES
  dynamic: true
pipeline_config:
  conditioner_offload: never
  conditioner_device: cuda:1
torch_compile_config:
  # The FP8 Triton scalar-promotion fix is tracked separately; keep this
  # shipped config runnable until that fix is present in the base branch.
  enable: false
cuda_graph_config:
  enable: false
