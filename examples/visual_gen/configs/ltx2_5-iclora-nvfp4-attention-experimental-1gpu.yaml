# EXPERIMENTAL: functional inference is separate from BF16-golden quality qualification.
# Use the BF16 config for qualified correctness. See README.ltx2_5.md for measured limitations.
attention_config:
  backend: FLASHINFER
  quant_attention_config:
    qk_dtype: nvfp4
    v_dtype: fp8
quant_config:
  quant_algo: NVFP4
  dynamic: true
  group_size: 16
cuda_graph_config:
  enable: false
torch_compile_config:
  enable: false
pipeline_config:
  text_encoder_path: /models/LTX-2.5/text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors
  video_vae_path: /models/LTX-2.5/vae/ltx-2.5-video-vae-conv-bf16.safetensors
  audio_vae_path: /models/LTX-2.5/vae/ltx-2.5-audio-vae-bf16.safetensors
  spatial_upsampler_path: /models/LTX-2.5/latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors
  iclora_path: /models/LTX-2.5/loras/ltx-2.3-22b-ic-lora-union-control-ref0.5.safetensors
  iclora_scale: 1.0
