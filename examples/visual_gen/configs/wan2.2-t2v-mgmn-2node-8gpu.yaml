# 8-rank Wan 2.2 T2V config for 2-node MGMN launcher runs (2 nodes x 4 GPUs), e.g.
#   srun --mpi=pmix -N 2 --ntasks-per-node=4 ... trtllm-llmapi-launch \
#     trtllm-serve <model> --enable_visual_gen --visual_gen_args <this file>
# parallel_config yields n_workers = cfg_size * ulysses_size = 8; the MPI
# world size must match. FA4 attention targets Blackwell-class GPUs.
# Shared by offline examples (--visual_gen_args) and trtllm-serve.
attention_config:
  backend: FA4
parallel_config:
  cfg_size: 2
  ulysses_size: 4
compilation_config:
  skip_warmup: true
torch_compile_config:
  enable: false
