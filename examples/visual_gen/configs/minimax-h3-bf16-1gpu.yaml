# 1-GPU BF16 MiniMax-H3 VisualGen configuration.
# The checkpoint path is supplied by examples/visual_gen/models/minimax_h3.py
# through --model or MINIMAX_H3_CHECKPOINT. This file intentionally contains
# only VisualGenArgs fields so it can be consumed by VisualGenArgs.from_yaml.
#
cuda_graph_config:
  enable: false

attention_config:
  backend: VANILLA

compilation_config:
  skip_warmup: true
  resolutions:
    - [768, 1344]
  num_frames:
    - 124
