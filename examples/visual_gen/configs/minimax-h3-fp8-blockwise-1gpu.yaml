# Supply the checkpoint with --model. Small media projections stay in FP32.
# Audio exceeded the regression bound in the 50-step B200 comparison.
# See docs/source/models/visual-generation.md, MiniMax-H3 Notes; BF16 is recommended
# until audio acceptance is established for the intended request profile.
quant_config:
  quant_algo: FP8_BLOCK_SCALES
  dynamic: true

cuda_graph_config:
  enable: false

attention_config:
  backend: VANILLA

compilation_config:
  skip_warmup: false
  resolutions:
    - [512, 512]
  num_frames:
    - 124
