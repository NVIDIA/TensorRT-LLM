# Supply the checkpoint with --model. Small media projections stay in FP32.
# Experimental: audio quality acceptance is still pending.
quant_config:
  quant_algo: FP8_BLOCK_SCALES
  dynamic: true

cuda_graph_config:
  enable: false

attention_config:
  backend: VANILLA

compilation_config:
  skip_warmup: false
  resolutions:
    - [512, 512]
  num_frames:
    - 124
