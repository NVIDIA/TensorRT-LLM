# 1-GPU LTX-2.3 Retake with a dynamically quantized NVFP4 transformer and
# FlashInfer NVFP4 self-attention on Blackwell GPUs.
pipeline_config:
  workflow: retake
  # Use a resident FP8 linear transformer at the two quality-sensitive steps.
  retake_fp8_linear_steps: [4, 7]
quant_config:
  quant_algo: NVFP4
  dynamic: true
attention_config:
  backend: FLASHINFER
  quant_attention_config:
    qk_dtype: nvfp4
    v_dtype: nvfp4
parallel_config:
  cfg_size: 1
  ulysses_size: 1
cuda_graph_config:
  enable: false
