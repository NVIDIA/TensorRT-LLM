# 1-GPU LTX-2.3 retake with dynamic NVFP4 transformer quantization at every step
# and FlashInfer NVFP4 Q/K + FP8 V video self-attention on SM100/SM103 GPUs.
pipeline_config:
  workflow: retake
quant_config:
  quant_algo: NVFP4
  dynamic: true
attention_config:
  backend: FLASHINFER
  quant_attention_config:
    qk_dtype: nvfp4
    v_dtype: fp8
parallel_config:
  cfg_size: 1
  ulysses_size: 1
cuda_graph_config:
  enable: true
