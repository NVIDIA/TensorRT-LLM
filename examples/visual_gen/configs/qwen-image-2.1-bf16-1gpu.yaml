# 1-GPU Qwen-Image 2.1 BF16 baseline VisualGenArgs config.
# Shared by offline examples (--visual_gen_args) and trtllm-serve.
# Model: Qwen/Qwen-Image-2.1. The pipeline defaults to 40 denoising steps;
# generation parameters are supplied separately from VisualGenArgs.
# VANILLA is required by the current model-specific attention implementation.
attention_config:
  backend: VANILLA
parallel_config:
  cfg_size: 1
  ulysses_size: 1
cuda_graph_config:
  enable: false
torch_compile_config:
  enable: false
