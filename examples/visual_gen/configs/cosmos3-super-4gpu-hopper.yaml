# 4-GPU Hopper (H200) deployment with tensor parallel + Ulysses + parallel VAE.
# Models: nvidia/Cosmos3-Super and nvidia/Cosmos3-Super-Image2Video-4Step
# Shared by offline examples (--visual_gen_args) and trtllm-serve.
#
# Unlike the Blackwell default in cosmos3-super-4gpu.yaml, TP shards model
# weights to reduce per-GPU memory use for Super's 720p x 189-frame workload.
# GPU layout: tp_size=2 (weight shards) x ulysses_size=2 (sequence split).
# trtllm-serve spawns the 4 workers itself — do not wrap it in torchrun/mpirun.
attention_config:
  backend: VANILLA
parallel_config:
  cfg_size: 1
  tp_size: 2
  ulysses_size: 2
  parallel_vae_size: 4
