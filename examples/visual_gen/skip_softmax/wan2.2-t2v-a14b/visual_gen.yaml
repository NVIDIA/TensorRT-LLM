# Wan 2.2 T2V-A14B with NVFP4 GEMMs, SAGE attention, and Skip Softmax Attention.
quant_config:
  quant_algo: NVFP4
  dynamic: true

attention_config:
  backend: TRTLLM
  quant_attention_config:
    qk_dtype: int8
    v_dtype: fp8
    q_block_size: 1
    k_block_size: 16
    v_block_size: 1
  sparse_attention_config:
    algorithm: skip_softmax
    target_sparsity: 0.65
    disabled_until_timestep: 0.86

compilation_config:
  skip_warmup: true

torch_compile_config:
  enable: true
  enable_autotune: false

cuda_graph_config:
  enable: false

parallel_config:
  cfg_size: 1
  ulysses_size: 1
