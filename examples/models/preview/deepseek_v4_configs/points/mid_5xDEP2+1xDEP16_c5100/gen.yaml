cache_transceiver_config:
  backend: NIXL
  kv_transfer_timeout_ms: 600000
  transceiver_runtime: PYTHON
cuda_graph_config:
  batch_sizes:
  - 1
  - 2
  - 4
  - 8
  - 12
  - 16
  - 20
  - 24
  - 28
  - 32
  - 36
  - 40
  - 44
  - 48
  - 52
  - 56
  - 60
  - 64
  enable_padding: true
custom_tokenizer: deepseek_v41
disable_mm_encoder: true
enable_attention_dp: true
enable_client_io_during_gpu_wait: true
enable_iter_perf_stats: true
enable_lm_head_tp_in_adp: true
gen_prompt_tail_tokens: 8192
internal_request_auth_key: <AUTH_KEY>
iter_perf_stats_interval: 400
kv_cache_config:
  avg_seq_len: 160000
  dtype: fp8
  enable_block_reuse: false
  event_buffer_max_size: 0
  free_gpu_memory_fraction: 0.6
  host_cache_size: 0
  tokens_per_block: 128
max_batch_size: 64
max_num_tokens: 256
max_seq_len: 996595
moe_config:
  backend: MEGAMOE_CUTEDSL
  load_balancer:
    layer_updates_per_iter: 0
    num_slots: 384
    warmup_placement:
      count_every_steps: 4
      decay: 0.5
      interval_steps: 4000
      max_migrations: 100000
      max_moved_fraction: 0.1
      min_gain: 0.01
      min_pos: 2
      min_rows: 1048576
      planner: lpt
      start_step: 0
  megamoe_fuse_shared_expert: true
  use_low_precision_moe_combine: true
moe_expert_parallel_size: 16
num_postprocess_workers: 4
num_serve_frontends: 4
pipeline_parallel_size: 1
print_iter_log: true
scheduler_config:
  max_gen_init_admissions_per_pass: 1
sparse_attention_config:
  algorithm: csa2
  enable_heuristic_topk: true
speculative_config:
  block_size: 3
  decoding_type: DSpark
  max_draft_len: 3
  moe_backend: MEGAMOE_CUTEDSL
  speculative_model: <MODEL_PATH>
stream_interval: 40
tensor_parallel_size: 16
