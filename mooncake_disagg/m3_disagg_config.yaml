# Router for the M3 mooncake-store validation. Worker LLM args come from each
# worker's own --config file, not from here.
#
# 1 ctx + 1 gen at TP=4 fits 8 GPUs. To demonstrate cross-instance reuse
# without restarting anything, raise context_servers.num_instances to 2 and
# add a second URL (needs 12 GPUs at TP=4).

hostname: localhost
port: 8000
backend: "pytorch"

context_servers:
  num_instances: 1
  urls:
      - "localhost:8001"

generation_servers:
  num_instances: 1
  urls:
      - "localhost:8002"
