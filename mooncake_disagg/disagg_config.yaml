# Router. Only needs to know where the workers are; each worker's own LLM
# args come from its --config file (ctx_config.yaml / gen_config.yaml).
#
#   trtllm-serve disaggregated -c ./disagg_config.yaml

hostname: localhost
port: 8000
backend: "pytorch"

context_servers:
  num_instances: 1
  urls:
      - "localhost:8001"

generation_servers:
  num_instances: 1
  urls:
      - "localhost:8002"
