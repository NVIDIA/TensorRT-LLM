# Context (prefill) worker: reads AND writes the Mooncake store.
#
#   export MOONCAKE_CONFIG_PATH=/abs/path/to/mooncake.json
#   CUDA_VISIBLE_DEVICES=0 trtllm-serve <model> \
#     --host localhost --port 8001 --server_role CONTEXT \
#     --config ./ctx_config.yaml

kv_cache_config:
  # The connector describes its pools through register_kv_cache_layout,
  # which only KVCacheManagerV2 implements.
  use_kv_cache_manager_v2: true
  # Local reuse still runs first; the store serves whatever the device missed.
  enable_block_reuse: true
  # GPU-only tiers are required: a page evicted to host or disk has its GPU
  # slot reassigned, which would invalidate the addresses registered with
  # the store.
  host_cache_size: 0
  disk_cache_size: 0
  free_gpu_memory_fraction: 0.2

cache_transceiver_config:
  # Requiring KVCacheManagerV2 for the connector forces the Python
  # transceiver: the C++ one is bound to the V1 BaseKVCacheManager and
  # raises on a V2 manager. NIXL is the only backend the Python
  # transceiver supports.
  backend: "NIXL"
  transceiver_runtime: "PYTHON"

kv_connector_config:
  connector: mooncake-store
