# Example brief for the perf-optimize workflow. Copy this file to
# `task.yaml`, fill in your paths and knobs, then run:
#
#     perf-optimize \
#         --task path/to/your/task.yaml \
#         --workspace workspace/perf-optimize/<model-name>
#
# Required paths. Without `cluster_ssh`, both belong to the machine running
# the CLI. With `cluster_ssh`, the checkpoint is remote but the TRT-LLM
# checkout remains local.
#
# NOTE: perf-optimize MUTATES the TRT-LLM checkout — it must be a git
# repo with a clean worktree; work happens on a dedicated
# perf-optimize/<workspace>-<timestamp> branch (one commit per accepted
# optimization). In local execution, code changes require an editable
# install; in remote execution, agents sync the changed source into each job.

checkpoint_path:  /path/to/checkpoints/<ModelName>-<Variant>  # remote when using SSH
trtllm_repo_path: /path/to/TensorRT-LLM                       # always local
# Optional: the starting server tuning. It seeds the workspace's live
# tuning config (tuning/extra_llm_api_options.yaml), which the optimizer
# then evolves; this path is always local. Omit to start from an empty ({})
# config.
# extra_llm_api_options: /path/to/extra_llm_api_options.yaml

# Optional: the benchmark operating point(s) driven by
# benchmark_serving.py. Every measurement in the campaign (baseline,
# evaluator, final verification) replays the same point(s).
benchmark:
  dataset_name: random       # random | sharegpt | hf | sonnet | burstgpt
  random_input_len: 1024     # ISL
  random_output_len: 128     # OSL
  num_prompts: 200
  concurrency: 64
  # concurrency: [8, 32, 128]  # list => Pareto-curve mode: every measurement
  #                            # runs once per point (over one server launch)
  #                            # and the evaluator applies the Pareto gate —
  #                            # mean per-point gain must pass the thresholds
  #                            # AND no point may regress beyond the noise
  #                            # floor. Benchmark cost multiplies by the point
  #                            # count; keep the list short (~3-5 points).
  # num_prompts: [32, 128, 512]  # curve mode only: per-point num_prompts,
  #                            # paired index-by-index with the concurrency
  #                            # list (each entry >= its point). Keeps
  #                            # low-concurrency points cheap instead of
  #                            # replaying the full prompt count at every
  #                            # point; a scalar means the same count
  #                            # everywhere.
  # request_rate: inf        # requests/sec; "inf" sends all at once
  # dataset_path: /path/to/ShareGPT.json   # for sharegpt / hf datasets

# Optional: which profilers the Analyzer runs each round, and the
# steady-state iteration window that gates them (TLLM_PROFILE_START_STOP
# for nsys; ncu arms on the same window via --profile-from-start
# off). The nsys timeline is decomposed with the
# internal-perf-nsight-system-analysis skill (per-iteration time, busy/idle rungs,
# compute-absent causes); ncu is the bounded per-kernel deep dive on the
# top nsys kernels, interpreted with the perf-nsight-compute-analysis
# skill. A round profiles
# after an accept or a reverted code attempt that may have changed ignored
# build output; otherwise the next one re-plans from current evidence. Drop
# ncu to trim what profiling rounds cost.
profile:
  methods: [nsys, ncu]
  nsys_iter_range: "100-150"
  # Which ranks nsys captures. Default [0] — the historical single-wrap
  # behaviour, and all a bare `trtllm-serve` can give: at world size > 1 it
  # creates its workers with MPI.COMM_SELF.Spawn and nsys does not follow
  # spawned processes. Several ranks need one wrap per rank inside the
  # launcher (the Slurm `trtllm-llmapi-launch` shape), and buy the skill's
  # rank-jitter step: mean jitter wait per iteration, the busy spread, the
  # imbalance operator, and the pinned-vs-rotating straggler verdict — the
  # only evidence that says the job waits on a slow rank rather than on the
  # network. Wrap only the ranks you list: a rank slowed by its own profiler
  # shows up as jitter the others wait on. One representative per part of
  # the parallelism is enough; capturing all 8 costs 8 exports.
  # profile_ranks: [0, 4]
  # Optional: the per-kernel coverage contract. When present (an empty
  # mapping enables the defaults shown), the analyzer's ncu dive covers
  # EVERY kernel at/above min_share_pct of GPU time (extending down the
  # kern_sum until coverage_target_pct is reached, over bounded capture
  # passes), and each profiling round writes a schema-validated
  # kernel_ledger.yaml answering four questions per kernel — can it be
  # eliminated? can it be made faster? can it be fused with its
  # neighbors? can it be overlapped with independent work on another
  # stream? — each with a roadmap item or an evidence-backed dismissal.
  # They are ordered by how much they presuppose: elimination assumes
  # only that the kernel runs today (and recovers its whole share, not a
  # fraction), faster/fusion assume the work is necessary AND that the
  # kernel runs alone, overlap drops the alone assumption. The
  # ledger also records the window's gpu_busy_pct, which converts every
  # kernel's share of GPU time into the share of WALL CLOCK the noise
  # floor actually judges. The orchestrator aborts the round on an
  # incomplete ledger (a replan-only round runs no ncu and is waived),
  # so the campaign cannot end with a kernel whose
  # elimination/optimization/fusion/overlap possibility was never
  # considered. Costs
  # extra profiling time per round that profiles; requires nsys+ncu in
  # methods.
  # kernel_coverage:
  #   min_share_pct: 0.5         # every kernel >= this share gets a row
  #   coverage_target_pct: 95    # rows must cover >= this much GPU time

# Optional: the optimization-loop knobs (defaults shown).
# optimize:
#   max_rounds: 5               # the loop RUNS this many rounds (each: an
#                               # analyzer turn, then up to
#                               # max_items_per_round items) — it only stops
#                               # early when an analyzer turn finds nothing
#                               # actionable or target_improvement_pct is met.
#                               # Only rounds with stale/unproven runtime
#                               # evidence pay for a profile, so this bounds
#                               # items attempted far more tightly than GPU hours
#   max_items_per_round: 3      # maximum roadmap items selected per round
#   item_execution: parallel    # parallel: isolated workers then Integrator;
#                               # serial: one worker at a time, accepted directly
#   max_attempts_per_item: 3    # total optimizer attempts per item: evaluator
#                               # PUSH_BACK verdicts retry up to this bound (an
#                               # explicit REJECT fails the item immediately)
#   approaches: [config, code]  # allowed optimization approaches: config edits
#                               # the live tuning YAML, code edits the TRT-LLM
#                               # source. [code] forbids knob tuning (code-only
#                               # campaign; needs an editable install); [config]
#                               # leaves the checkout untouched. Disallowed
#                               # attempts are auto-rejected before evaluation.
#   accept_fraction: 0.5        # measured gain must reach this fraction of
#                               # the item's expected_gain_pct ...
#   noise_floor_pct: 1.0        # ... and at least this much outright
#   focus_concurrencies: [32, 128]  # curve mode only, optional: the subset of
#                               # benchmark.concurrency the gate SCORES — every
#                               # curve→scalar mean (gate mean, ledger values,
#                               # measured_gain_pct) uses only these points, so
#                               # wins in the regime the product cares about are
#                               # not diluted by the other points. Every point is
#                               # still measured and none may regress beyond the
#                               # noise floor. Omit to score all points.
#   max_regression_pct: 8.0     # curve mode only, optional: an owner-DECLARED
#                               # per-point regression budget for the no-regress
#                               # condition — a point may regress up to this %
#                               # when a large mean win justifies it (e.g. a
#                               # saturated top point paying for gains everywhere
#                               # else). Must be >= noise_floor_pct. Omit for the
#                               # strict default (no point may regress beyond the
#                               # noise floor). Accepted items that use the budget
#                               # are called out point-by-point in the report.
#   target_metric: output_throughput   # result-JSON key gains are computed on:
#                               # output_throughput | total_token_throughput |
#                               # request_throughput | mean/median/p99_{ttft,tpot,itl,e2el}_ms
#   target_improvement_pct: 15.0   # optional early stop: the loop concludes once
#                                  # the roadmap ledger's cumulative improvement
#                                  # reaches this

# Optional: accuracy verification the final-verification QA pass runs
# once, at campaign end, against the live server (omit the whole block
# to skip accuracy checks entirely).
# accuracy:
#   command: "trtllm-eval --model <checkpoint> ..."   # run verbatim
#   baseline_score: 0.62        # reference score to compare against
#   max_drop_pct: 1.0           # allowed relative drop vs baseline_score

# Optional: include this section only when the servers + benchmarks must
# run through Slurm (otherwise everything runs locally on the current
# node). `cluster_ssh` makes only the Slurm jobs remote; source editing,
# Git, workflow state, and retained artifacts stay local. The run root is
# optional and defaults to ~/agent_flow_workspace/<workspace-name> remotely.
# slurm-environment:
#   slurm_partition: <partition>
#   docker_image: /remote/path/to/trtllm-pytorch-<version>.sqsh
#   cluster_ssh: user@login-host       # enables remote execution
#   remote_run_root: /remote/path/to/perf-optimize/my-campaign

# Optional: the one-shot analytical SOL-projection stage between the
# baseline benchmark and round 1 (benchmarker -> projector ->
# optimization rounds -> qa -> reporter) runs **by default**, so this
# section only has to be written to turn it off or to hand the skill a
# hint. The projector follows the internal-perf-sol-analysis skill
# (trtllm-agent-toolkit) for the speed-of-light ceiling and writes
# sol_projection.md; the Analyzer weighs it when ranking roadmap items
# (and sanity-bounding their expected gains) and the report gains a
# "Projection vs Measured" headroom-captured section. Every field is
# optional: `enabled` gates the stage (default true) and `gpu` is the
# part-name hint for the skill's peaks calculator when the automatic
# mapping would guess wrong.
# The skill is internal, so open-source builds of the toolkit strip it.
# Without it the stage still completes: the projector falls back to the
# perf-analysis skill, grounds the peaks from named sources instead of
# the calculator, writes no peaks file, and the analyzer skips the
# per-round measured-vs-SOL correlation. Set `enabled: false` to skip
# the stage's wall-clock outright in an environment that has no toolkit.
# sol:
#   enabled: false   # skip the projector entirely
#   gpu: H100

# Optional: optimize a DISAGGREGATED deployment (context workers + generation
# workers + router). `config` is the harness config consumed by
# <trtllm_repo_path>/examples/disaggregated/slurm/benchmark/submit.py — the
# workflow drives that harness instead of launching trtllm-serve itself.
# That file owns the measurement conditions: `benchmark` fields you omit here
# are filled from it, and any you set that disagree with it are an error.
# Two of its conventions are easy to trip on: `concurrency` is the harness'
# `concurrency_list` x `num_gen_servers` (what the client is actually driven
# at), and `num_prompts` is `concurrency` x `multi_round`.
# Profiling is nsys-only, the topology (worker counts, per-role parallel sizes)
# is frozen for the campaign, and `extra_llm_api_options` cannot be combined
# with this: the live tuning config is seeded from the harness config's
# `worker_config` (its ctx / gen role configs), which is what the optimizer
# then evolves.
# disagg:
#   config: /path/to/disagg/config.yaml

# Optional: optimize ONE HALF of a disaggregated deployment in isolation — a
# SOL track. Mutually exclusive with `disagg` above: that measures the whole
# cluster end-to-end, this measures one role, over the same tuning knobs.
#
# The campaign drives `ibc-bench`, the CLI the harness repo ships as its only
# supported agent-facing interface. Everything about *how* a measurement
# happens — submitting, re-measuring rather than skipping, naming a run,
# recording which image and config produced it — belongs to that tool. This
# block only says which sweep, which half, and which workspace.
#
#   track      ctx | gen. `ctx` is prefill-only aggregate (trtllm-bench at
#              output_length 1 — no disaggregation at all), scored on
#              `avg_request_throughput_req_s`. `gen` is a 1-ctx-1-gen
#              deployment read only on the generation worker's decode
#              iterations, scored on `throughput_per_user`.
#   sweep      the harness sweep yaml. Paths inside it resolve relative to
#              itself, and the harness imports the model's
#              `gen_worker_config.py` from beside it — so the unit is the
#              DIRECTORY, not the file. It is copied into `<workspace>/sweep/`
#              at startup and the campaign measures the copy; the original is
#              never rewritten by the per-attempt tuning overlay.
#   ctx_json   OPTIONAL, and what it decides is which QUESTION the campaign can
#              answer — not whether it can be scored. A gen campaign is scored
#              anchor-free, from the `gen_only_perf.csv` that
#              `ibc_trtllm_harness.process_data.get_gen_only_perf` writes:
#              `throughput_per_user = accept_rate / avg_iteration_time`, which
#              has no context term at all. Naming a ctx.json additionally buys
#              the rate-matched end-to-end view. WITHOUT it,
#              `output_tput_per_gpu`, the ctx:gen ratio and the frontier
#              elasticity are ABSENT — not zero, not unchanged — and nothing
#              the campaign reports says what a gain is worth end to end.
#   workspace  the harness workspace name. It fixes one workload on one
#              cluster; a new image, build or tuning overlay is not a change.
#
# `accept_rate` lives in the SWEEP, at its TOP LEVEL (`accept_rate: {rate,
# source}`, where the harness has read it since v0.4.7) — and it is required
# only when the sweep actually has `mtp > 0` cases. At mtp 0 the acceptance
# length is 1.0 by definition, so requiring one would ask for a measurement of
# a constant; the harness's own post-processor draws the line in the same
# place. Where it IS required, it is because the length multiplies the metric
# linearly and a wrong one is invisible.
#
# `benchmark` fields you omit are filled from the sweep's own plan — the same
# expansion that will run — and any you set that disagree are an error. Note
# that a sweep row's concurrency is per generation server, so
# `benchmark.concurrency` is `concurrency x gen_num`, while the row keeps the
# listed value. Profiling is nsys-only. `optimize.target_metric` defaults to
# the track's. Leave `optimize.max_regression_pct` unset and every point can
# veto an attempt, which is the gate a frozen-point campaign wants.
#
# The optimizer edits `<workspace>/tuning/extra_llm_api_options.yaml`, which is
# a PARTIAL overlay deep-merged onto the worker config the sweep row generates
# — so the row keeps the topology and the optimizer only carries what it tunes.
# sol_track:
#   track: gen
#   sweep: /path/to/campaign/sweep.yaml
#   workspace: dsv4pro-8k1k-gen
#   # ctx_json: /path/to/a/measured/ctx.json   # omit for an anchor-free gen
#   #                                          # campaign; see above for what
#   #                                          # that makes ABSENT
