#
# trtllm-modeling-v2 task specification. Unknown keys are refused, with the nearest known one.
# Validate without a GPU: trtllm-modeling-v2 --task task.yaml --workspace <ws> --dry-run
#
# 1) The smallest form: one host, one deployment (what `intake derive` writes).
#
# checkpoint_path: <checkpoint-dir>
# trtllm_repo_path: <trtllm-repo-dir>
# arch: sm_103                              # sm_100 is B200, sm_103 is GB300
# accuracy: {model_key: <org/model>}        # leave out to onboard on the boot alone
# environment:
#   python: <venv-dir>/bin/python
#   env: {TMPDIR: /var/tmp/mv2}             # writable, 61 characters at most
# agents:
#   defaults: {backend: claude-code, model: <agent-model-id>}
# deployments:
#   - {name: tp1, options: engines/tp1.yaml}
#
# 2) The full form: a multi-node site, two benchmarks, a KV dtype judged against the
#    first deployment, and a disaggregated deployment.

checkpoint_path: <checkpoint-dir>
trtllm_repo_path: <trtllm-repo-dir>
arch: sm_103
# target: {family: <family_name>, checkpoint_segment: <target_name>}   # derived when unsaid

accuracy:
  model_key: <org/model>                    # the reference row's key; defaults for every benchmark

environment:
  python: <venv-dir>/bin/python
  launch: "<one-gpu-prefix>"                # the site's prefix of one-GPU commands
  # gpu_memory_gib: 288                     # lets a dry run warn of a first deployment too narrow
  env:
    TMPDIR: /var/tmp/mv2
    CLAUDE_CODE_TMPDIR: /var/tmp/mv2

agents:
  defaults:
    backend: claude-code                    # claude-code or codex
    model: <agent-model-id>
    reasoning_effort: high
  # roles:
  #   assembler: {model: <stronger-model-id>}

notes: |
  The architecture in a few lines, and prior art in the tree.

deployments:
  # The first deployment is core: its boot and benchmarks define `onboarded`. It stays first.
  # `options` is a YAML path beside the spec (`options: engines/dep8.yaml`) or a mapping.
  - name: dep8
    options:
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      enable_attention_dp: true
      max_seq_len: 8192
      max_batch_size: 8
    launch: "<two-node-8-rank-prefix>"      # allocation and container only
    stop: "<site-step-cleanup>"             # ends what launch started; gets $MV2FLOW_SERVER=dep8
    inputs: [text, image]
    timeout: 5400
    benchmarks:
      - name: gsm8k                         # anchor: the reference row of <org/model>
      - name: aa_lcr                        # no reference row: declare the anchor
        anchor: 0.62
        unit: fraction                      # percent (the default) or fraction
        source: "<where and how 0.62 was measured>"
        samples: 100
        args: ["--max_seq_len", "131072"]
        env:
          NS_JUDGE_MODEL: <judge-model-id>

  # A KV dtype no reference row fits: judged against dep8's own score.
  - name: dep8_kv_nvfp4
    options:
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      enable_attention_dp: true
      kv_cache_config: {dtype: nvfp4}
    launch: "<two-node-8-rank-prefix>"
    stop: "<site-step-cleanup>"
    relative_to: dep8
    tests:
      - tests/unittest/_torch/modeling_v2/<test_file.py>::<test_name>

  # Disaggregated: each side states how the cache moves; env states the site's UCX transports.
  - name: pd
    env:
      UCX_TLS: "^ib"                        # what worked on GB300; a container's tcp did not
    ctx:
      options:
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        enable_attention_dp: true
        disable_overlap_scheduler: true
        cache_transceiver_config: {backend: DEFAULT}
      launch: "<ctx-nodes-8-rank-prefix>"   # gets $MV2FLOW_SERVER=pd.ctx
      stop: "<ctx-step-cleanup>"
    gen:
      options:
        tensor_parallel_size: 8
        moe_expert_parallel_size: 8
        disable_overlap_scheduler: true
        cache_transceiver_config: {backend: DEFAULT}
      launch: "<gen-nodes-8-rank-prefix>"   # gets $MV2FLOW_SERVER=pd.gen
      stop: "<gen-step-cleanup>"
    relative_to: dep8
    timeout: 7200
