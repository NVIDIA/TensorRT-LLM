# trtllm-modeling-v2 task specification: every key the spec accepts, with its default. Fill it in
# by following spec/INTAKE.md, lint it with `trtllm-modeling-v2 intake lint --task task.yaml`, and check it
# with `trtllm-modeling-v2 --task task.yaml --workspace W --dry-run`. `trtllm-modeling-v2 intake
# derive --checkpoint <dir> --repo <checkout> --goal "..." --out D` writes a starting spec. Or derive one:
# `trtllm-modeling-v2 --checkpoint <dir> --site site.yaml --goal "..." --workspace W` writes
# W/task.derived.yaml (beside W/derive.report.md) and runs it; spec/derive.py lists goal words.
#
# Every block is CLOSED: an unknown key is an error naming the nearest real key, never a silent
# default. Commented-out keys are optional, with their default beside them.
# README.md summarizes the workflow's design and code ownership.

# ---------------------------------------------------------------- identity

# REQUIRED: the HuggingFace checkpoint directory.
checkpoint_path: /path/to/Qwen3-30B-A3B

# REQUIRED and never inferred: catalog receipts are per architecture. sm_100 = B200, sm_103 = GB300.
arch: sm_103

# tp<N> | tep<N> | dep<N> | unified (the default). The number is the world size, and how many
# devices a local run claims; `unified` takes its world size from the member set.
parallel: tp1

# The configurations a `unified` target is gated at, each paying boot + accuracy per unit (on a
# `local` run, all of one world size). Default: tp, tep and dep at the widest world size a variant's
# members declare, else 4. A list, or per unit over `default`:
# members: {default: [tp4, tep4, dep4], multimodal: [tep4]}

# `parallel`, `members`, `features`, `variants`, `runtime` and `accuracy.llm_api_options` are
# shorthand: each unit and each variant at each of its members is one deployment, whose native
# options are what these keys come to (the run journals them; `core` at the first member listed
# is the first). A spec may state its deployments itself instead, and then states none of the
# shorthand keys; a run reads them once its checks do, until then it validates them and stops:
# deployments:
#   - name: dep16                     # the first is core's
#     options: engines/dep16.yaml     # a native LLM-API options file (`trtllm-serve --config`),
#                                     # beside this file, or the options as a mapping
#     launch: "<site prefix>"         # empty: this host
#     timeout: 5400
#     inputs: [text, image]           # default [text]
#     benchmarks:                     # each a `trtllm-eval` subcommand
#       - name: gsm8k                 # judged against the reference row of accuracy.model_key
#       - {name: aa_lcr, anchor: 0.62, source: "<where it was measured>", env: {NS_JUDGE_MODEL: m}}
#     tests: []                       # native pytest node ids that also judge it
#   - name: pd                        # disaggregated: a context and a generation server
#     env: {UCX_TLS: "tcp,self,sm,cuda_copy,cuda_ipc"}
#     ctx: {options: engines/ctx.yaml, launch: "<nodes 1 to 4>"}
#     gen: {options: engines/gen.yaml, launch: "<nodes 5 to 8>"}
#     relative_to: dep16              # judged against dep16's own score
# With `deployments`, `accuracy` is optional and keeps `model_key`, `boot` and `dataset_path`.

# Feature units, built after core in the order listed: mtp, eagle3, dflash, dspark, multimodal,
# host_offload, disagg, kv_quant, decoder_replay, encoder_replay. Speculators get the acceptance
# gate. disagg owes its disaggregated-serving test alone (`accuracy.disagg`, below), once, at the
# member the request validates fully, on one node: its boot and accuracy would run an aggregated
# engine. `mtp.*` stages that are a DSpark block drafter (`dspark_*` config keys) are `dspark`,
# never `mtp`.
features: []

# Configurations a built unit must also serve, each gated on its own (a KV-cache or SSM-state dtype,
# a speculation depth): its checks (`<variant>:<gate>@<member>`) run on the unit's target under the
# unit's settings plus an overlay of `runtime`, `llm_api_options` or `env`.
# variants:
#   kv_fp8:
#     unit: core                    # default core
#     members: [tep4]               # default: the unit's, and the benchmark runs at one of them
#     gates: [accuracy]             # default [boot, accuracy]: a variant that boots, boots at every
#                                   # member of its unit; accuracy alone checks the setting took
#                                   # effect (spec/INTAKE.md). `acceptance` needs a speculator unit
#     runtime: {extra_flags: [--kv_cache_dtype=fp8]}      # over the unit's; flags appended
#     llm_api_options: {kv_cache_config: {dtype: fp8}}    # merged into the unit's YAML
#     env: {}                       # added to the gate command's environment
#     # Where they differ: benchmark, reference_yaml, model_key, discriminators, benchmark_args,
#     # samples, acceptance, anchor. Naming no row of its own, a variant is judged against its
#     # unit's own score at the same member and target (`anchor: relative`: KV fp8 against auto).
#     # With a row: `{discriminators: {kv_cache_quant_algo: FP8}}`, layered over the unit's.
#     note: KV cache stored as FP8
#   # A variant of disagg owes nothing: its axis is proven on core. A variant
#   # on a feature unit that changes a KV dtype or chunking is a combination; core's own variant
#   # proves the axis, so add it only when the request names it.

# A requested feature@member cell no check covers (`coverage.yaml`) stops the run at preflight
# unless accepted here: `<feature>@<member>`, `<feature>@*` for a row, `<unit>+<unit>` for a pair.
# coverage: {accept: [mtp7@tp4, disagg+multimodal@*]}

# `smoke` (a unit's boot alone), `bringup` (each unit at its cheapest member; no variant, no
# delivery check, and no CI files: the accuracy test, its test list entry, the anchor's row,
# when every unit is smoke or bringup), `standard` (the default: this file as written), `certified`
# (standard, with the serve gate on). For the run, or per unit and variant over `default`. A switch
# the spec sets itself keeps its value.
# profile: {default: standard, multimodal: smoke}

# REQUIRED: the checkout the target is built in.
trtllm_repo_path: /path/to/TensorRT-LLM

# Overrides of the derived Python package names: the family (from `architectures[0]`) and the
# checkpoint segment (from the directory name).
# target: {family: qwen3_5, checkpoint_segment: qwen3_5_27b}

# `full` (default) | `text_only`: a multimodal checkpoint built and gated as a language model.
# scope: text_only

# Free text passed verbatim to every role. It never relaxes a gate or the scope.
# notes: |
#   Reuse the NVFP4 MoE kernels in tensorrt_llm/_torch/modules/fused_moe.

# ----------------------------------------------------------------- runtime
# What every gate command runs with. Its limits (max_batch_size, max_num_tokens, max_seq_len, the
# CUDA-graph capture batches) are the serving envelope the target claims.
#
# runtime:
#   cuda_graph: true           # default true: eager gates make every accuracy run 10-50x
#                              # slower and score a path the target does not serve
#   chunked_prefill: false     # default false
#   overlap_scheduler: true    # default true  (--disable_overlap_scheduler)
#   kv_cache_reuse: false      # default false: block reuse is a non-core feature, proven by a
#                              # `reuse` variant (kv_cache_config.enable_block_reuse: true)
#   # Anything else the gate command needs, verbatim. Without --max_seq_len the engine sizes its
#   # cache for `max_position_embeddings` (`Impossible to fit in any sequence in kvCache`).
#   # max_seq_len = isl + osl; max_batch_size >= the concurrency the workload claims (a global total).
#   extra_flags: [--max_seq_len=9216, --max_batch_size=64, --kv_cache_fraction=0.7]
#
# Per unit, layered over `default`: {default: {extra_flags: [...]}, multimodal: {...}}. A setting
# both launchers take (the KV fraction, KV and SSM cache dtypes, tokens per block, max_num_tokens,
# trust_remote_code) is stated once, here or in `llm_api_options`; two values are refused.

# ------------------------------------------------------------- environment
# REQUIRED: how GPU work is launched, resolved once into the command prefix every prompt carries.

environment:
  # `local`, the one kind and the default: every command runs on the orchestrator's own host, on
  # the devices preflight claims. On a cluster, start the orchestrator inside the allocation.
  kind: local

  # The site's prefix for a one-GPU command; a deployment carries its own `launch`. Validated
  # here; the run's commands do not go through it yet.
  # launch: "<site prefix>"

  # REQUIRED: the interpreter every Python command runs under, the editable install to measure.
  # It must exist at launch (`intake lint` checks a path visible from this host).
  python: /path/to/TensorRT-LLM/.venv-3.12/bin/python

  # Exported to every command. Preflight requires TMPDIR and CLAUDE_CODE_TMPDIR outside /tmp, and
  # TMPDIR at most 61 characters (the LLM API binds a unix socket under it).
  env:
    TMPDIR: /path/to/scratch/tmp
    CLAUDE_CODE_TMPDIR: /path/to/scratch/tmp

  # gpus_per_node: 4                        # the devices this host holds
  # gpu_memory_gib: 288                     # per device: the lint sizes engines and disagg by it
  # The image the GPU jobs run in, if any, and how host paths appear inside it: the intake lint
  # checks the run's paths through them. How the image is started is yours.
  # container_image: /path/to/image
  # mounts: [/data:/data]

# ---------------------------------------------------------------- accuracy
# REQUIRED. The release criterion: measured >= reference - k x SE (see `floor`). The anchor comes
# from TensorRT-LLM's own accuracy references, never from the run; preflight resolves every row.

accuracy:
  # REQUIRED, both; each also takes the per-unit form, {default: ..., <unit>: ...}.
  benchmark: gsm8k
  reference_yaml: tests/integration/defs/accuracy/references/gsm8k.yaml

  # `statistical` (default): reference - k x SE, the SE binomial over the benchmark's sample count
  # (0.75 points for GSM8K's 1319 questions at 92 %: k = 2 puts the floor 1.5 points down);
  # `tolerance`: reference - `tolerance`. A unit gated at `shift_min_members` or more whose every
  # member scores over 1 SE low is a FINDING, blocking delivery until `acknowledge` gives a reason.
  # floor:
  #   rule: statistical
  #   k: 2.0                   # default
  #   shift_min_members: 2     # default
  #   acknowledge: {dspark: "every member -0.9..-1.1: drafter changes rounding, see 06-gates/..."}

  # In benchmark points; read only under `floor.rule: tolerance`. Default 5.0.
  tolerance: 5.0

  # Seconds one complete benchmark command may take (default 14400, four hours).
  # timeout: 14400

  # The sample count for the SE where the eval's output and `--num_samples` do not say it and the
  # benchmark's is not known (gsm8k, mmlu, mmmu, gpqa_*): a count, or per unit.
  # samples: {default: 1319, multimodal: 900}

  # Where each unit's benchmark runs: `every` member (the default), or the one member named
  # (`dep4`). A configuration variant's runs at one member either way (attention DP first).
  # benchmark_members: every

  # Anchors are in percent; one of 1 or less is refused. The certification holds each benchmark to
  # the row as written, so write a measured anchor before launch (the user's, or the reference's
  # on this hardware): a low placeholder passes any engine that answers. Commit the rows: the
  # certification reads the anchor table from the commit it measures.

  # The reference_yaml row's model, stated (`org/model`); default: the checkpoint path's last two
  # components, which name no model when config.json states no `_name_or_path`.
  # model_key: openai/gpt-oss-120b

  # The row's tags, matched EXACTLY (`quant_algo`, `kv_cache_quant_algo`, `spec_dec_algo`). Omitted,
  # the untagged row: for a quantized checkpoint the bf16 number. Flat, or per unit:
  # discriminators: {core: {quant_algo: NVFP4}, mtp: {quant_algo: NVFP4, spec_dec_algo: MTP}}

  # The DISAGG gate: disaggregation is proven by the tree's own kind of test, a pytest node that
  # serves the model through `trtllm-serve disaggregated` (a context and a generation engine, the
  # KV hand-off between them) and scores a benchmark across that hop. The run writes it beside the
  # tree's tests that already do so for other models; the gate runs it from its pytest root, as CI
  # does, and passes only when every test the node id selects passed (a skip fails it). REQUIRED
  # with the disagg feature.
  # disagg:
  #   test: tests/integration/defs/accuracy/test_disaggregated_serving.py::TestMyModel::test_auto_dtype
  #   env: {LLM_MODELS_ROOT: /path/to/models}   # what the test reads
  #   devices: 4                   # per node; default: two engines at the member's width, at most a node
  #   nodes: 1                     # the default and the only value: every check runs on one host
  #   tests: []                    # more node ids, each run as a job of its own
  #   timeout: 7200                # default, seconds

  # The ACCEPTANCE gate, where a unit keeps speculation on: accepted tokens per iteration per prompt
  # against built-in modeling (`=off`; fails under a 0.95 ratio when a paired test finds the drop
  # significant), against the previous tree's verdict, and against 1.0. With no `=off` path, declare
  # `measured_reference` (floor 0.95 x it) or `min_absolute` with its `floor_source`, per unit.
  # acceptance:
  #   # Default: the first `num_prompts` questions of the accuracy dataset, from the local cache.
  #   # Each workload key below also works inside a unit's entry, for that unit alone.
  #   # dataset: /data/gsm8k        # or a cached id; dataset_config, split, text_field pick them
  #   num_prompts: 32               # default
  #   prompt_template: "{text} Solve it step by step, then give the answer."
  #   # prompts: [...]              # or the prompts outright, or prompts_file: a YAML/JSON list
  #   max_tokens: 256               # default
  #   min_draft_iterations: 32      # default; fewer fails as "workload too short"
  #   min_prompts: 32               # default; fewer fails as "workload too small"
  #   regression: {alpha: 0.05, min_effect: 0.1}   # the defaults
  #   mtp: {min_absolute: 1.5, floor_source: "03-plan/acceptance-spike.md: reference 2.31"}
  #   dspark: {measured_reference: 3.32}   # floor 3.15

  # The BOOT gate's workload, run-wide or per unit; keywords match
  # generated text only. A `multimodal` unit with no image prompt sends the tree's
  # tests/integration/test_input_files/merlion.png.
  # boot:
  #   prompts:
  #     - "The capital of France is"
  #     - prompt: "Natalia sold 48 clips in April and half as many in May. How many in all?"
  #       keywords: ["72"]
  #   # prompts_file: boot_prompts.yaml   # or a YAML/JSON list of plain prompts
  #   keywords: [Paris]             # each must appear in some generated text
  #   max_tokens: 32                # default
  #   multimodal:
  #     prompts:
  #       - prompt: "<|User|><image>What vegetable is this? One word.<|Assistant|>"
  #         images: [examples/images/carrots.jpeg]   # beside this file, or in the tree
  #         render: raw                              # pre-rendered; or `loader`
  #         keywords_any: [carrot]

  # The SERVE gate: `trtllm-serve` starts each unit's target with the accuracy gate's options at its
  # widest member and answers one completion (and an image chat for a unit whose boot sends one).
  # On by default wherever `max_seq_len` (below, or in the run-wide options file) bounds the server.
  # serve:
  #   enabled: true
  #   prompt: "The capital of France is"   # default
  #   max_tokens: 32               # default
  #   timeout: 1800                # default, seconds for /health

  # `trtllm-eval`'s own flags. Without `max_seq_len` the eval sizes its KV cache for the
  # checkpoint's `max_position_embeddings` and dies.
  # max_seq_len: 8192
  # max_batch_size: 32

  # MMLU only: trtllm-eval's download URL 404s, which reads as a corrupt archive. A local copy:
  # dataset_path: /path/to/datasets/mmlu

  # The LLM-API YAML the accuracy gate runs under: a path, or per unit, relative to THIS FILE. A
  # speculator unit's carries its `speculative_config`, or its gates re-measure the base path; the
  # boot and acceptance gates read the draft depth there (`max_draft_len`; DSpark: `block_size`).
  # llm_api_options: {core: scripts/core_llm_api.yaml, mtp: scripts/mtp_llm_api.yaml}

  # The benchmark subcommand's own options: the PROTOCOL, which must match the anchor's (a chat
  # template in one and not the other reads as a large regression). Flat, or per unit.
  # benchmark_args: [--apply_chat_template]

# ------------------------------------------------------- agent backends
# REQUIRED: the model every role runs on. The launching agent writes its own backend, model and
# reasoning_effort into defaults (spec/INTAKE.md section 7); nothing is inherited from the launching
# session or the environment, and a role with no stated model stops the run before any worker starts.
# `roles.<name>` overrides `defaults` per field: backend (claude-code | codex, default claude-code),
# model, reasoning_effort, extra_mcp_servers. A role on another backend than defaults states its own
# model. Models are pinned once for the probe and every turn; an unset effort is the backend's.
# agents:
#   defaults: {backend: claude-code, model: <your-model-id>, reasoning_effort: <your-effort>}
#   roles:
#     planner: {backend: codex, model: <your-codex-model-id>, reasoning_effort: high}
#   # defaults: {extra_mcp_servers: {knowledge-base: {type: http, url: https://example.test/mcp}}}

# ----------------------------------------------------------- commit policy
# What a task's commits may touch, audited before each integration and over the branch at delivery.
# By default a run commits only its own paths: the target's family directory, the tests that mirror
# it, the two family registries and tests/integration/. Code other models run is refused; a shared
# catalog entry is served by a local variant in the target's own ops/.
# Every commit is authored and signed off as the repository's user (or MV2FLOW_GIT_NAME /
# MV2FLOW_GIT_EMAIL); an added symlink, a sandbox placeholder and the workspace are always refused.
# commit_policy:
#   allowed_paths: [tensorrt_llm/, tests/]   # instead of the run's own paths: say why in notes
#   allow_co_authors: false    # the default
#   base_ref: origin/main      # delivery audits merge-base(HEAD, base_ref)..HEAD; default
#                              # origin/main, else upstream/main, else main
