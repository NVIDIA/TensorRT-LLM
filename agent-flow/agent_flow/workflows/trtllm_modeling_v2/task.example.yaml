# trtllm-modeling-v2 task specification: every key the spec accepts, with its default. Fill it in
# by following spec/INTAKE.md and check it with `trtllm-modeling-v2 --task task.yaml --workspace W
# --dry-run`, which prints what the spec is likely to cost or miss (advice: it stops nothing).
# `trtllm-modeling-v2 intake derive --checkpoint <dir> --repo <checkout> --goal "..." --out D`
# writes a starting spec and each deployment's options (D/engines/); spec/derive.py lists the
# goal's words. Or derive and run: `trtllm-modeling-v2 --checkpoint <dir> --site site.yaml
# --goal "..." --workspace W`.
#
# Every block is CLOSED: an unknown key is an error naming the nearest real key, never a silent
# default. Commented-out keys are optional, with their default beside them.
# What you must fill in is the one table of README.md; every value below is a placeholder.

# ---------------------------------------------------------------- identity

# REQUIRED: the HuggingFace checkpoint directory.
checkpoint_path: /path/to/<checkpoint>

# REQUIRED and never inferred: catalog receipts are per architecture. sm_100 = B200, sm_103 = GB300.
arch: sm_103

# REQUIRED: the checkout the target is built in.
trtllm_repo_path: /path/to/TensorRT-LLM

# The target is models/<family>/<checkpoint_segment>__<arch>__<parallel>. Each part is derived
# when unsaid: the family that routes `architectures[0]` in the tree (else a new one named
# after it), the checkpoint segment from the directory
# name, and <parallel> as `unified`, a target for every layout its route admits (what several
# deployments need). State `parallel: tp1` for a target written for one layout.
# target: {family: <family>, checkpoint_segment: <checkpoint>, parallel: unified}

# Free text passed verbatim to every role. It never relaxes a check.
# notes: |
#   Architecture: ... Code of this tree worth a survey's time: ...

# ------------------------------------------------------------- deployments
# REQUIRED: what the run brings up, the one way to say it. A deployment is one served
# configuration of the checkpoint: a name and the native options `trtllm-serve --config` takes
# (a YAML path beside the spec, or the mapping itself). Nothing here says how it is launched:
# its world size is tensor x pipeline x context parallel, as the engine enforces it (expert
# parallelism shares those ranks), and the pool places it.
#
# The FIRST deployment defines `onboarded`. Every deployment is checked in ONE session: its
# servers are loaded once and every check is a client of them, each with its own line
# (spec/INTAKE.md, section 4).
#
# When a load is long, onboard in two runs (spec/INTAKE.md, section 3): the first lists the
# first deployment alone; the second states the ref that run pinned and lists the rest. Its
# survey then writes only what those deployments add, and no deployment waits for a first one.
# onboarded: refs/mv2/<run>/onboarded

deployments:
  - name: tp1
    options: engines/tp1.yaml
    # timeout: 5400                         # seconds for its whole session; unsaid: 1800 for the
    #                                       # load and probes, plus `accuracy.timeout` per benchmark
    # env: {}                               # exported to its servers, over environment.env
    # inputs: [text]                        # [text, image]: its session also sends an image
    # probes: []                            # reuse | chunk. Unsaid: `reuse` when the options
    #                                       # turn block reuse on, `chunk` when they turn
    #                                       # chunked prefill on.
    # tests: []                             # pytest node ids of the tree that also judge it
    # benchmarks:                           # unsaid: `accuracy.benchmark`, where the spec has one
    #   - name: gsm8k                       # anchor: the reference row of accuracy.model_key
    #   - name: mmlu
    #     through: eval                     # `trtllm-eval` in a load of its own (the default,
    #                                       # `endpoint`, scores in the session's load)
    #   - name: aa_lcr                      # no reference row: declare the anchor
    #     anchor: 0.62
    #     unit: fraction                    # percent (the default) or fraction
    #     source: "<where and how 0.62 was measured>"
    #     samples: 100                      # the count behind the standard error
    #     args: ["--max_seq_len", "131072"] # the benchmark's own options: its protocol
    #     env: {}

  # Another layout: its own options, and so its own reference row.
  # - {name: dep4, options: engines/dep4.yaml}

  # A KV dtype no reference row fits: judged against tp1's own score, measured as it is.
  # - name: kv_fp8
  #   options: engines/kv_fp8.yaml          # tp1's options with kv_cache_config: {dtype: fp8}
  #   relative_to: tp1

  # A drafter: its options state `speculative_config`; its session reads the accepted tokens.
  # - {name: mtp, options: engines/mtp.yaml}

  # Disaggregated: `ctx` and `gen` each with their own options (they may differ in every
  # parallel size) and their own count of `instances`. Both state how the cache moves:
  # `cache_transceiver_config: {backend: DEFAULT}`. The session starts one server per role
  # instance on devices of its own and the proxy over them, proves that generation received the
  # context's state, and scores through the hop.
  # - name: pd
  #   env: {UCX_TLS: "^ib"}                 # the transports the site's network needs
  #   ctx: {options: engines/pd.ctx.yaml}
  #   gen: {options: engines/pd.gen.yaml, instances: 2}
  #   relative_to: tp1
  #   tests:                                # pytest node ids of the tree, as `pytest` takes them:
  #     - <test file>::<TestClass>::<test>    # find the transfer test of this cache kind by what it does

# ------------------------------------------------------------- environment
# REQUIRED: where the run's GPUs come from. Every GPU job is a file in the run's one spool,
# which states its size (`gpus` or `nodes`) and its wall; the pool keeps holders under it.

environment:
  # Which environment gets the holders. `local` is this one host: the flow starts one watcher
  # here and stops it at exit. A spec that names none is this host where the host has no
  # `sbatch`, and Slurm (`environment.slurm` below) where it has; the kind is written into the
  # spec the run reads. On Slurm, delete this line: a stated `kind: local` wins over a `slurm`
  # block beside it.
  kind: local

  # REQUIRED: the interpreter every Python command runs under, the editable install to measure.
  # It must exist at launch.
  python: /path/to/TensorRT-LLM/<venv>/bin/python

  # Exported to every command. Preflight requires TMPDIR and CLAUDE_CODE_TMPDIR outside /tmp, and
  # TMPDIR at most 61 characters (the LLM API binds a unix socket under it).
  env:
    TMPDIR: /path/to/scratch/tmp
    CLAUDE_CODE_TMPDIR: /path/to/scratch/tmp

  # The run's one spool; default <workspace>/spool. With Slurm it must be on storage every node
  # sees, under a container mount.
  # spool: /path/to/scratch/spool
  # gpu_memory_gib: 288                     # per device: the advice sizes engines by it

  # Where the run's trees go. They are whole git trees on each node's own disk (a task's tree
  # on the controller's host, a pin's tree where its job runs), under
  # /tmp/mv2flow-trees-<user>/<run> unless `root` states another place; the storage every node
  # shares then holds git objects only.
  # trees:
  #   root: /path/on/each/node/trees         # the same path on every node; default under /tmp

  # --- Slurm (what a spec that names no environment is, where there is `sbatch`) ---
  # The flow renders and submits one batch job per holder, renews it before the last one stops
  # fitting the longest job, and ends it when no work is left. The values are your site's: state
  # them here, or keep them in the site file you pass to `intake derive --site`.
  # slurm:
  #   account: <account>                     # REQUIRED: sacctmgr show assoc user=$USER format=account,partition,qos
  #   partition: <partition>                 # REQUIRED: sinfo -o "%P %G %l"
  #   time: "04:00:00"                       # REQUIRED: one holder's limit; the longest session plus 10 min must fit
  #   gpus_per_node: 4                       # REQUIRED: sinfo -p <partition> -o "%G"
  #   qos: <qos>
  #   container_image: /path/to/image.sqsh   # a local image file; absent: steps run in the node's own environment
  #   container_mounts: [/path/to/scratch:/path/to/scratch]   # REQUIRED with an image: every path the run uses
  #   container_name: <name>                 # default mv2flow-<run>: the runtime reuses the container between steps
  #   max_node_hours: 48                     # what the run may ask the scheduler for: its holders, nodes x time
  #                                          # each; at it, POOL_CAPACITY asks before more
  #   lead: 30m                              # the expected queue wait: how early the next holder is asked for
  #   host_python: python3                   # the batch host's interpreter, for the holder's lead: 3.8 or newer
  #   sbatch_args: [--exclusive, --mem=0]    # passed through; a flag the flow sets itself is refused
  #   srun_args: []
  #   # The flow submits no job for its controller: it runs where you start the command. Inside
  #   # a job (a site's script that submits the command), it stops ten minutes before the job's
  #   # end, prints the command that continues, and exits 75.

  # --- one host: what may be stated of it -----------------------------------
  # gpus_per_node: 4
  # container_image: /path/to/image         # descriptive: how host paths appear inside the
  # mounts: [/data:/data]                   # image the watcher runs in

# ---------------------------------------------------------------- accuracy
# Optional: the defaults every benchmark takes, and what a session sends. Leave the block out to
# onboard on each session's own checks (attestation, boot, API) alone.
#
# A benchmark passes when measured >= anchor - k x SE (see `floor`). Its anchor is, in this
# order: the `anchor` it declares, the tree's reference row for `model_key` with exactly the
# deployment's tags, the score of the deployment `relative_to` names, or nothing. A benchmark
# with nothing to hold it to is BLOCKED before its load, with the reason, and everything else
# of the deployment goes on. Anchors are frozen in <workspace>/anchors.yaml at the first start. None is
# beyond change: `trtllm-modeling-v2 resolve --workspace W change-requirement <task|run>
# --deployment D --benchmark B --anchor V --reason "..."` changes one and records what
# changed and why.

accuracy:
  # The benchmark of a deployment that lists none (gsm8k unsaid), and the key of its reference
  # rows (unsaid: the checkpoint path's last two components).
  benchmark: gsm8k
  model_key: <org>/<model>

  # reference_yaml: /path/to/reference.yaml # unsaid: the tree's own reference rows for the benchmark
  # discriminators: {quant_algo: NVFP4}     # the row's tags beside what the options imply
  # dataset_path: /path/to/dataset          # unsaid: staged by the run; accuracy runs offline
  # samples: 1319                           # for a benchmark whose size the flow does not know
  # score_pattern: "accuracy: ([0-9.]+)"    # how a score is read; unsaid: as lm-eval and MMLU print it
  # timeout: 14400                          # seconds for one benchmark

  # The floor under a score: `statistical` (anchor - k x SE, the default) or `tolerance`
  # (anchor - `tolerance` points). `acknowledge` accepts, by benchmark, a shift every
  # deployment scored on it shares.
  # floor: {rule: statistical, k: 2.0}
  # tolerance: 5.0

  # What a session sends at boot, for the run and, under a deployment's name, for that one.
  # Keywords are matched against the generated text only.
  # boot:
  #   prompts:
  #     - {prompt: "The capital of France is", keywords_any: [Paris]}
  #     - {prompt: "Question: A crate holds 12 bottles. How many bottles do 6 crates hold? Answer:", keywords_any: ["72"]}
  #   max_tokens: 64
  #   tp1: {keywords: [Paris]}

  # A drafter's acceptance workload, and what each drafting deployment's reading is held to.
  # With nothing declared for it, a reading is held to 1.0 alone, and its line says so.
  # acceptance:
  #   prompts_file: prompts.yaml            # or prompts: [...], or dataset: <path or cached id>
  #   max_tokens: 256
  #   mtp:
  #     measured_reference: 2.9             # the floor is this x 0.95 (or `min_absolute`)
  #     floor_source: "<where a reference drafter measured it>"

# ------------------------------------------------------- agent backends
# REQUIRED: the model every role runs on (spec/INTAKE.md, section 7): nothing is inherited.
# `roles.<name>` overrides `defaults` per field: backend (claude-code | codex, default claude-code),
# model, reasoning_effort, extra_mcp_servers. A role on another backend than defaults states its own
# model. Models are pinned once for probes and all stages; an unset effort is the backend's.
# agents:
#   defaults: {backend: claude-code, model: <your-model-id>, reasoning_effort: <your-effort>}
#   roles:
#     surveyor: {backend: codex, model: <your-codex-model-id>, reasoning_effort: high}
#   # defaults: {extra_mcp_servers: {knowledge-base: {type: http, url: https://example.test/mcp}}}

# ----------------------------------------------------------- commit policy
# What a task's commits may touch, audited before each integration and over the branch at delivery.
# Every commit is authored and signed off as the repository's user (or MV2FLOW_GIT_NAME /
# MV2FLOW_GIT_EMAIL); an added symlink, a sandbox placeholder and the workspace are always refused.
# commit_policy:
#   allowed_paths: [<directory>/, ...]   # unsaid: no list. Each task commits only inside its own
#                              # write scope (its card names it), which the landing audits;
#                              # `resolve allow-shared <task> --path` widens one task's. State a
#                              # list to refuse everything outside it, whatever a task's scope
#   allow_co_authors: false    # the default
#   base_ref: origin/main      # delivery audits merge-base(HEAD, base_ref)..HEAD; default
#                              # origin/main, else upstream/main, else main
