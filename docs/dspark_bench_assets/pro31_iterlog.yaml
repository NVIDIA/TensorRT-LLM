speculative_config:
  decoding_type: DSpark
  max_draft_len: 5
  speculative_model: /lustre/fsw/coreai_comparch_trtllm/laliao/llm-models/DeepSeek-V4-Pro-DSpark
  enable_confidence_scheduling: false
moe_config:
