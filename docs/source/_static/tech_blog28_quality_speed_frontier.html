const COLORS={
  'BF16':'#1a73e8','BF16 + SAGE':'#e8710a','FP8 block':'#9334e6',
  'FP8 block + SAGE':'#188038','NVFP4':'#d93025','NVFP4 + SAGE':'#00897b'
};
const TARGETS=[0.65,0.70,0.75], CUTOFFS=[0.86,0.90,0.94,0.97,1.00];
const NS='http://www.w3.org/2000/svg';
const plot=document.getElementById('plot'), tooltip=document.getElementById('tooltip');
function chips(id,values,key,format){
  document.getElementById(id).innerHTML=values.map(v=>
    `<label><input type="checkbox" data-${key}="${v}" checked> ${format(v)}</label>`
  ).join(' ');
}
chips('families',FAMILIES,'family',v=>v);
chips('targets',TARGETS,'target',v=>v.toFixed(2));
chips('cutoffs',CUTOFFS,'cutoff',v=>v.toFixed(2));
function selected(key){
  return [...document.querySelectorAll(`[data-${key}]:checked`)].map(e=>e.getAttribute(`data-${key}`));
}
function star(cx,cy,r){
  let d='';
  for(let i=0;i<10;i++){
    const a=Math.PI*i/5-Math.PI/2, rr=i%2?r*.45:r;
    d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)+' ';
  }
  return d+'Z';
}
function pareto(points){
  const ordered=[...points].sort((a,b)=>b.speedup-a.speedup);
  let best=Infinity;
  const result=[];
  for(const point of ordered){
    if(point.lpips<best-1e-12){best=point.lpips;result.push(point)}
  }
  return result.sort((a,b)=>a.speedup-b.speedup);
}
function draw(){
  const families=selected('family');
  const targets=selected('target').map(Number);
  const cutoffs=selected('cutoff').map(Number);
  const showDense=document.getElementById('dense').checked;
  const variants=DATA.filter(p=>!p.dense&&families.includes(p.family)&&targets.includes(p.target)&&cutoffs.includes(p.cutoff));
  const anchors=showDense?DATA.filter(p=>p.dense&&families.includes(p.family)):[];
  const visible=variants.concat(anchors);
  document.getElementById('count').textContent=`${variants.length} / 90 variants${anchors.length?' + '+anchors.length+' dense anchors':''}`;

  const W=1120,H=590,m={l:78,r:205,t:24,b:66};
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label','Interactive scatter plot of speedup versus mean LPIPS');
  function add(tag,attrs,text){
    const e=document.createElementNS(NS,tag);
    Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
    if(text!==undefined)e.textContent=text;
    svg.appendChild(e);return e;
  }
  add('rect',{x:0,y:0,width:W,height:H,fill:'#fff'});
  const domain=visible.length?visible:DATA;
  let xmin=Math.min(...domain.map(p=>p.speedup)),xmax=Math.max(...domain.map(p=>p.speedup));
  let ymin=Math.min(...domain.map(p=>p.lpips)),ymax=Math.max(...domain.map(p=>p.lpips));
  const xpad=Math.max((xmax-xmin)*.06,.015),ypad=Math.max((ymax-ymin)*.08,.012);
  xmin-=xpad;xmax+=xpad;ymin=Math.max(0,ymin-ypad);ymax+=ypad;
  const X=v=>m.l+(v-xmin)/(xmax-xmin)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-ymin)/(ymax-ymin)*(H-m.t-m.b);
  for(let i=0;i<=5;i++){
    const y=m.t+(H-m.t-m.b)*i/5,value=ymax-(ymax-ymin)*i/5;
    add('line',{x1:m.l,y1:y,x2:W-m.r,y2:y,stroke:'#e3e7eb','stroke-dasharray':'2 3'});
    add('text',{x:m.l-9,y:y+4,'text-anchor':'end','font-size':12,fill:'#5c6470'},value.toFixed(2));
  }
  for(let i=0;i<=5;i++){
    const x=m.l+(W-m.l-m.r)*i/5,value=xmin+(xmax-xmin)*i/5;
    add('line',{x1:x,y1:m.t,x2:x,y2:H-m.b,stroke:'#f0f2f4'});
    add('text',{x:x,y:H-m.b+21,'text-anchor':'middle','font-size':12,fill:'#5c6470'},value.toFixed(2)+'×');
  }
  add('line',{x1:m.l,y1:H-m.b,x2:W-m.r,y2:H-m.b,stroke:'#59636e'});
  add('line',{x1:m.l,y1:m.t,x2:m.l,y2:H-m.b,stroke:'#59636e'});
  add('text',{x:(m.l+W-m.r)/2,y:H-15,'text-anchor':'middle','font-size':14,'font-weight':600},'Speedup over compiled dense BF16 (higher is better)');
  add('text',{transform:`translate(20,${(m.t+H-m.b)/2}) rotate(-90)`,'text-anchor':'middle','font-size':14,'font-weight':600},'Mean LPIPS vs eager BF16 (lower is better)');

  if(document.getElementById('pareto').checked&&visible.length){
    const front=pareto(visible);
    if(front.length>1){
      add('path',{d:'M'+front.map(p=>`${X(p.speedup).toFixed(1)} ${Y(p.lpips).toFixed(1)}`).join(' L'),fill:'none',stroke:'#30363d','stroke-width':2.2,'stroke-dasharray':'7 4'});
    }
  }
  function bind(element,p){
    element.style.cursor='pointer';
    element.addEventListener('mousemove',event=>{
      const config=p.dense?'Dense attention':`target sparsity ${p.target.toFixed(2)} · cutoff ${p.cutoff.toFixed(2)}`;
      tooltip.textContent=`${p.family} · ${config}
Speedup ${p.speedup.toFixed(3)}× · latency ${p.latency.toFixed(1)} s
Mean LPIPS ${p.lpips.toFixed(4)}`;
      tooltip.style.left=event.clientX+'px';tooltip.style.top=event.clientY+'px';tooltip.classList.add('on');
    });
    element.addEventListener('mouseleave',()=>tooltip.classList.remove('on'));
  }
  for(const p of variants){
    const c=add('circle',{cx:X(p.speedup).toFixed(1),cy:Y(p.lpips).toFixed(1),r:5.5,fill:COLORS[p.family],'fill-opacity':.72,stroke:'#fff','stroke-width':1});
    bind(c,p);
  }
  for(const p of anchors){
    const s=add('path',{d:star(X(p.speedup),Y(p.lpips),9),fill:COLORS[p.family],stroke:'#fff','stroke-width':1.2});
    bind(s,p);
  }
  const lx=W-m.r+18,ly=m.t+15;
  FAMILIES.forEach((family,i)=>{
    add('circle',{cx:lx,cy:ly+i*27,r:6,fill:COLORS[family]});
    add('text',{x:lx+12,y:ly+i*27+4,'font-size':12},family);
  });
  const sy=ly+FAMILIES.length*27+18;
  add('path',{d:star(lx,sy,8),fill:'#59636e'});
  add('text',{x:lx+12,y:sy+4,'font-size':12},'Dense anchor');
  add('line',{x1:lx-7,y1:sy+27,x2:lx+7,y2:sy+27,stroke:'#30363d','stroke-width':2.2,'stroke-dasharray':'7 4'});
  add('text',{x:lx+12,y:sy+31,'font-size':12},'Pareto frontier');
  plot.replaceChildren(svg);
}
document.querySelectorAll('input').forEach(input=>input.addEventListener('change',draw));
draw();
})();
</script>
</body>
