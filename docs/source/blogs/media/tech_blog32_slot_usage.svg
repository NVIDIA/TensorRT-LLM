<title id="slot-title">Helper-slot occupancy and load balance</title>
<desc id="slot-desc">A constructed eight-rank example with one home expert and one helper slot per rank. Initial loads are 3,3,3,3,1,1,1,1. Matrices show candidate experts e0 to e3 and receiver ranks 4 to 7. Free placement occupies one receiver slot for each expert and routes one token to each replica. Hierarchical placement occupies both slots of each aligned pair; the zero-token cells are still occupied. One optimal hierarchical plan offloads e0 to rank 4 and e1 to rank 6, reserving unused replicas on ranks 5 and 7. Final loads are all two for Free and 2,2,3,3,2,1,2,1 for Hierarchical. Their optimal imbalance ratios are one and 1.5. The common load lower bound is two.</desc>
<defs><pattern id="idle-slot" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#fbf3e6"/><path d="M-2,2L2,-2 M0,7L7,0 M5,9L9,5" stroke="#ddbd88" stroke-width="1"/></pattern></defs>
