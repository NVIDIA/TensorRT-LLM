# V2 (PYTHON runtime) multi-node setup-hang root-cause + validation config.
# Derived from the Track-E KDA-payload config (job 2655624, known-good CPP
# cells at ~500 GB/s). Differences:
#   * NIXL/PYTHON combination re-enabled (the cell that "hung" in job 2655477),
#     with NIXL/CPP kept as an in-sweep control.
#   * Single request length (2144 tokens = exact per-rank Kimi K3 KDA payload,
#     454,459,392 B) for a fast repro.
#   * Two sweeps: sweep0 pins the known-good UCX_TLS (verbs excluded); sweep1
#     deliberately re-runs UCX_TLS=all — the ONLY env the PYTHON combo was ever
#     tried under multi-node — to reproduce the "mpi_allgather hang" with the
#     new per-phase setup logging in KvCacheTransceiverV2.
# PATH must keep /cm/local/apps/slurm/current/bin (launch.slurm evals the sweep
# env on the batch host too); UCX_TLS must exclude verbs on these NVL72 nodes.

slurm:
  partition: "batch"
  account: "coreai_comparch_trtllm"
  job_time: "00:30:00"
  job_name: "ctt_v2_hang"
  extra_args: "--gpus-per-node=4"

hardware:
  gpus_per_node: 4

environment:
  container_image: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_trtllm/users/brnguyen/goldenprairie/sw-tensorrt-docker+tensorrt-llm+pytorch-26.05-py3-sbsa-ubuntu24.04-trt10.16.1.11-skip-tritondevel-202607151440-16194.sqsh"
  # Worktree lives under the main checkout; one mount covers both.
  container_mount: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_trtllm/users/brnguyen/goldenprairie/tekit-golden-prairie:/scratch/fsw/portfolios/coreai/projects/coreai_comparch_trtllm/users/brnguyen/goldenprairie/tekit-golden-prairie"
  # TRT-LLM comes from the main checkout's venv (PATH below) + worktree code
  # (PYTHONPATH below); skip pip install.
  trtllm_repo: ""
  work_dir: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_trtllm/users/brnguyen/goldenprairie/tekit-golden-prairie/.claude/worktrees/gpd-v2-mpi-hang/log/ctt_v2_hang"
  trtllm_wheel_path: ""
  build_wheel: false
  cuda_architectures: ""

test_matrix:
  combinations:
    - {backend: "NIXL", runtime: "PYTHON"}
    - {backend: "NIXL", runtime: "CPP"}
  cache_manager_versions: ["V1"]
  # 2144 tokens = 454,459,392 B per rank = exact K3 per-request KDA payload.
  request_lengths: [2144]
  num_requests_per_length: 8
  warmup_requests: 2

kv_cache:
  num_layers: 69
  num_kv_heads: 24       # /tp4 -> 6 heads per rank
  head_dim: 128
  tokens_per_block: 32
  dtype: "HALF"
  max_tokens_in_buffer: 4096

parallel:
  ctx_tp: 4
  ctx_pp: 1
  gen_tp: 4
  gen_pp: 1

ucx_env_sweep:
  # Sweep 0: the known-good transport set (verbs excluded; ud_verbs cannot
  # initialize on these NVL72 nodes). Expected: NIXL/PYTHON passes.
  - name: "venv_no_verbs"
    env:
      UCX_TLS: "tcp,self,sm,cuda_copy,cuda_ipc"
      PATH: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_trtllm/users/brnguyen/goldenprairie/tekit-golden-prairie/.venv-3.12/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/cm/local/apps/slurm/current/bin"
      PYTHONPATH: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_trtllm/users/brnguyen/goldenprairie/tekit-golden-prairie/.claude/worktrees/gpd-v2-mpi-hang"
  # Sweep 1: reproduce job 2655477's env (UCX_TLS=all -> broken ud_verbs).
  # Expected: NIXL/PYTHON setup wedges rank-asymmetrically inside native
  # NIXL/UCX agent init; peers stall in the next MPI collective. The
  # per-phase 'KvCacheTransceiverV2 setup:' log lines localize it.
  - name: "venv_all"
    env:
      UCX_TLS: "all"
      PATH: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_trtllm/users/brnguyen/goldenprairie/tekit-golden-prairie/.venv-3.12/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/cm/local/apps/slurm/current/bin"
      PYTHONPATH: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_trtllm/users/brnguyen/goldenprairie/tekit-golden-prairie/.claude/worktrees/gpd-v2-mpi-hang"

run:
  timeout_per_cell_s: 180
  max_sweep_s: 480
  capture_proto_info: true
