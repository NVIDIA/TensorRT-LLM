  - id: case-visual-gen-warmup-cache-key
    file: references/warmup-and-jit/visual-gen-warmup-cache-key.md
    removed_on: 2026-08-12
    reason: not-instability
    nvbugs: ["6015329"]
    commits: ["9cc758419adb"]
    success_prs: [12516]
    evidence: >
      The observable was a spurious "not warmed up" WARNING on an image-only
      FLUX pipeline whose cache key included num_frames; the recompile was only
      ever *potential* and no measured metric moved. A false warning is not a
      perf-instability precedent.
    mechanism_kept_at: data/patterns.yaml RETIRED block for
      pattern-warmup-cache-key-too-strict — the mechanism (a cache key must
      contain only axes the compiled artifact actually depends on) is worth
      knowing.
    readd_if: a measured recompile, not a warning, is demonstrated.

  - id: case-beam-search-logprobs-nondeterminism
    file: references/runtime-determinism/beam-search-logprobs-nondeterminism.md
    removed_on: 2026-08-12
    reason: not-instability
    nvbugs: []
    commits: ["130ae826d025"]
    success_prs: [15125]
    evidence: >
      An *output*-correctness defect: a kernel derived nMaxBatchSize from an
      outputIdsPtr sliced to the ACTIVE batch, so it read the wrong slot and
      returned wrong log_probs, varying with batch drain order. No perf metric
      varies anywhere in it — and it had been filed under
      pattern-metric-with-hidden-rng despite containing no RNG, which is how a
      "varies run to run" phrase alone can smuggle a correctness bug into a
      perf cookbook. Excluded on the same rule as pending.yaml's
      #14841 / #14509 / #14652.
    mechanism_kept_at: >
      data/patterns.yaml RETIRED block for pattern-active-vs-max-batch-stride —
      a real and nasty class: look for getDimension<0>() on tensors that are
      ever sliced, and pin every kernel-launch extent to the ALLOCATION
      dimension.
    readd_if: never as instability; it is a correctness precedent.

  # ---- Moved to the regression cookbook (3 cases) --------------------------
  # These were not refuted — they were in the wrong cookbook. The shared error
  # was treating "presents as a spike in a trace" as instability. A cost paid
  # once per process moves the MEAN, not the spread.

  - id: case-warmup-token-cap-revert
    file: references/warmup-and-jit/warmup-token-cap-revert.md
    removed_on: 2026-08-12
    reason: moved-to-regression-cookbook
    nvbugs: ["6185713"]
    commits: ["d42ec3df56a9"]
    success_prs: [14252]
    evidence: >
      PR #14252 reverts #13758's 8192-token warmup cap, which silently dropped
      warmup / autotuner coverage of every shape between the cap and
      max_num_tokens — a loss paid on every run at those shapes, i.e. a step in
      the mean. The revert PR states no number.
    mechanism_kept_at: perf-regression-cookbook
      references/kernel-and-fusion/warmup-token-cap-revert.md
    readd_if: never — it lives in the regression cookbook.

  - id: case-trtllmgen-fmha-jit-warmup
