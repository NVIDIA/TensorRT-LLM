  - id: case-beam-search-logprobs-nondeterminism
    file: references/runtime-determinism/beam-search-logprobs-nondeterminism.md
    removed_on: 2026-08-12
    reason: not-instability
    nvbugs: []
    commits: ["130ae826d025"]
    success_prs: [15125]
    severity: n/a — no bug id; judged on the PR
    evidence: >
      An *output*-correctness defect: a kernel derived nMaxBatchSize from an
      outputIdsPtr sliced to the ACTIVE batch, so it read the wrong slot and
      returned wrong log_probs, varying with batch drain order. No perf metric
      varies anywhere in it — and it had been filed under
      pattern-metric-with-hidden-rng despite containing no RNG, which is how a
      "varies run to run" phrase alone can smuggle a correctness bug into a
      perf cookbook. Excluded on the same rule as pending.yaml's
      #14841 / #14509 / #14652.
    mechanism_kept_at: >
      data/patterns.yaml RETIRED block for pattern-active-vs-max-batch-stride —
      a real and nasty class: look for getDimension<0>() on tensors that are
      ever sliced, and pin every kernel-launch extent to the ALLOCATION
      dimension.
    readd_if: never as instability; it is a correctness precedent.

