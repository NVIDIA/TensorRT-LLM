  - id: case-mla-chunked-prefill-maybe-compiled-cat-warmup
    file: references/warmup-and-jit/mla-chunked-prefill-maybe-compiled-cat-warmup.md
    removed_on: 2026-08-12
    reason: moved-to-regression-cookbook
    nvbugs: ["5823212"]
    commits: ["85dc52acae7c", "6c542e98216d"]
    success_prs: [11743, 11744]
    evidence: >
      The clearest example of the first-use-recompile trap: a torch.compile
      paid once per process on a branch (chunked prefill) the warmup never
      enters. Also carries a branch-pair provenance hazard: the fix is #11743
      on main and #11744 on release/1.2, both titled against the same id, so
      a lookup that follows only main misses the release-branch landing.
    mechanism_kept_at: perf-regression-cookbook
      references/kernel-and-fusion/mla-chunked-prefill-maybe-compiled-cat-warmup.md
    readd_if: never — it lives in the regression cookbook.
