      first-use-recompile trap: a torch.compile paid once per process on a
      branch (chunked prefill) the warmup never enters. Also carries a
      branch-pair provenance hazard: the fix is #11743 on main and #11744 on
      release/1.2, and it was #11744 that closed the bug — so bug->PR and
      PR->bug lookups return different numbers.
    mechanism_kept_at: perf-regression-cookbook
      references/kernel-and-fusion/mla-chunked-prefill-maybe-compiled-cat-warmup.md
    readd_if: never — it lives in the regression cookbook.
