    reason: not-instability
    nvbugs: ["6248837"]
    commits: ["7e243650e8dd"]
    success_prs: [15305]
    evidence: >
      PR #15305 describes one DSR1 case where a kernel "would be selected only
      if seqlen between a very narrow area (8193-9316)" was missing from the
      trtllm-gen FMHA warmup grid, and densifies the grid. A fixed coverage
