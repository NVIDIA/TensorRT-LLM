# Wan-AI/Wan2.2-TI2V-5B-Diffusers  ·  WanPipeline  ·  i2v
# guidance_scale · max_sequence_length: _WAN22_5B_PARAMS defaults.
backend: openai-videos

common_params:
  width: 1280
  height: 704
  num_frames: 121
  frame_rate: 24.0
  num_inference_steps: 50
  guidance_scale: 5.0
  max_sequence_length: 512
  seed: 42

# Prompt from wan_i2v.py's `main`, which pairs it with this reference, minus its
# audio clause -- no audio is requested here.
# The reference is pre-resampled to the shape pinned above: Wan preprocesses through
# diffusers' VaeImageProcessor at its default resize_mode, a plain resize, so an
# off-shape reference is distorted.
requests:
  - prompt: A cat presses the piano keys with its paws
    image_reference:
      content: ../media/cat_piano.png
      format: path
