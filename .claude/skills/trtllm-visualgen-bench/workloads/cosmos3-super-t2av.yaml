# nvidia/Cosmos3-Super  ·  Cosmos3OmniMoTPipeline  ·  t2av
# guidance_scale · max_sequence_length: pipeline defaults.
#
# enable_audio below is what turns audio on; the prompt file's own key is
# ignored by the loader, which reads only `prompt`.
# Run with --format mp4: without ffmpeg the encoder falls back to AVI and drops
# the audio track, leaving a warning and a successful response.
backend: openai-videos

common_params:
  width: 1280
  height: 720
  num_frames: 189
  frame_rate: 24.0
  num_inference_steps: 35
  guidance_scale: 6.0
  max_sequence_length: 4096
  extra_params:
    output_type: video
    enable_audio: true
  seed: 42

requests:
  - prompt_file: ../prompts/cosmos3-t2av.json
