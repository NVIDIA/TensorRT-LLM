  - id: case-disagg-pp-transfer-consensus-rendezvous
    file: references/communication/disagg-pp-transfer-consensus-rendezvous.md
    removed_on: 2026-08-12
    reason: maintainer-instruction
    nvbugs: ["6448152", "6517760", "6549955"]
    commits: ["526c1e3229c0"]
    success_prs: [16634]
    severity: performance (all three ids)
    evidence: >
      Removed at maintainer instruction because the listed bugs were not yet
      fixed. Verified 2026-08-12: that holds for 2 of the 3 — 6448152 (GB300
      pp4 NIXL regression) and 6517760 (deepseek-r1 27-68%
      total-token-throughput regression) are both still open; only 6549955 is
      closed as verified, and PR #16634 (`526c1e3229c0`) is merged. So the
      case as written violated the cookbook's own admission rule by folding
      two OPEN bugs into a case whose Fix-mechanism bullet implied all three
      were closed by one PR.
    mechanism_kept_at: >
      nothing in-tree — the per-iteration PP rendezvous mechanism (an unguarded
      per-iter allgather added by `57bb6ee57a`, PR #15139) is described only in
      the removed file's git history and in the bug bodies.
    readd_if: >
      re-add scoped to 6549955 ALONE with success_prs [16634], not to the trio.
      Fold 6448152 / 6517760 back in only when each has its own merged fix —
      per the folding rule in SKILL.md, one root cause and one fix PR.

