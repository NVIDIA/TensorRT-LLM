# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit/
# In a PR, comment "@coderabbitai configuration" to view the resolved config.

language: "en-US"

reviews:
  profile: chill

  auto_title_placeholder: "@coderabbitai title"
  auto_title_instructions: >-
    Format: "[<category>] <title>". Category must be one of: fix, feat, doc,
    infra, style, refactor, perf, test, chore, revert. Enclose the category in
    square brackets. Keep the title concise (60 characters or fewer).
    Example: "[feat] Add logit_bias support".

  commit_status: false
  high_level_summary_instructions: |
    Produce two sections:

    **Dev Engineer Review**
    Correctness, performance, API consistency (CODING_GUIDELINES.md), error handling, regressions.

    **QA Engineer Review**
    Always include this section when any files under tests/ are touched.
    For test-list-only changes (only tests/integration/test_lists/ files):
      - List all modified test-list files, including waives.txt, and what entries were added or removed.
      - Review the list changes directly for valid test IDs, formatting, duplicates, and appropriate bug references.
      - CBTS touchmap coverage evidence is not applicable: these changes are handled directly by Tier 1
        path/diff rules, while the touchmap is used for residual source-code changes.
      - Verdict: "sufficient" or "insufficient" based on the correctness and intended scope of the list changes.
    For test-code changes (files outside tests/integration/test_lists/):
      - List test functions added, modified, or removed.
      - State whether each is covered in tests/integration/test_lists/ (test-db/ for CI, qa/ for manual QA).
      - Verdict: sufficient, insufficient, or needs follow-up.
    If no test files are touched, write "No test changes."
    Assess whether the changed code is covered by tests outside this PR
    (existing entries in tests/integration/test_lists/test-db/ for CI or
    tests/integration/test_lists/qa/ for manual QA).
    If no test files are modified, write "No test changes."
    When CBTS artifacts are available, the verdict must cite their results:
    "sufficient" only when the relevant coverage passes; otherwise "insufficient"
    with the failing or missing evidence identified.
    When CBTS artifacts are unavailable, use "needs follow-up".
    If no test files are touched, write "No test changes."

    For test-list-only changes (only tests/integration/test_lists/ files):
    - Report which test-db/ or qa/ files were modified and what entries were added or removed.
    - When CBTS artifacts are available: verdict is "sufficient" if coverage passes,
      "insufficient" with the failing or missing evidence identified otherwise.
    - When CBTS artifacts are unavailable: verdict is "needs follow-up".

    For test-code changes (tests/** excluding tests/integration/test_lists/):
    - List test functions added, modified, or removed.
    - State whether each is covered in test-db/ (CI) or qa/ (manual QA).
    - Apply the same CBTS-aware verdict logic above.

    Keep feedback actionable: reference concrete list file names when suggesting additions.
  walkthrough_instructions: |
    For each changed file, include a concise QA perspective:
    - For test-code files (tests/** excluding tests/integration/test_lists/**): note what
      the test covers and whether it is listed in tests/integration/test_lists/test-db/ (CI)
      or tests/integration/test_lists/qa/ (manual QA).
    - For source files: note any observable behavior changes a QA engineer should verify
      (new code paths, changed APIs, altered defaults, removed functionality).
    - For configuration files (e.g. .coderabbit.yaml, *.yml, *.yaml, *.json, *.toml):
      note any review or workflow behavior changes introduced by the config update.
    Keep each entry to 1-2 sentences; omit if no QA-relevant impact.
  collapse_walkthrough: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  poem: false
  review_status: false

  high_level_summary_instructions: |
