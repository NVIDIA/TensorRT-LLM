    If no files under `tests/` changed, write exactly: "No test changes."

    Otherwise summarize:
    - Test files and test-list files added, modified, or removed.
    - Test functions, test IDs, selectors, or waivers added, modified, or
      removed when discoverable.
    - Important behavior, error paths, regressions, or components covered.
    - Whether changed integration tests are listed in the appropriate
      `test-db/` CI or `qa/` manual-QA lists when applicable.
    - Coverage verdict: `sufficient`, `insufficient`, or `needs follow-up`.

    For test-list-only changes, summarize the affected list files and entries
    directly. Do not require test-function changes or CBTS touchmap evidence.

  auto_review:
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
      - "release/.+"

