    # Production-code coverage review. This is required because tests/** rules
    # do not run when a PR changes source code without changing a test file.
    - path: "tensorrt_llm/**"
      instructions: |
        Perform the normal production code review with the same rigor as if
        these test-coverage instructions were absent.

        Test coverage review is additive. It must not replace, downgrade, or
        suppress findings about correctness, API compatibility, error handling,
        performance, backward compatibility, resource safety, CUDA/GPU
        behavior, concurrency, distributed behavior, or security.

        Review TensorRT-LLM production-code changes for meaningful test
        coverage in addition to normal code review.

        For each new or materially changed observable behavior, determine
        whether this PR adds, updates, or clearly identifies an existing test
        that meaningfully exercises the change. Consider tests under tests/**,
        including unit, integration, distributed, and regression tests.

        Leave an INLINE review comment on the smallest relevant changed
        production-code hunk when a material test coverage gap exists. Do not
        put an actionable missing-test finding only in the summary.

        Flag material coverage gaps such as:
        - A new or changed validation rule, error path, fallback, retry,
          configuration option, API contract, serialization behavior, runtime
          behavior, scheduler behavior, quantization behavior, distributed
          behavior, or observable output with no meaningful test.
        - A bug fix without a practical regression test that would have failed
          before the fix.
        - Authentication, authorization, input validation, error propagation,
          or failure recovery changes covered only by a happy-path test.
        - A removed or weakened test that leaves changed behavior without an
          equivalent replacement or documented reason.

        For each inline finding:
        - Name the exact changed behavior that lacks coverage.
        - State the concrete failure or regression the missing test could miss.
        - Propose the smallest practical test scenario and likely test location.
        - Do not make vague comments such as "add more tests".

        Do not require tests for comments, documentation-only edits,
        formatting-only changes, generated artifacts, type-only changes,
        behavior-preserving renames/refactors, or dead-code removal when no
        observable behavior changes.

        Do not claim a coverage gap if existing tests clearly and meaningfully
        cover the changed behavior.

    # Test-code correctness review and test execution/list coverage review.
    - path: "tests/**"
      instructions: |
        Act as a QA engineer reviewing TensorRT-LLM test changes for test
        correctness, reliability, and meaningful behavior coverage.

        Always produce a concise test coverage summary, even if no issues are
        found. State:
        - Test files added, modified, or removed.
        - Test functions, parameterized test IDs, or cases added, modified, or
          removed when discoverable.
        - Behaviors, components, failure paths, or regressions covered.
        - Relevant test-list/execution coverage and any material gaps.
        - Coverage verdict: sufficient, insufficient, or needs follow-up.

        Leave INLINE review comments anchored to the smallest relevant changed
        line or hunk for every distinct, actionable test correctness or test
        coverage issue. Do not put actionable findings only in the summary.

        Add inline comments for:
        - Missing, incorrect, overly weak, or non-observable assertions.
        - Incorrect expected values or assertions that contradict the intended
          API contract, test name, docstring, parameterization, or comments.
        - Tests that can silently pass, including swallowed exceptions, bare
          `except: pass`, assertions in unreachable code, assertions scoped
          incorrectly, always-true conditions, disabled/skipped/xfail tests
          without adequate justification, or mocks that bypass the behavior
          purportedly under test.
        - Faulty setup/teardown, resource leaks, fixture contamination,
          un-restored environment variables, uncleaned temporary files,
          subprocesses, global/shared state, CUDA state, or distributed process
          groups.
        - Flaky patterns, including unseeded randomness, timing dependence,
          order dependence, arbitrary sleeps, polling without a bounded timeout,
          race-prone asynchronous execution, external-state dependence, or
          non-deterministic output/order assertions.
        - A test name, docstring, parameterization, comment, or test-list entry
          that does not match what the test actually validates.
        - A removed or weakened test that reduces meaningful coverage without an
          equivalent replacement or documented reason.
        - A modified test-list entry that does not correspond to a discoverable
          real test ID, parameterized test ID, or documented selector.

        For each inline finding:
        - Post one inline comment per distinct issue; do not combine unrelated
          issues into one comment.
        - Explain why the test can pass despite a defect or fail
          non-deterministically.
        - Identify the concrete behavior, failure mode, or regression that is
          untested or incorrectly tested.
        - Suggest the smallest practical correction or additional test case.
        - Do not force comments when no actionable issue exists.

        Test coverage principles:
        - Prefer behavior and contract coverage over raw line coverage.
        - Check normal behavior, meaningful boundaries, invalid inputs, error
          paths, recovery paths, and regression scenarios when relevant.
        - Prefer assertions on observable results and side effects over only
          verifying mock call counts or internal implementation details.
        - Do not require redundant tests for comments, formatting-only edits,
          generated files, behavior-preserving renames, or trivial refactors.
        - Do not claim a coverage gap unless the changed behavior is reasonably
          identifiable from the PR context.

        TensorRT-LLM-specific test checks:
        - Require explicit, precise capability gating for CUDA version, GPU
          architecture, GPU count, memory requirements, NCCL/distributed
          availability, external model availability, and optional dependencies.
          Do not accept broad skips that can mask unrelated failures.
        - For multi-GPU or distributed tests, check rank-safe setup/teardown,
          bounded synchronization and timeouts, and assertions on the intended
          rank(s).
        - For numerical tests, require tolerances appropriate to dtype,
          quantization mode, backend, and expected numerical variance. Flag
          tolerances broad enough to hide material regressions.
        - Distinguish correctness tests from benchmarks. Do not require fixed
          latency or throughput assertions unless the repository explicitly
          defines stable hardware-specific performance baselines.
        - Prefer deterministic local fixtures over network downloads, mutable
          external model artifacts, or shared machine state where practical.

        Special handling for test-list-only changes:
        If the PR touches ONLY files under tests/integration/test_lists/ and
        contains no test-code changes:
        - Report all modified test-list files, including waives.txt, and every
          entry, selector, test ID, or waiver added and removed.
        - Do NOT require changed test functions for this path.
        - Review list changes directly for valid test IDs/selectors, correct
          formatting, duplicate entries, intended tier/scope, and appropriate
          bug references.
        - CBTS touchmap coverage evidence is not applicable: test-list-only
          changes are handled directly by Tier 1 path/diff rules, while the
          touchmap is used for residual source-code changes.
        - Do NOT use verdict "needs follow-up" solely because
          cbts_touchmap.sqlite or a CBTS coverage report is unavailable. Use
          "sufficient" or "insufficient" based on the correctness and intended
          scope of the list changes.
        - For waiver additions, flag only when repository-required metadata is
          absent, such as a clear rationale, owner/bug reference, or expiration
          condition.

        For changes including test-code files outside
        tests/integration/test_lists/, the summary must include:
        1. Which test functions, parameterized test IDs, or cases were added,
           modified, or removed.
        2. Whether each changed integration test is listed in the appropriate
           test-list files under tests/integration/test_lists/: test-db/ for
           auto-run CI and qa/ for manually-triggered QA, when listing is
           expected by repository convention.
        3. A coverage verdict: sufficient, insufficient, or needs follow-up.
        4. Concrete test-list file names whenever suggesting additions.

