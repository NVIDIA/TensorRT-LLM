name: Check Test List
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  check-test-list:
    name: Check Test List
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # mpi4py needs libmpi at import time; the CI image ships one, this runner does not.
      - name: Install OpenMPI
        run: python -m pip install openmpi

      # Installs requirements-dev.txt itself, then collects L0, QA and waive entries
      # with pytest --co against stubbed bindings.
      - name: Check test lists
        env:
          LLM_ROOT: ${{ github.workspace }}
        run: python scripts/check_test_list.py --l0 --qa --waive
