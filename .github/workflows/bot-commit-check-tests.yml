name: Bot commit check tests
on:
  pull_request:
    paths:
      - '.github/scripts/bot_commit_check*'
      - '.github/workflows/bot-commit-check-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/bot_commit_check.test.js
