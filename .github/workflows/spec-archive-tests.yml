name: Spec archive removal regressions
on:
  pull_request:
    paths:
      - .github/scripts/remove_ready_specs.js
      - .github/scripts/spec_archive/**
      - .github/scripts/spec_archive.test.js
      - .github/workflows/spec-archive-tests.yml
  push:
    paths:
      - .github/scripts/remove_ready_specs.js
      - .github/scripts/spec_archive/**
      - .github/scripts/spec_archive.test.js
      - .github/workflows/spec-archive-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: node .github/scripts/spec_archive.test.js
