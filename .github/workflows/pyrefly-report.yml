# Publishes the result of pyrefly-check.yml to one review thread per PR. This workflow holds
# write permissions, so it runs only default-branch code and reads the scan artifact as
# data. Never check out or execute PR code here.
name: Publish Pyrefly report

on:
  workflow_run:
    workflows: [Pyrefly type check]
    types: [completed]

permissions:
  actions: read
  pull-requests: write
  # GitHub lets an app resolve or reopen a review thread only with write access to contents.
  contents: write

concurrency:
  group: pyrefly-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
  queue: max

jobs:
  report:
    # A run that could not finish the check fails, and still uploads a report that says why.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Fails when the run stopped before it could write a report. The PR already shows
      # that run as a failed check.
      - uses: actions/download-artifact@v8
        with:
          name: pyrefly-diff-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pyrefly-diff
      - uses: actions/github-script@v8
        env:
          REPORT_PATH: ${{ runner.temp }}/pyrefly-diff/report.json
        with:
          script: |
            const {readFileSync, statSync} = require('node:fs');
            const {publish} = require('./.github/scripts/pyrefly_report.js');
            if (statSync(process.env.REPORT_PATH).size > 10 * 1024 * 1024) {
              throw new Error('Pyrefly report exceeds 10 MiB.');
            }
            const report = JSON.parse(readFileSync(process.env.REPORT_PATH, 'utf8'));
            await publish({github, context, core, report});
