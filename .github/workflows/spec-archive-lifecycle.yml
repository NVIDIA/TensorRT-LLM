# Install in the TARGET repository after vendoring the trusted tools as described
# in ci/README.md. The removal migration patch already archives at the CAS gate.
name: Archive spec snapshots
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: spec-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  archive:
    if: vars.SPEC_ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Never use the source head or any PR-provided ref in this checkout.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/spec_archive
          persist-credentials: false
      - name: Archive or reconcile lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPEC_GITHUB_TOKEN: ${{ secrets.SPEC_ARCHIVE_SOURCE_TOKEN }}
          ARTIFACTORY_URL: ${{ vars.SPEC_ARTIFACTORY_URL }}
          ARTIFACTORY_REPOSITORY: ${{ vars.SPEC_ARTIFACTORY_REPOSITORY }}
          ARTIFACTORY_TOKEN: ${{ secrets.SPEC_ARCHIVE_WRITE_TOKEN }}
          SPEC_ARCHIVE_CORE: .github/scripts/spec_archive/git-spec
        run: python3 .github/scripts/spec_archive/ci_archive.py event --provider github
