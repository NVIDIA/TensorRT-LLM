name: CodeRabbit Semantic Conflict Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, edited, auto_merge_enabled]
  push:
    branches: [main]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Open PR number to recheck (requires ai: semantic-conflict label)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  request-review:
    name: Request advisory semantic review
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: write
    if: >-
      github.repository == 'NVIDIA/TensorRT-LLM' &&
      github.event_name != 'issue_comment' &&
      (github.event_name != 'pull_request_target' ||
       contains(github.event.pull_request.labels.*.name, 'ai: semantic-conflict'))
    # Automatic runs sweep opted-in PRs so coalesced events are not lost.
    # Manual retries have their own group and cannot replace a pending sweep.
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('coderabbit-semantic-retry-{0}', inputs.pull_number) || 'coderabbit-semantic-conflict-requests' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # API-only trusted workflow code; no repository checkout is needed.
      - name: Request CodeRabbit checks for the current SHA pair
        uses: actions/github-script@v8
        env:
          DISPATCH_PULL_NUMBER: ${{ inputs.pull_number }}
        with:
          script: |
            const LABEL = 'ai: semantic-conflict';
            const BOT = 'github-actions[bot]';

            const pullNumber = process.env.DISPATCH_PULL_NUMBER;
            const repo = context.repo;
            let retryNumber;
            if (context.eventName === 'workflow_dispatch') {
              const raw = (pullNumber || '').trim();
              retryNumber = Number(raw);
              if (!/^[1-9][0-9]*$/.test(raw) || !Number.isSafeInteger(retryNumber)) {
                throw new Error('pull_number must be a positive integer');
              }
            } else if (!['push', 'pull_request_target'].includes(context.eventName)) {
              throw new Error(`Unsupported event: ${context.eventName}`);
            }
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...repo, state: 'open', base: 'main', per_page: 100,
            });
            const numbers = pulls.filter(pr => !pr.draft && pr.labels.some(l => l.name === LABEL))
              .map(pr => pr.number).filter(number => !retryNumber || number === retryNumber);
            let retryPosted = false;

            for (const number of numbers) {
              // Read current metadata instead of trusting a possibly queued event payload.
              const {data: pr} = await github.rest.pulls.get({...repo, pull_number: number});
              if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                  !pr.labels.some(l => l.name === LABEL)) {
                core.info(`PR #${number}: not an open, non-draft, opted-in main PR; skipped.`);
                continue;
              }
              const {data: ref} = await github.rest.git.getRef({...repo, ref: 'heads/main'});
              const head = pr.head.sha;
              const base = ref.object.sha;
              const marker = `<!-- coderabbit-semantic-request:${number}:${head}:${base} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: number, per_page: 100,
              });
              // Only our own bot's comments can suppress an automatic request. A manual
              // dispatch always retries, including after a CodeRabbit timeout or failure.
              if (number !== retryNumber && comments.some(comment =>
                comment.user?.login === BOT && comment.body?.includes(marker))) {
                core.info(`PR #${number}: this SHA pair has already been requested.`);
                continue;
              }
              // A posted request is not a semantic pass. Keep a neutral check
              // until a matching, verified CodeRabbit result arrives.
              await github.rest.checks.create({
                ...repo,
                name: 'Semantic conflict with target branch',
                head_sha: head,
                external_id: `semantic-conflict:${number}:${head}:${base}`,
                status: 'completed',
                conclusion: 'neutral',
                output: {
                  title: 'Awaiting CodeRabbit analysis',
                  summary: `No AI verdict yet for PR #${number}, head ${head} + main ${base}. ` +
                    'This advisory check does not block merging.',
                },
              });
              const body = [
                '@coderabbitai run pre-merge checks',
                '',
                marker,
                `Semantic compatibility review requested for PR head \`${head}\` and main \`${base}\`.`,
                'Run the configured "Semantic conflict with target branch" check against these revisions.',
                'Verify both live refs. If either differs or cannot be inspected, return Inconclusive.',
                'Report the actual head, target, and merge-base SHAs with the analysis.',
                '',
                'This is an advisory request, not a passing check. Previous results for a different',
                'SHA pair are stale; a successful workflow only means the request was posted.',
              ].join('\n');
              const {data: comment} = await github.rest.issues.createComment({
                ...repo, issue_number: number, body,
              });
              if (number === retryNumber) retryPosted = true;
              core.info(`PR #${number}: requested ${head} + ${base}: ${comment.html_url}`);
              await core.summary.addRaw(
                `PR #${number}: [requested CodeRabbit analysis](${comment.html_url}) for ` +
                `head \`${head}\` + main \`${base}\`. No AI verdict is asserted.\n\n`
              ).write();
            }
            if (retryNumber && !retryPosted) {
              throw new Error(`PR #${retryNumber}: retry not posted; requires an open, non-draft main PR with the ${LABEL} label.`);
            }

  publish-result:
    name: Publish advisory semantic result
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: write
    if: >-
      github.repository == 'NVIDIA/TensorRT-LLM' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'coderabbitai[bot]' &&
      contains(github.event.comment.body, 'Semantic conflict with target branch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read comments as data. Never checkout or execute PR code with this token.
      - name: Publish a result only for the current requested revision pair
        uses: actions/github-script@v8
        with:
          script: |
            const name = 'Semantic conflict with target branch';
            const repo = context.repo;
            const number = context.payload.issue.number;
            const {data: comment} = await github.rest.issues.getComment({
              ...repo, comment_id: context.payload.comment.id,
            });
            const body = comment.body || '';
            if (comment.user?.login !== 'coderabbitai[bot]' || comment.user?.type !== 'Bot') return;
            if (!body.includes('<!-- pre-merge-checks-results -->') &&
                !body.includes('<!-- pre_merge_checks_walkthrough_start -->')) return;
            const row = body.split('\n').map(line => line.split('|').map(cell => cell.trim()))
              .find(cells => cells[1]?.toLowerCase() === name.toLowerCase());
            if (!row) return;
            const details = body.match(/<summary>Full details: Semantic conflict with target branch<\/summary>([\s\S]*?)<\/details>/i);
            const result = details ? details[1] : row.join('|');

            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: number});
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                !pr.labels.some(label => label.name === 'ai: semantic-conflict')) return;
            const {data: ref} = await github.rest.git.getRef({...repo, ref: 'heads/main'});
            const head = pr.head.sha;
            const base = ref.object.sha;
            const checks = await github.paginate(github.rest.checks.listForRef, {
              ...repo, ref: head, check_name: name, filter: 'all', per_page: 100,
            });
            const check = checks.filter(check => check.app?.slug === 'github-actions' &&
              check.external_id === `semantic-conflict:${number}:${head}:${base}`)
              .sort((a, b) => b.id - a.id)[0];
            if (!check) return; // Includes unrelated manual fixture evaluations.

            const pattern = /SEMANTIC_RESULT head=([a-f0-9]{40}) target=([a-f0-9]{40}) merge_base=([a-f0-9]{40}) verdict=(PASS|FAIL|INCONCLUSIVE)\b/g;
            const records = [...new Set([...result.matchAll(pattern)].map(match => match[0]))];
            let verdict = 'INCONCLUSIVE';
            let reason = 'The result has no unique, verifiable revision record.';
            if (records.length === 1) {
              const [, reportedHead, reportedBase, mergeBase, reportedVerdict] =
                [...records[0].matchAll(pattern)][0];
              // A stale comment must never overwrite the current revision's result.
              if (reportedHead !== head || reportedBase !== base) return;
              const {data: comparison} = await github.request(
                'GET /repos/{owner}/{repo}/compare/{basehead}',
                {...repo, basehead: `${base}...${head}`});
              const expectedStatus = {PASS: /Passed/i, FAIL: /Warning|Error/i, INCONCLUSIVE: /Inconclusive/i};
              if (comparison.merge_base_commit?.sha === mergeBase && expectedStatus[reportedVerdict].test(row[2])) {
                verdict = reportedVerdict;
                reason = `Verified head ${head}, target ${base}, merge base ${mergeBase}.`;
              } else {
                reason = 'The reported verdict or merge base could not be verified.';
              }
            }
            // Recheck refs after fetching the result and history.
            const {data: current} = await github.rest.pulls.get({...repo, pull_number: number});
            const {data: currentRef} = await github.rest.git.getRef({...repo, ref: 'heads/main'});
            if (current.head.sha !== head || currentRef.object.sha !== base ||
                current.state !== 'open' || current.draft || current.base.ref !== 'main' ||
                !current.labels.some(label => label.name === 'ai: semantic-conflict')) return;
            const titles = {
              PASS: 'No semantic conflict found (best effort)',
              FAIL: '⚠️ Possible semantic conflict',
              INCONCLUSIVE: '⚠️ Semantic analysis inconclusive',
            };
            await github.rest.checks.update({
              ...repo, check_run_id: check.id, status: 'completed',
              conclusion: verdict === 'PASS' ? 'success' : 'neutral',
              details_url: comment.html_url,
              output: {
                title: titles[verdict],
                summary: `${reason}\n\n[CodeRabbit analysis](${comment.html_url})\n\n` +
                  'Advisory only; applies to this SHA pair and does not prove compatibility.',
              },
            });
            if (verdict !== 'PASS') core.warning(`${titles[verdict]}: ${comment.html_url}`);
            await core.summary.addRaw(`${titles[verdict]}: [CodeRabbit analysis](${comment.html_url})\n`).write();
