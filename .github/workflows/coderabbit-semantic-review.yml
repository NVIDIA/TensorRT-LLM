name: CodeRabbit Semantic Conflict Review

on:
  pull_request_target:
    branches: [main, 'release/**']
    types: [opened, reopened, synchronize, ready_for_review, labeled, edited, auto_merge_enabled, closed]
  schedule:
    - cron: '23 * * * *'
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Main/release PR to recheck; merged PRs receive a post-merge audit'
        required: true
        type: string

permissions:
  contents: read

jobs:
  request-review:
    name: Request advisory semantic review or audit
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: write
    if: >-
      github.repository == 'NVIDIA/TensorRT-LLM' &&
      contains(fromJSON('["schedule", "pull_request_target", "workflow_dispatch"]'), github.event_name) &&
      (github.event.action != 'closed' || github.event.pull_request.merged) &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci: full pre-merge approved')
    # Requests and publications share a queue: hourly scans cannot race PR events.
    # ponytail: one queue, 100 pending; use per-PR dispatch if scans delay events.
    concurrency:
      group: coderabbit-semantic-state
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Always execute the default branch's trusted code, including release events.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            /.coderabbit.yaml
            /.github/scripts/coderabbit_semantic_review*.js
          sparse-checkout-cone-mode: false
      - name: Verify approval-label author using the existing approver team
        id: approval
        if: github.event.action == 'labeled'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.TRTLLM_AGENT_SHARED_TOKEN }}
          result-encoding: string
          script: |
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            if (!pr.labels.some(l => l.name === 'ci: full pre-merge approved')) return false;
            const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const latest = events.filter(e => e.event === 'labeled' &&
              e.label?.name === 'ci: full pre-merge approved').at(-1);
            if (!latest?.actor?.login || latest.actor.login !== context.payload.sender?.login) return false;
            try {
              const {data} = await github.rest.teams.getMembershipForUser({
                org: 'NVIDIA', team_slug: 'trt-llm-ci-approvers', username: latest.actor.login,
              });
              return data.state === 'active';
            } catch (error) {
              if (![403, 404].includes(error.status)) throw error;
              core.warning('The approval-label author could not be verified; no immediate AI request.');
              return false;
            }
      - name: Apply the threshold, cooldown and audit policy
        if: github.event.action != 'labeled' || steps.approval.outputs.result == 'true'
        uses: actions/github-script@v8
        env:
          DISPATCH_PULL_NUMBER: ${{ inputs.pull_number }}
          SEMANTIC_APPROVAL_VALIDATED: ${{ steps.approval.outputs.result }}
        with:
          script: |
            const request = require('./.github/scripts/coderabbit_semantic_review_request.js');
            await request({github, context, core});

  publish-result:
    name: Publish advisory semantic result
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: write
    if: >-
      github.repository == 'NVIDIA/TensorRT-LLM' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'coderabbitai[bot]' &&
      (contains(github.event.comment.body, 'pre-merge-checks-results') ||
       contains(github.event.comment.body, 'pre_merge_checks_walkthrough_start'))
    concurrency:
      group: coderabbit-semantic-state
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/coderabbit_semantic_review_result.js
          sparse-checkout-cone-mode: false
      - name: Verify the requested revisions and publish the advisory verdict
        uses: actions/github-script@v8
        with:
          script: |
            const publish = require('./.github/scripts/coderabbit_semantic_review_result.js');
            await publish({github, context, core});
