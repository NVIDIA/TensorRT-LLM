name: auto-assign
on:
  issues:
    types:
      - labeled

permissions:
  contents: read
  issues: write

jobs:
  assign_issue:
    # Only run on module label colors.
    if: ${{ github.event.label.color == '00611d' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get assignee
        uses: actions/github-script@v8
        id: get-assignee
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('.github/workflows/module-owners.json', 'utf8'));
            const labelName = context.payload.label?.name;
            if (labelName && Object.hasOwn(config, labelName)) {
              const users = config[labelName];
              if (Array.isArray(users) && users.length > 0) {
                const index = Math.floor(Math.random() * users.length);
                return users[index];
              }
            }
            return '';
          result-encoding: string

      - name: Assign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ steps.get-assignee.outputs.result }}
        run: |
          set -euo pipefail
          args=(--add-label "triaged" --add-label "investigating")
          if [ -n "${ASSIGNEE}" ]; then
            args+=(--add-assignee "${ASSIGNEE}")
          fi
          gh issue edit "${ISSUE_NUMBER}" "${args[@]}"
