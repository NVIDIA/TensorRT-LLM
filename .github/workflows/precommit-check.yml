name: Release Checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'commit sha to check'
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  precommit-check:
    name: Pre-commit Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Test stale pull request cleanup workflow
        run: node .github/scripts/cleanup_stale_prs.test.js

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed_files.txt
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename | @json' \
            | python3 -c '
          import json, os, sys

          files = [json.loads(line) for line in sys.stdin if line.strip()]
          print(f"Changed file count from API: {len(files)}")
          unsafe = any(
              not isinstance(f, str) or not f or f != f.strip() or "\n" in f or "\r" in f
              for f in files
          )
          # GitHub PR Files API caps out at 3000 entries; also fall back when any
          # path has line breaks or leading/trailing whitespace that line-based
          # --files-from cannot preserve.
          use_files_from = (not unsafe) and 0 < len(files) < 2500
          if use_files_from:
              with open(os.environ["CHANGED_FILES_PATH"], "w", encoding="utf-8", newline="\n") as fh:
                  fh.write("\n".join(files) + "\n")
          elif unsafe:
              print("Detected path with line breaks or leading/trailing whitespace; falling back to full check.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"use_files_from={str(use_files_from).lower()}\n")
          '

      - name: Run pre-commit checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          USE_FILES_FROM: ${{ steps.changed-files.outputs.use_files_from }}
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed_files.txt
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${USE_FILES_FROM}" = "true" ]; then
            python3 -u scripts/release_check.py --files-from "${CHANGED_FILES_PATH}"
          else
            python3 -u scripts/release_check.py
          fi
