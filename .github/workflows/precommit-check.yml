name: Release Checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'commit sha to check'
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  precommit-check:
    name: Pre-commit Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Test stale pull request cleanup workflow
        run: node .github/scripts/cleanup_stale_prs.test.js

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed_files.txt
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename' > "${CHANGED_FILES_PATH}"
          count=$(awk 'NF' "${CHANGED_FILES_PATH}" | wc -l | tr -d ' ')
          echo "Changed file count from API: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Run pre-commit checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES_COUNT: ${{ steps.changed-files.outputs.count }}
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed_files.txt
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ] &&
             [ -n "${CHANGED_FILES_COUNT}" ] &&
             [ "${CHANGED_FILES_COUNT}" -gt 0 ] &&
             [ "${CHANGED_FILES_COUNT}" -lt 2500 ]; then
            # GitHub's PR Files API caps out at 3000 entries, silently truncating the
            # list for huge PRs. Fail closed with a 2500 margin below that cap.
            python3 -u scripts/release_check.py --files-from "${CHANGED_FILES_PATH}"
          else
            python3 -u scripts/release_check.py
          fi
