# Runs the Pyrefly type check on two trees: the tip of the target branch, and that tip
# with the PR head temporarily merged in. Uploads the type errors that exist only in
# the merged tree. Type errors do not fail the job; the job fails only when the check
# itself cannot finish (merge conflict, dependency install failure, scan failure or
# timeout). This workflow runs PR code, so it holds no write permission;
# pyrefly-report.yml publishes the result.
name: Pyrefly type check

on:
  pull_request:
    # `edited` is needed for a change of target branch; the job condition drops other edits.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    # Job level: a run whose job is skipped (a title or description edit) never joins the
    # group, so it cannot cancel a check in progress.
    concurrency:
      group: pyrefly-diff-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # actions/checkout skips LFS only for its own git commands.
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      # The work directories live outside the checkout. Job-level `env` cannot read
      # `runner.temp`, and upload-artifact rejects a path that contains `..`.
      - name: Set work directories
        run: |
          {
            echo "PYREFLY_BASE_ROOT=$RUNNER_TEMP/pyrefly-base"
            echo "PYREFLY_MERGED_ROOT=$RUNNER_TEMP/pyrefly-merged"
            echo "PYREFLY_REPORT_DIR=$RUNNER_TEMP/pyrefly-diff"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          # The merge needs full history; file contents are fetched only when used.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare target branch and merged PR
        id: prepare
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$PYREFLY_REPORT_DIR"
          git fetch --no-tags origin "refs/heads/$BASE_REF"
          base_sha=$(git rev-parse FETCH_HEAD)
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$PYREFLY_BASE_ROOT" "$base_sha"
          git worktree add --detach "$PYREFLY_MERGED_ROOT" "$base_sha"
          git -C "$PYREFLY_MERGED_ROOT" -c user.name=Pyrefly -c user.email=pyrefly@localhost \
            merge --no-commit --no-ff "$HEAD_SHA"
          git -C "$PYREFLY_MERGED_ROOT" diff --cached --name-status --find-renames -z "$base_sha" -- \
            > "$PYREFLY_REPORT_DIR/changes"
          # Both scans use the target branch's Pyrefly configuration and wrapper scripts.
          git -C "$PYREFLY_MERGED_ROOT" restore --source "$base_sha" --worktree -- pyproject.toml scripts
      - name: Install target branch dependencies
        id: install
        timeout-minutes: 15
        working-directory: ${{ env.PYREFLY_BASE_ROOT }}
        # Without the project dependencies every third-party import is a diagnostic.
        # requirements-dev.txt also pins Pyrefly. The CUDA wheels are large, so keep no
        # second copy of them in the pip cache.
        run: python3 -m pip install --no-cache-dir -r requirements-dev.txt
      - name: Check target branch
        id: base_check
        timeout-minutes: 5
        working-directory: ${{ env.PYREFLY_BASE_ROOT }}
        env:
          PYREFLY_REPORT_PATH: ${{ env.PYREFLY_REPORT_DIR }}/base.json
        run: bash scripts/run_pyrefly.sh --full-project
      - name: Check merged PR
        id: merged_check
        timeout-minutes: 5
        working-directory: ${{ env.PYREFLY_MERGED_ROOT }}
        env:
          PYREFLY_REPORT_PATH: ${{ env.PYREFLY_REPORT_DIR }}/merged.json
        run: bash scripts/run_pyrefly.sh --full-project
      # Runs after a failed step too, to record why the check is incomplete. The publisher
      # needs that record to update an existing report.
      - name: Compare diagnostics
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          CHECK_ERROR: >-
            ${{ steps.prepare.outcome != 'success' && 'Could not merge the PR into the current target branch. See workflow logs.' ||
                steps.install.outcome != 'success' && 'Could not install the target branch dependencies. See workflow logs.' ||
                steps.base_check.outcome != 'success' && 'The target branch check did not complete. See workflow logs.' ||
                steps.merged_check.outcome != 'success' && 'The merged PR check did not complete. See workflow logs.' || '' }}
        run: |
          python3 .github/scripts/pyrefly_diff.py \
            --base-root "$PYREFLY_BASE_ROOT" --merged-root "$PYREFLY_MERGED_ROOT" \
            --base-sha "$BASE_SHA" --output "$PYREFLY_REPORT_DIR" --error "$CHECK_ERROR"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pyrefly-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PYREFLY_REPORT_DIR }}/*.json
          if-no-files-found: error
          retention-days: 14
