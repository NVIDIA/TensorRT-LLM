name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-pr-title:
    name: Check PR Title Format
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Format
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request?.title ?? '';
            const pattern = /^(\[(None|[A-Z0-9]+-[0-9]+|#[0-9]+|https:\/\/nvbugs\/[0-9]+)\]) *(\[[a-z0-9]+\]) (([^ ].*)?[^ ])$/;
            if (pattern.test(title)) {
              core.info(`PR title format is valid: ${title}`);
              return;
            }
            core.info([
              'Expected PR title format:',
              '  [JIRA ticket/NVBugs ID/GitHub issue/None][type] Summary',
              '',
              'Valid ticket formats:',
              '  - JIRA ticket: [TRTLLM-1234] or [FOOBAR-123] for other FOOBAR project',
              '  - NVBugs ID: [https://nvbugs/1234567]',
              '  - GitHub issue: [#1234]',
              '  - No ticket: [None]',
              '',
              'Valid types (lowercase): [fix], [feat], [doc], [infra], [chore], etc.',
              '',
              'Examples:',
              '  - [TRTLLM-1234][feat] Add new feature',
              '  - [https://nvbugs/1234567][fix] Fix some bugs',
              '  - [#1234][doc] Update documentation',
              '  - [None][chore] Minor clean-up',
            ].join('\n'));
            core.setFailed(`PR title format check failed: ${title}`);

  check-pr-body-checklist:
    name: Check PR Checklist Resolution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Validate PR Checklist
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          ENFORCE_PR_HAS_CHECKLIST: false
        run: python .github/scripts/pr_checklist_check.py
