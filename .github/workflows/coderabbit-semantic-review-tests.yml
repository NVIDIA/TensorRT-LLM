name: CodeRabbit Semantic Review Tests

on:
  pull_request:
    paths:
      - '.github/workflows/coderabbit-semantic-review*.yml'
      - '.github/scripts/coderabbit_semantic_review*.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Semantic review workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test semantic review automation
        run: node --test .github/scripts/coderabbit_semantic_review.test.js
