name: CodeRabbit Semantic Review Preview

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - '.coderabbit.yaml'
      - '.github/workflows/coderabbit-semantic-review*.yml'
      - '.github/scripts/coderabbit_semantic_review*.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Automation tests and result lookup (not AI approval)
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      verdict: ${{ steps.result.outputs.verdict }}
      summary: ${{ steps.result.outputs.summary }}
      message: ${{ steps.result.outputs.message }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test semantic review automation
        run: node --test .github/scripts/coderabbit_semantic_review.test.js
      - name: Read CodeRabbit verdict for the current PR and target branch
        id: result
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const readResult = require('./.github/scripts/coderabbit_semantic_review_result.js');
            await readResult({github, context, core});

  verdict:
    name: AI verdict (advisory; skipped = unavailable)
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["PASS", "FAIL"]'), needs.test.outputs.verdict)
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Display the verified AI verdict
        uses: actions/github-script@v8
        env:
          SEMANTIC_VERDICT: ${{ needs.test.outputs.verdict }}
          SEMANTIC_SUMMARY: ${{ needs.test.outputs.summary }}
          SEMANTIC_MESSAGE: ${{ needs.test.outputs.message }}
        with:
          script: |
            await core.summary.addRaw(process.env.SEMANTIC_SUMMARY).write();
            if (process.env.SEMANTIC_VERDICT === 'FAIL') {
              core.setFailed(process.env.SEMANTIC_MESSAGE);
            }
