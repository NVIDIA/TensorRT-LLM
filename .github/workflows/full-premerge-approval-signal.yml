name: Full Pre-Merge Approval Signal
run-name: "Full approval re-check for PR #${{ github.event.pull_request.number }}"

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

jobs:
  evaluate-full-approval:
    if: >-
      github.repository == 'NVIDIA/TensorRT-LLM' &&
      (github.event.action == 'dismissed' ||
       github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    steps:
      - name: Publish approval candidate
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          SIGNAL_PATH: ${{ runner.temp }}/full-premerge-approval/pr-number.txt
        with:
          retries: 2
          script: |
            const { mkdir, writeFile } = require('node:fs/promises');
            const { dirname } = require('node:path');

            const pullNumber = context.payload.pull_request?.number;
            if (!Number.isSafeInteger(pullNumber)) {
              core.warning('The review event does not contain a valid pull request number.');
              return;
            }

            await mkdir(dirname(process.env.SIGNAL_PATH), { recursive: true });
            await writeFile(process.env.SIGNAL_PATH, `${pullNumber}\n`, 'utf8');

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewDecision
                    state
                  }
                }
              }
            `;

            try {
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: pullNumber,
              });
              const pullRequest = result.repository?.pullRequest;
              if (!pullRequest || pullRequest.state !== 'OPEN') {
                console.log(`PR #${pullNumber} is not open.`);
                return;
              }
              if (pullRequest.reviewDecision === 'APPROVED') {
                console.log(`PR #${pullNumber} is fully approved.`);
                return;
              }

              let requests = [];
              try {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/pulls/{pull_number}/requested_reviewers',
                  { ...context.repo, pull_number: pullNumber }
                );
                requests = [
                  ...response.data.users.map((user) => `user \`${user.login}\``),
                  ...response.data.teams.map(
                    (team) => `team \`${context.repo.owner}/${team.slug}\``
                  ),
                ];
              } catch (error) {
                core.warning(`Could not read outstanding review requests: ${error.message}`);
              }
              const detail = requests.length > 0
                ? `Outstanding review requests: ${requests.join(', ')}.`
                : 'No specific outstanding user or team review request is currently visible.';
              const summary =
                `PR #${pullNumber} is not fully approved (reviewDecision: ` +
                `\`${pullRequest.reviewDecision || 'NOT_AVAILABLE'}\`).\n\n${detail}\n\n` +
                'GitHub reviewDecision remains authoritative; branch protection, rulesets, ' +
                'CODEOWNERS, or a blocking review may impose additional requirements.';
              core.notice(summary.replaceAll('\n', ' '));
              await core.summary
                .addHeading('Full pre-merge approval is still required')
                .addRaw(summary)
                .write();
            } catch (error) {
              core.warning(`Could not report approval details for PR #${pullNumber}: ${error.message}`);
            }

      - name: Upload full approval signal
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: full-premerge-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-premerge-approval/pr-number.txt
          if-no-files-found: ignore
          retention-days: 1
