name: Clean Up Stale Pull Requests

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report actions without commenting on or closing pull requests
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cleanup-stale-prs:
    if: github.repository == 'NVIDIA/TensorRT-LLM'
    concurrency:
      group: cleanup-stale-prs
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Process stale pull requests
        uses: actions/github-script@v8
        with:
          script: |
            const PING_AFTER_DAYS = 120;
            const CLOSE_AFTER_DAYS = 180;
            const MAX_ACTIONS_PER_RUN = 50;
            const DAY_IN_MS = 24 * 60 * 60 * 1000;
            const dryRun =
              context.eventName === 'workflow_dispatch' &&
              '${{ inputs.dry_run }}' === 'true';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = Date.now();
            const searchCutoff = new Date(
              now - PING_AFTER_DAYS * DAY_IN_MS
            ).toISOString().slice(0, 10);

            const searchQuery = `
              query($query: String!, $cursor: String) {
                search(query: $query, type: ISSUE, first: 100, after: $cursor) {
                  nodes {
                    ... on PullRequest {
                      number
                    }
                  }
                  pageInfo {
                    endCursor
                    hasNextPage
                  }
                }
              }
            `;
            const pullRequestQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    author {
                      login
                    }
                    mergeable
                    number
                    reviewDecision
                    state
                    updatedAt
                    url
                  }
                }
              }
            `;

            const candidates = [];
            let cursor = null;
            do {
              const result = await github.graphql(searchQuery, {
                query:
                  `repo:${owner}/${repo} is:pr is:open ` +
                  `updated:<${searchCutoff} sort:updated-asc`,
                cursor,
              });
              candidates.push(...result.search.nodes);
              cursor = result.search.pageInfo.hasNextPage
                ? result.search.pageInfo.endCursor
                : null;
            } while (cursor);

            let actionCount = 0;
            let closeCount = 0;
            let pingCount = 0;
            let skipCount = 0;

            for (const candidate of candidates) {
              if (actionCount >= MAX_ACTIONS_PER_RUN) {
                core.warning(
                  `Reached the ${MAX_ACTIONS_PER_RUN}-action safety limit; ` +
                    'remaining pull requests will be considered on the next run.'
                );
                break;
              }

              // Re-read mutable state immediately before acting. This prevents a
              // comment or push made during the run from being treated as stale.
              const result = await github.graphql(pullRequestQuery, {
                owner,
                repo,
                number: candidate.number,
              });
              const pullRequest = result.repository.pullRequest;
              if (!pullRequest || pullRequest.state !== 'OPEN') {
                skipCount += 1;
                continue;
              }

              const idleDays = (now - Date.parse(pullRequest.updatedAt)) / DAY_IN_MS;
              const hasConflicts = pullRequest.mergeable === 'CONFLICTING';
              const isClean = pullRequest.mergeable === 'MERGEABLE';
              const isApproved = pullRequest.reviewDecision === 'APPROVED';

              if (idleDays > CLOSE_AFTER_DAYS && hasConflicts) {
                const body =
                  'This pull request has been automatically closed because it ' +
                  `has had no activity for more than ${CLOSE_AFTER_DAYS} days ` +
                  'and currently has merge conflicts. If the work is still ' +
                  'relevant, please reopen it after resolving the conflicts or ' +
                  'open a new pull request.';
                console.log(
                  `${dryRun ? '[dry run] Would close' : 'Closing'} ` +
                    `${pullRequest.url} (${idleDays.toFixed(1)} idle days).`
                );
                if (!dryRun) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pullRequest.number,
                    body,
                  });
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: pullRequest.number,
                    state: 'closed',
                  });
                }
                actionCount += 1;
                closeCount += 1;
                continue;
              }

              if (
                idleDays > PING_AFTER_DAYS &&
                (isClean || isApproved) &&
                pullRequest.author?.login
              ) {
                const status =
                  isClean && isApproved
                    ? 'approved and mergeable'
                    : isApproved
                      ? 'approved'
                      : 'mergeable';
                const body =
                  `@${pullRequest.author.login} this pull request has had no ` +
                  `activity for more than ${PING_AFTER_DAYS} days and is ` +
                  `currently ${status}. Is it still active? Please post an ` +
                  'update when you can.';
                console.log(
                  `${dryRun ? '[dry run] Would ping' : 'Pinging'} ` +
                    `${pullRequest.url} (${idleDays.toFixed(1)} idle days, ${status}).`
                );
                if (!dryRun) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pullRequest.number,
                    body,
                  });
                }
                actionCount += 1;
                pingCount += 1;
                continue;
              }

              if (pullRequest.mergeable === 'UNKNOWN') {
                core.warning(
                  `Skipping ${pullRequest.url}: GitHub has not computed mergeability.`
                );
              }
              skipCount += 1;
            }

            const mode = dryRun ? 'Dry run' : 'Run';
            await core.summary
              .addHeading('Stale pull request cleanup')
              .addTable([
                [
                  { data: 'Mode', header: true },
                  { data: 'Closed', header: true },
                  { data: 'Pinged', header: true },
                  { data: 'Skipped', header: true },
                ],
                [mode, String(closeCount), String(pingCount), String(skipCount)],
              ])
              .write();
