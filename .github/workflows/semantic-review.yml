name: Semantic conflict review
on:
  schedule:
    - cron: '23 */2 * * *'
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Open main/release PR to check, including drafts and already requested revisions'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'schedule' && 'semantic-review-scan' || format('semantic-review-run-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    name: Select PRs for semantic analysis
    if: >-
      github.repository == 'NVIDIA/TensorRT-LLM' &&
      contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      numbers: ${{ steps.select.outputs.numbers }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
      - id: select
        uses: actions/github-script@v8
        env:
          INPUT_PULL_NUMBER: ${{ inputs.pull_number }}
        with:
          script: |
            const {discover} = require('./.github/scripts/semantic_review_request.js');
            const result = await discover({github, context, core});
            core.setOutput('numbers', JSON.stringify(result.numbers));

  request:
    name: 'Request analysis for PR #${{ matrix.number }}'
    needs: discover
    if: >-
      !cancelled() && needs.discover.outputs.numbers != '' &&
      needs.discover.outputs.numbers != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        number: ${{ fromJSON(needs.discover.outputs.numbers) }}
    concurrency:
      group: semantic-review-pr-${{ matrix.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/semantic-review-prompt.md
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v8
        env:
          PULL_NUMBER: ${{ matrix.number }}
          SEMANTIC_COMMAND_TOKEN: ${{ secrets.TRTLLM_AGENT_SHARED_TOKEN }}
        with:
          script: |
            const {run} = require('./.github/scripts/semantic_review_request.js');
            if (!process.env.SEMANTIC_COMMAND_TOKEN) throw new Error('Missing semantic command token.');
            const commandGithub = new github.constructor({
              auth: process.env.SEMANTIC_COMMAND_TOKEN, retry: {enabled: false},
            });
            await run({github, commandGithub, context, core, number: Number(process.env.PULL_NUMBER)});

  publish:
    name: Publish semantic verdict
    concurrency:
      group: semantic-review-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'NVIDIA/TensorRT-LLM' &&
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.login == 'coderabbitai[bot]' &&
      github.event.comment.user.id == 136622811 &&
      github.event.comment.user.type == 'Bot'
    permissions:
      contents: read
      issues: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/semantic_review.js
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v8
        with:
          script: |
            const {publish} = require('./.github/scripts/semantic_review.js');
            await publish({github, context, core});
