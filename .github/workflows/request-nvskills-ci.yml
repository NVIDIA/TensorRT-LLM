# Requests NVSkills CI validation and signing for agent skills under skills/.
# A maintainer comments `/nvskills-ci` on a pull request to start a run.
# Keep the body in sync with the canonical NVSkills CI team request template
# (NVIDIA/nvskills-ci: templates/team-request-workflow.yml).

name: Request NVSkills CI

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:

jobs:
  request:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/nvskills-ci')) ||
      (github.event_name == 'push' &&
        github.actor == (vars.NVSKILLS_SIGNATURE_PUSH_ACTOR || 'nv-skills-ci[bot]') &&
        startsWith(github.event.head_commit.message, vars.NVSKILLS_SIGNATURE_COMMIT_TITLE || 'Attach NVSkills validation signatures'))
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    uses: NVIDIA/skills/.github/workflows/team-request.yml@main
    secrets:
      NVSKILLS_CI_DISPATCH_TOKEN: ${{ secrets.NVSKILLS_CI_DISPATCH_TOKEN }}
