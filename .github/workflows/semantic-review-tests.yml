name: Semantic review automation tests
on:
  pull_request:
    paths:
      - '.github/scripts/semantic_review*'
      - '.github/semantic-review*.md'
      - '.github/workflows/semantic-review*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/semantic_review*.test.js
